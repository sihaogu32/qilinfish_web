n=\"true\"><\/video><\/span>\n                <span class=\"pd-scene__tx\">\n                    <b>Before you hand in a brief or report written with AI&#39;s help<\/b>\n                    <span class=\"pd-scene__go\">Tell us about that time <span class=\"arr\">→<\/span><\/span>\n                <\/span>\n            <\/a><a class=\"pd-scene\" href=\"#/en/survey/verify?pick=verify\">\n                <span class=\"pd-scene__img\"><video src=\"backend/src/main/resources/static/media/scene_agent.mp4\"\n                       poster=\"backend/src/main/resources/static/media/scene_agent.jpg\"\n                       muted loop playsinline preload=\"none\" data-sv-play aria-hidden=\"true\"><\/video><\/span>\n                <span class=\"pd-scene__tx\">\n                    <b>An AI agent reports &quot;done&quot;<\/b>\n                    <span class=\"pd-scene__go\">Tell us about that time <span class=\"arr\">→<\/span><\/span>\n                <\/span>\n            <\/a><a class=\"pd-scene\" href=\"#/en/survey/verify?pick=explain\">\n                <span class=\"pd-scene__img\"><video src=\"backend/src/main/resources/static/media/scene_explain.mp4\"\n                       poster=\"backend/src/main/resources/static/media/scene_explain.jpg\"\n                       muted loop playsinline preload=\"none\" data-sv-play aria-hidden=\"true\"><\/video><\/span>\n                <span class=\"pd-scene__tx\">\n                    <b>A manager, client or auditor asks &quot;where did this come from?&quot;<\/b>\n                    <span class=\"pd-scene__go\">Tell us about that time <span class=\"arr\">→<\/span><\/span>\n                <\/span>\n            <\/a><a class=\"pd-scene\" href=\"#/en/survey/verify?pick=inventory\">\n                <span class=\"pd-scene__img\"><video src=\"backend/src/main/resources/static/media/scene_legacy.mp4\"\n                       poster=\"backend/src/main/resources/static/media/scene_legacy.jpg\"\n                       muted loop playsinline preload=\"none\" data-sv-play aria-hidden=\"true\"><\/video><\/span>\n                <span class=\"pd-scene__tx\">\n                    <b>Taking over a legacy system with an incomplete handover, or preparing a migration<\/b>\n                    <span class=\"pd-scene__go\">Tell us about that time <span class=\"arr\">→<\/span><\/span>\n                <\/span>\n            <\/a>\n        <\/div>\n        <p class=\"pd-note\">Images are illustrative and AI-generated.<\/p>\n    <\/section>\n\n    <!-- ---- where the product stands ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"pd-stage\">\n            <p>This product is still being refined and is not open for use yet. First, we want to hear about the last time you checked AI output. Your answers will decide which part we build first.<\/p>\n            <a class=\"qf-btn qf-btn--primary\" href=\"#/en/survey/verify\">Tell us about that time <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n    <\/section>\n\n    <p class=\"pd-also\">We also take on web development and project design → <a href=\"#/en/contact\">Contact us<\/a><\/p>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/resources": {"title": "Resources — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Resources — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/resources\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/resources\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/resources\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/resources\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <section class=\"qf-section\">\n        <div data-reveal>\n            <div class=\"qf-eyebrow\">RESOURCES // external references<\/div>\n            <h1 class=\"qf-title\">Resources<\/h1>\n            <p class=\"qf-lede\">This page lists the external data sources, official documents and public databases we use often during development, so visitors can cross-check for themselves.<\/p>\n        <\/div>\n\n        <div class=\"qf-list\" data-reveal>\n            <a href=\"https://law.moj.gov.tw/\" target=\"_blank\" rel=\"noopener\">\n                <span class=\"n\">R-01<\/span>\n                <span class=\"label\">Laws &amp; Regulations Database of the Republic of China (Taiwan)<\/span>\n                <span class=\"desc\">Maintained by the Ministry of Justice — the search portal for Taiwan&#39;s current laws and regulations, judicial precedents and interpretations, orders, and administrative rulings.<\/span>\n                <span class=\"arr\">↗<\/span>\n            <\/a>\n        <\/div>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/survey/content": {"title": "Can you show where every number you deliver came from? — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Can you show where every number you deliver came from? — Qilinfish Studio<\/title>\n    <meta name=\"description\" content=\"A six-minute survey: the last time you delivered content with numbers or quotes in it, how you checked the sources, how long it took, and what you would pay.\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:title\" content=\"Can you show where every number you deliver came from?\">\n    <meta property=\"og:description\" content=\"A six-minute survey: the last time you delivered content with numbers or quotes in it, how you checked the sources, how long it took, and what you would pay.\">\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/survey/content\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/survey/content\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\" class=\"is-active\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/survey/content\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/survey/content\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening: one title, why we ask, three promises ---- -->\n    <section class=\"sv-section sc-open\">\n        <div class=\"sv-eb\">SURVEY // where your numbers come from<\/div>\n        <h1 class=\"sc-title\">Can you show where every number you deliver came from?<\/h1>\n        <p class=\"sc-why\">We are building a content tool that keeps a source behind every sentence. First we want to know whether this is a real problem in your work, and how big a problem it is.<\/p>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>About 6 minutes<\/b><span>Open questions can be left blank<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>Private<\/b><span>Only we can see your name and contact details<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>Summary report<\/b><span>Sent to the contact you leave; first to hear when trials open<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form: one submit sends everything ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sc-form\">\n    <form class=\"qf-survey sv-form sc-form\" method=\"post\" action=\"/en/survey/content\"\n          data-content-survey novalidate>\n\n        <!-- ---- 01 about you ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p1\">// 01 · About you<\/div>\n\n        <div class=\"qf-field\" data-q=\"role\" data-required>\n            <div class=\"qf-field__q\">Which is closest to you?<span class=\"qf-field__req\">Required<\/span><\/div>\n            <div class=\"qf-choices qf-choices--stack\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"行銷／內容工作室\" id=\"role1\" name=\"role\">Marketing / content studio<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"自由接案的內容或行銷工作者\" id=\"role2\" name=\"role\">Freelance content or marketing professional<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"研究型創作者（部落格、電子報、YouTube…）\" id=\"role3\" name=\"role\">Research-driven creator (blog, newsletter, YouTube…)<\/label><label class=\"qf-choice qf-choice--other\"><input type=\"radio\" value=\"其他\" id=\"role4\" name=\"role\">Other<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"Please say which\" aria-label=\"Other: please say which\" data-other-text id=\"roleOther\" name=\"roleOther\" value=\"\"><\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Please pick one; if you pick &quot;Other&quot;, please say which.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"teamSize\" data-required>\n            <div class=\"qf-field__q\">How many people are on your team?<span class=\"qf-field__req\">Required<\/span><\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"1 人\" id=\"teamSize1\" name=\"teamSize\">Just me<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"2–5\" id=\"teamSize2\" name=\"teamSize\">2–5<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"6–20\" id=\"teamSize3\" name=\"teamSize\">6–20<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"20 人以上\" id=\"teamSize4\" name=\"teamSize\">More than 20<\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Please pick one.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"monthlyPieces\" data-required>\n            <div class=\"qf-field__q\">How many pieces of content do you deliver a month?<span class=\"qf-field__req\">Required<\/span><\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"1–3\" id=\"monthlyPieces1\" name=\"monthlyPieces\">1–3<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"4–10\" id=\"monthlyPieces2\" name=\"monthlyPieces\">4–10<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"11–30\" id=\"monthlyPieces3\" name=\"monthlyPieces\">11–30<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"30 以上\" id=\"monthlyPieces4\" name=\"monthlyPieces\">More than 30<\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Please pick one.<\/div>\n        <\/div>\n\n        <!-- ---- 02 the last time ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p2\">// 02 · The last time<\/div>\n\n        <div class=\"qf-field\" data-q=\"lastPiece\">\n            <label for=\"sc-last\">The last time you delivered a piece with numbers or quotes in it: what was it, and who was it for?<\/label>\n            <textarea id=\"sc-last\" rows=\"4\" maxlength=\"2000\" name=\"lastPiece\"><\/textarea>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"howChecked\">\n            <label for=\"sc-how\">How did you check those numbers and quotes?<\/label>\n            <textarea id=\"sc-how\" rows=\"4\" maxlength=\"2000\" name=\"howChecked\"><\/textarea>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"checkHours\" data-number>\n            <div class=\"qf-field__q\">Roughly how long did checking the sources take?<\/div>\n            <div class=\"qf-inline\">\n                <input id=\"sc-check-hours\" type=\"text\" inputmode=\"decimal\" maxlength=\"16\" aria-label=\"Hours spent checking sources, per piece\" name=\"checkHours\" value=\"\"><span class=\"sc-unit\">hours per piece<\/span>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Hours must be a number, e.g. 2 or 1.5.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"afterDelivery\">\n            <div class=\"qf-field__q\">After you delivered it:<\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"沒人問\" id=\"afterDelivery1\" name=\"afterDelivery\">No one asked<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"有人問出處\" id=\"afterDelivery2\" name=\"afterDelivery\">Someone asked for the sources<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"有人指出錯誤\" id=\"afterDelivery3\" name=\"afterDelivery\">Someone pointed out an error<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"不知道\" id=\"afterDelivery4\" name=\"afterDelivery\">Don&#39;t know<\/label>\n            <\/div>\n        <\/div>\n\n        \n        <div class=\"qf-field\" data-q=\"afterDeliveryCost\" data-show-if=\"afterDelivery=有人問出處|有人指出錯誤\">\n            <label for=\"sc-after-cost\">What did you do about it, and what did it cost you?<\/label>\n            <div class=\"qf-field__hint\" data-nojs-hint>Only if you picked &quot;Someone asked for the sources&quot; or &quot;Someone pointed out an error&quot;.<\/div>\n            <textarea id=\"sc-after-cost\" rows=\"4\" maxlength=\"2000\" name=\"afterDeliveryCost\"><\/textarea>\n        <\/div>\n\n        <!-- ---- 03 how you work now ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p3\">// 03 · How you work now<\/div>\n\n        <div class=\"qf-field\" data-q=\"tools\">\n            <div class=\"qf-field__q\">Which tools do you use for content now?<\/div>\n            <div class=\"qf-field__hint\">Pick all that apply<\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"ChatGPT\" id=\"tools1\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>ChatGPT<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"Claude\" id=\"tools2\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>Claude<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"Gemini\" id=\"tools3\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>Gemini<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"Perplexity\" id=\"tools4\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>Perplexity<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"Jasper／Koala 等 AI 寫作工具\" id=\"tools5\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>Jasper / Koala and other AI writing tools<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"ComfyUI／Midjourney 等生圖工具\" id=\"tools6\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>ComfyUI / Midjourney and other image generators<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"都沒用\" data-exclusive=\"true\" id=\"tools7\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>None<\/label><label class=\"qf-choice qf-choice--check qf-choice--other\"><input type=\"checkbox\" value=\"其他\" id=\"tools8\" name=\"tools\"><input type=\"hidden\" name=\"_tools\" value=\"on\"/>Other<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"Please name the tool\" aria-label=\"Other: please name the tool\" data-other-text id=\"toolsOther\" name=\"toolsOther\" value=\"\"><\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; An option is not on the list. Please tick again.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"toolCount\">\n            <div class=\"qf-field__q\">From choosing a topic to delivering, how many tools do you switch between?<\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"1–2\" id=\"toolCount1\" name=\"toolCount\">1–2<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"3–4\" id=\"toolCount2\" name=\"toolCount\">3–4<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"5 個以上\" id=\"toolCount3\" name=\"toolCount\">5 or more<\/label>\n            <\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"moveHours\" data-number>\n            <div class=\"qf-field__q\">Roughly how much time goes into moving material between tools and reformatting?<\/div>\n            <div class=\"qf-inline\">\n                <input id=\"sc-move-hours\" type=\"text\" inputmode=\"decimal\" maxlength=\"16\" aria-label=\"Hours spent moving material and reformatting, per piece\" name=\"moveHours\" value=\"\"><span class=\"sc-unit\">hours per piece<\/span>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Hours must be a number, e.g. 2 or 1.5.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"formats\">\n            <div class=\"qf-field__q\">In the last month, which formats did you actually deliver?<\/div>\n            <div class=\"qf-field__hint\">Pick all that apply<\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"部落格文章／網站頁面\" id=\"formats1\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Blog posts / web pages<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"WordPress 等網站後台的文章\" id=\"formats2\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Posts in a site back end such as WordPress<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"電子報\" id=\"formats3\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Newsletters<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"社群貼文（圖文、輪播）\" id=\"formats4\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Social posts (graphics, carousels)<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"短影音、影片腳本\" id=\"formats5\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Short videos, video scripts<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"簡報\" id=\"formats6\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Slide decks<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"研究報告、白皮書（PDF）\" id=\"formats7\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Research reports, white papers (PDF)<\/label><label class=\"qf-choice qf-choice--check\"><input type=\"checkbox\" value=\"產品介紹、型錄\" id=\"formats8\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Product introductions, catalogs<\/label><label class=\"qf-choice qf-choice--check qf-choice--other\"><input type=\"checkbox\" value=\"其他\" id=\"formats9\" name=\"formats\"><input type=\"hidden\" name=\"_formats\" value=\"on\"/>Other<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"Please say which format\" aria-label=\"Other: please say which format\" data-other-text id=\"formatsOther\" name=\"formatsOther\" value=\"\"><\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; An option is not on the list. Please tick again.<\/div>\n        <\/div>\n\n        <!-- ---- 04 pricing: the blind question, then the real price ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p4\">// 04 · Pricing<\/div>\n\n        <div class=\"qf-field\" data-q=\"blind\" data-required data-blind>\n            <div class=\"qf-field__q\">For a tool like this, how much would you pay to buy it outright, once?<span class=\"qf-field__req\">Required<\/span><\/div>\n            <div class=\"qf-inline\">\n                <span class=\"qf-inline__group\">US$ <input id=\"sc-blind\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" aria-label=\"Amount you would pay (US dollars)\" data-amount name=\"blindUsd\" value=\"\"><\/span>\n            <\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"不會付費\" id=\"blindOption1\" name=\"blindOption\">Would not pay<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"不知道\" id=\"blindOption2\" name=\"blindOption\">Don&#39;t know<\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; Please enter an amount, or pick &quot;Would not pay&quot; or &quot;Don&#39;t know&quot;.<\/div>\n            \n            <p class=\"sc-lock-note\" data-blind-note hidden>Once you have seen the price, this answer can no longer be changed. That way we know the price you had in mind.<\/p>\n        <\/div>\n        <button type=\"button\" class=\"qf-btn sc-next\" data-blind-next hidden>Next <span class=\"arr\">→<\/span><\/button>\n        \n        <input type=\"hidden\" data-blind-locked id=\"blindLocked\" name=\"blindLocked\" value=\"\">\n\n        <div data-reveal-block>\n            <div class=\"qf-field\" data-q=\"revealBuy\" data-required>\n                <div class=\"qf-field__q\">The actual price: a one-time purchase of US$150, including a 3-month Maintenance Agreement, then US$30 every 3 months.<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"會買\" id=\"revealBuy1\" name=\"revealBuy\">I would buy it<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"會考慮\" id=\"revealBuy2\" name=\"revealBuy\">I would consider it<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"太貴\" id=\"revealBuy3\" name=\"revealBuy\">Too expensive<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"不需要\" id=\"revealBuy4\" name=\"revealBuy\">I don&#39;t need it<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; Please pick one.<\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-q=\"revealRenew\" data-required>\n                <div class=\"qf-field__q\">When the Maintenance Agreement ends, would you renew it?<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"會\" id=\"revealRenew1\" name=\"revealRenew\">Yes<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"看當時的更新內容\" id=\"revealRenew2\" name=\"revealRenew\">Depends on what the updates are<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"不會\" id=\"revealRenew3\" name=\"revealRenew\">No<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; Please pick one.<\/div>\n            <\/div>\n        <\/div>\n\n        <!-- ---- 05 contact: name, contact, trial; nothing else (B23) ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p5\">// 05 · Contact<\/div>\n\n        <div class=\"qf-field\" data-q=\"name\" data-required>\n            <label for=\"sc-name\">Name<span class=\"qf-field__req\">Required<\/span><\/label>\n            <input id=\"sc-name\" type=\"text\" maxlength=\"64\" name=\"name\" value=\"\">\n            <div class=\"qf-field__err\">&gt; Please leave your name.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"contact\" data-required>\n            <label for=\"sc-contact\">Contact<span class=\"qf-field__req\">Required<\/span><\/label>\n            <div class=\"qf-field__hint\">Email or phone<\/div>\n            <input id=\"sc-contact\" type=\"text\" maxlength=\"128\" data-contact name=\"contact\" value=\"\">\n            <div class=\"qf-field__err\">&gt; Please fill in an email address or phone number.<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"trial\">\n            <div class=\"qf-field__q\">Would you be willing to try it later and give us feedback?<\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"願意\" id=\"trial1\" name=\"trial\">Yes<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"不願意\" id=\"trial2\" name=\"trial\">No<\/label>\n            <\/div>\n        <\/div>\n\n        <button type=\"submit\" class=\"qf-btn qf-btn--primary\">Send <span class=\"arr\">→<\/span><\/button>\n\n        <div class=\"qf-form-status\"\n             data-form-status><\/div>\n    <\/form>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/survey/verify": {"title": "Take the survey — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Take the survey — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/survey/verify\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/survey/verify\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\" class=\"is-active\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/survey/verify\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/survey/verify\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"sv-hero\">\n        <video class=\"sv-hero__video\" src=\"backend/src/main/resources/static/media/court.mp4\"\n               poster=\"backend/src/main/resources/static/media/court.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"sv-corner tl\"><\/span><span class=\"sv-corner tr\"><\/span>\n        <div class=\"sv-hero__inner\">\n            <div class=\"sv-rec\"><span><span class=\"sv-rec__dot\">●<\/span> REC<\/span><span>2023-06-22 · Federal court, New York<\/span><span class=\"warn\">6 cases did not exist<\/span><\/div>\n            <h1 class=\"sv-hero__title\">Every one of these was handed over first, <em>and caught by someone else afterwards.<\/em><\/h1>\n            <p class=\"sv-hero__sub\">Lawyers, consultants, support staff and engineers have all had AI hand them something that was &quot;almost right&quot;. We want to hear about your most recent time: how did you decide it was good to go?<\/p>\n            <a class=\"qf-btn qf-btn--primary sv-cta\" href=\"#sv-choose\">Tell us about that time <span class=\"arr\">↓<\/span><\/a>\n            <div class=\"sv-meta\"><span>TIME / <b>About 7 minutes<\/b><\/span><span>PRIVACY / <b>No names or companies published<\/b><\/span><span>YOU GET / <b>The summary report<\/b><\/span><\/div>\n        <\/div>\n        <span class=\"sv-ai\">Illustration · AI generated<\/span>\n    <\/header>\n\n    <!-- ---- numbers ---- -->\n    <section class=\"sv-section\">\n        <div class=\"sv-eb\">fig.1 · Already on the record<\/div>\n        <div class=\"sv-dots\">\n            <canvas data-sv-dots width=\"1400\" height=\"560\" aria-label=\"2,207 dots, one for every AI-fabricated citation in a court record\"><\/canvas>\n            <div class=\"sv-dots__over\">\n                <b data-sv-count>2,207<\/b>\n                <span>Every dot is one AI-fabricated citation in a court record. The ones who caught it were almost always opposing counsel or the judge.<\/span>\n                <span class=\"sv-src\">AI HALLUCINATION CASES DATABASE · D. CHARLOTIN · AS OF 2026-10-23<\/span>\n            <\/div>\n        <\/div>\n        <div class=\"sv-two\" data-sv-grow>\n            <div class=\"sv-panel\">\n                <div class=\"sv-eb\">fig.2 · Distrust, but not a check every time<\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Do not fully trust AI output<\/span><b>96%<\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:96%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Check before every submission<\/span><b>48%<\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <span class=\"sv-gapq\">Those 48 points in between: what decides it is good to go?<\/span>\n                <span class=\"sv-src\">SONAR 2026 · 1,100+ developers · vendor survey<\/span>\n            <\/div>\n            <div class=\"sv-panel sv-scale\">\n                <div class=\"sv-eb\">fig.3 · The price once it is found<\/div>\n                <svg viewBox=\"0 0 540 150\" role=\"img\" aria-label=\"Amounts on a log scale: airline chatbot CA$812, lawyer&#39;s brief US$5,000, consulting report refund AU$97,000, false AI claims US$400,000, insurer&#39;s system change NT$30M, bank system migration £48.65M\">\n                    <line x1=\"20\" y1=\"80\" x2=\"520\" y2=\"80\" class=\"ax\"/>\n                    <g class=\"tick\" text-anchor=\"middle\">\n                        <text x=\"20\" y=\"98\">$100<\/text><text x=\"103\" y=\"98\">$1K<\/text><text x=\"187\" y=\"98\">$10K<\/text><text x=\"270\" y=\"98\">$100K<\/text><text x=\"353\" y=\"98\">$1M<\/text><text x=\"437\" y=\"98\">$10M<\/text><text x=\"520\" y=\"98\">$100M<\/text>\n                    <\/g>\n                    <g class=\"lab\">\n                        <g class=\"pt\" style=\"transition-delay:.1s\"><circle cx=\"84\" cy=\"80\" r=\"4.5\"/><text x=\"84\" y=\"62\" text-anchor=\"middle\">Airline chatbot<\/text><text x=\"84\" y=\"50\" text-anchor=\"middle\" class=\"amt\">CA$812<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.35s\"><circle cx=\"161\" cy=\"80\" r=\"4.5\"/><text x=\"161\" y=\"118\" text-anchor=\"middle\">Lawyer&#39;s brief<\/text><text x=\"161\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$5K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.6s\"><circle cx=\"252\" cy=\"80\" r=\"4.5\"/><text x=\"244\" y=\"62\" text-anchor=\"middle\">Consulting refund<\/text><text x=\"244\" y=\"50\" text-anchor=\"middle\" class=\"amt\">AU$97K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.85s\"><circle cx=\"320\" cy=\"80\" r=\"4.5\"/><text x=\"316\" y=\"118\" text-anchor=\"middle\">False AI claims<\/text><text x=\"316\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$400K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.1s\"><circle cx=\"350\" cy=\"80\" r=\"5.5\"/><line x1=\"352\" y1=\"74\" x2=\"368\" y2=\"36\" class=\"lead\"/><text x=\"372\" y=\"30\" text-anchor=\"middle\">Insurer&#39;s new system<\/text><text x=\"372\" y=\"18\" text-anchor=\"middle\" class=\"amt\">NT$30M<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.35s\"><circle cx=\"500\" cy=\"80\" r=\"7\" class=\"big\"/><text x=\"506\" y=\"62\" text-anchor=\"end\">Bank migration<\/text><text x=\"506\" y=\"50\" text-anchor=\"end\" class=\"amt\">£48.65M<\/text><\/g>\n                    <\/g>\n                <\/svg>\n                <span class=\"sv-src\">Fines, damages and refunds, roughly converted to US dollars and placed on one log scale<\/span>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- four stills ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">fig.4 · Four things that really happened<\/div>\n        <div class=\"sv-reel\">\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/court.mp4\" poster=\"backend/src/main/resources/static/media/court.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"A lawyer&#39;s desk at night, the brief&#39;s citations circled in red\"><\/video>\n                <figcaption><span class=\"d\">2023-06-22 · Federal court, New York<\/span><b>A lawyer wrote a brief with AI and filed 6 cases that do not exist<\/b><span class=\"amt\">Fined US$5,000<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/chat.mp4\" poster=\"backend/src/main/resources/static/media/chat.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"A phone on an airport table, open on a support chat\"><\/video>\n                <figcaption><span class=\"d\">2024-02-14 · Canada<\/span><b>An airline&#39;s support chatbot got the refund rules wrong, and the airline was held liable<\/b><span class=\"amt\">Ordered to pay CA$812<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/review.mp4\" poster=\"backend/src/main/resources/static/media/review.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"An engineer reviewing code on screen late at night\"><\/video>\n                <figcaption><span class=\"d\">2025 · STACK OVERFLOW DEVELOPER SURVEY<\/span><b>66% have met AI answers that were &quot;almost right, but not quite&quot;<\/b><span class=\"amt\">31,476 respondents<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/server.mp4\" poster=\"backend/src/main/resources/static/media/server.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Reading system documents by flashlight in an old server room\"><\/video>\n                <figcaption><span class=\"d\">2019-09 · Taiwan<\/span><b>A life insurer replaced its core system, and 152,000 policies went wrong<\/b><span class=\"amt\">Fined NT$30M<\/span><\/figcaption><\/figure>\n        <\/div>\n        <div class=\"sv-note\">The pictures are AI-generated illustrations, not the actual scenes.<\/div>\n    <\/section>\n\n    <!-- ---- choose one ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-choose\">\n        <div class=\"sv-eb\">STEP 01 · Pick one<\/div>\n        <h2 class=\"sv-h2\">Which one was your most recent?<\/h2>\n        <div class=\"sv-choose\" role=\"group\" aria-label=\"Pick one experience\">\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"verify\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_desk.mp4\" poster=\"backend/src/main/resources/static/media/bp_desk.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: a checklist on a review desk with one box left empty\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-A<\/span><span class=\"st\">Pick this<\/span><\/span><b>Checking whether AI output can be used<\/b><span class=\"s\">Code, reports, support replies, an agent saying &quot;done&quot;<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"explain\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_chain.mp4\" poster=\"backend/src/main/resources/static/media/bp_chain.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: one link in a chain of evidence cracked open\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-B<\/span><span class=\"st\">Pick this<\/span><\/span><b>Being asked &quot;where did this come from?&quot;<\/b><span class=\"s\">A manager, client, auditor or regulator wants you to explain<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"inventory\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_mainframe.mp4\" poster=\"backend/src/main/resources/static/media/bp_mainframe.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: exploded view of an old mainframe\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-C<\/span><span class=\"st\">Pick this<\/span><\/span><b>Working out what a legacy system does<\/b><span class=\"s\">Taking over, replacing a system, documents that do not match reality<\/span><\/span>\n            <\/button>\n        <\/div>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"other\">None of these three? <u>Write down what you ran into<\/u> →<\/button>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"none\">Never happened to you? <u>Please tell us too, it is one question<\/u> →<\/button>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>About 7 minutes<\/b><span>A few sentences is fine<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>Not published<\/b><span>Only we see names and companies<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>The summary report<\/b><span>Sent to the contact you leave<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-form\">\n        <div class=\"sv-formwrap\">\n            <nav class=\"sv-toc\" aria-label=\"Form sections\" data-sv-toc>\n                <a href=\"#sv-p1\"><span>01<\/span>About you<\/a>\n                <a href=\"#sv-p2\"><span>02<\/span>The last time<\/a>\n                <a href=\"#sv-p3\" data-branch-link=\"story\"><span>03<\/span>What it cost<\/a>\n                <a href=\"#sv-p4\" data-branch-link=\"story\"><span>04<\/span>What you tried<\/a>\n                <a href=\"#sv-p5\"><span>05<\/span>Follow-up<\/a>\n                <a href=\"#sv-p6\"><span>06<\/span>Contact<\/a>\n            <\/nav>\n\n        <form class=\"qf-survey sv-form\" method=\"post\" action=\"/en/survey/verify\" data-survey-form novalidate>\n\n            <!-- ---- about you ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p1\">// 01 · About you<\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">Which of these is closest to your role?<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程師\" id=\"role1\" name=\"role\">Engineer<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程主管或技術主管\" id=\"role2\" name=\"role\">Engineering or technical manager<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"法遵或法務\" id=\"role3\" name=\"role\">Compliance or legal<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"內部稽核或風險管理\" id=\"role4\" name=\"role\">Internal audit or risk management<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"資訊或 IT 管理\" id=\"role5\" name=\"role\">Information or IT management<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"產品或專案管理\" id=\"role6\" name=\"role\">Product or project management<\/label>\n                    <label cl roperty=\"og:type\" content=\"website\">\n    <meta property=\"og:title\" content=\"每一句都查得到出處\">\n    <meta property=\"og:description\" content=\"把一個主題做成每一句都查得到出處的內容：點文章裡的編號，就看得到原文引句、限定條件和原始網址。\">\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/products/content\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/products/content\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\" class=\"is-active\">產品方案<\/a>\n        <a href=\"#/blog\">文章<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/products/content\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/products/content\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- 1 the demo: a real excerpt from one of our articles ---- -->\n    <section class=\"sv-section pc-open\">\n        <div class=\"sv-eb\">PRODUCT // every sentence has a source<\/div>\n        <h1 class=\"sc-title\">每一句都查得到出處<\/h1>\n        \n        <div class=\"pc-demo-wrap\" data-ev-marks=\"這段話的出處\">\n            <figure class=\"pc-demo\">\n                <div class=\"pc-demo__hint\">點編號，看這段話的出處<\/div>\n                <div class=\"pc-demo__text\"><p>Ipsos 2025 年在 30 個國家訪問了 23,216 人，平均 79% 同意「用 AI 的產品與服務應該要揭露這件事」。<sup class=\"cite\" data-e=\"E10\"><a href=\"/blog/solo-trust#r3\">[3]<\/a><\/sup>Salesforce 2024 年調查 18 國的 15,015 名消費者，近 75% 想知道自己是不是在跟 AI 代理溝通。<sup class=\"cite\" data-e=\"E12\"><a href=\"/blog/solo-trust#r4\">[4]<\/a><\/sup><\/p><\/div>\n                <figcaption class=\"pc-demo__from\">摘自本站文章〈客戶問「這是怎麼來的？」，您拿得出什麼？〉<\/figcaption>\n            <\/figure>\n            \n<template data-ev-src=\"E10\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ipsos<\/b><span>Ipsos AI Monitor 2025<\/span><time>2025-06-06<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Seventy-nine percent agree (40% strongly agree) that companies using AI should have to disclose that use.&quot;<\/p><p class=\"ev-tr\">79% 同意（40% 非常同意）用 AI 的公司應該要揭露這件事。<\/p><p class=\"ev-line\">報告第 22 頁題目：&quot;How much do you agree or disagree with the following? Products and services using artificial intelligence should have to disclose that use&quot;<\/p><p class=\"ev-tr\">你多同意下列說法？用人工智慧的產品與服務應該要揭露這件事。<\/p><p class=\"ev-line\">同頁：&quot;30-country average 79% Indonesia 91% … Japan 66%&quot;；不同意欄 30 國平均 7%。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">&quot;Base: 23,216 online adults under age 75 across 30 countries, interviewed March 21 – April 4, 2025&quot;。部分國家樣本比一般人口更都市、更高學歷或更富裕。30 國平均未依人口加權，不代表總體結果。題目是「產品與服務」，不是專業顧問服務。台灣不在 30 國內。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞頁 <a href=\"https://www.ipsos.com/en-us/conflicting-global-perceptions-around-ai-present-mixed-signals-brands\" rel=\"noopener\" target=\"_blank\">https://www.ipsos.com/en-us/conflicting-global-perceptions-around-ai-present-mixed-signals-brands<\/a> ；報告 PDF <a href=\"https://www.ipsos.com/sites/default/files/ct/news/documents/2025-06/Ipsos-AI-Monitor-2025_0.pdf\" rel=\"noopener\" target=\"_blank\">https://www.ipsos.com/sites/default/files/ct/news/documents/2025-06/Ipsos-AI-Monitor-2025_0.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E12\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Salesforce<\/b><span>（新聞頁，查核未逐字取得標題；網址路徑為 ai-customer-research）<\/span><time>2024-10-31<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Nearly 75% of consumers want to know if they&#39;re communicating with an AI agent.&quot;<\/p><p class=\"ev-tr\">近 75% 的消費者想知道自己是不是在跟 AI 代理溝通。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">15,015 名消費者，2024-07-16 至 08-16，YouGov 線上執行；加權後代表 18 國成人（18 歲以上）。同頁樣本數寫法不一致，引用時用 15,015。出版者販售 AI 代理產品。題目是「跟 AI 代理溝通」，不是「交付成果用了 AI」。台灣不在 18 國內。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.salesforce.com/news/stories/ai-customer-research/\" rel=\"noopener\" target=\"_blank\">https://www.salesforce.com/news/stories/ai-customer-research/<\/a><\/p>\n<\/section><\/template>\n\n        <\/div>\n    <\/section>\n\n    <!-- ---- 2 why it usually breaks: five tools, five breaks; one line, one source trail ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">WHY // where the source gets lost<\/div>\n        <h2 class=\"pd-h2\">為什麼平常做不到<\/h2>\n        <div class=\"pc-chain\">\n            <div class=\"pc-chain__row pc-chain__row--broken\">\n                <b class=\"pc-chain__label\">平常的做法：五個工具<\/b>\n                <ol class=\"pc-steps\"><li>查資料<\/li><li>寫稿<\/li><li>配圖<\/li><li>排版<\/li><li>上線<\/li><\/ol>\n                <p>每換一次工具，出處連結就斷一次：查到的原文和網址留在上一個工具裡，下一步只拿到文字。<\/p>\n            <\/div>\n            <div class=\"pc-chain__row pc-chain__row--line\">\n                <b class=\"pc-chain__label\">同一條線：從提問到成品<\/b>\n                <ol class=\"pc-steps\"><li>提問<\/li><li>研究<\/li><li>查核<\/li><li>大綱<\/li><li>製作<\/li><li>驗收<\/li><li>成品<\/li><\/ol>\n                <p>從提問到成品都在同一條流程裡，不換工具，所以每一句的出處一路跟著，到成品還查得到。<\/p>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 3 real examples: our articles with evidence marks, in this language; no such article, no part 3 (D59) ---- -->\n    <section class=\"sv-section sv-section--flush\" data-pc-cases>\n        <div class=\"sv-eb\">CASES // made this way<\/div>\n        <h2 class=\"pd-h2\">實際案例<\/h2>\n        <div class=\"bl-list\">\n            <a class=\"bl-card\" href=\"#/blog/solo-trust\">\n                <div class=\"bl-card__img\"><div class=\"bl-cover\">\n    <img src=\"content/articles/solo-trust/media/hero.jpg\" alt=\"\" loading=\"lazy\">\n    <span class=\"bl-ai\">示意畫面 · AI 生成<\/span>\n<\/div><\/div>\n                <div class=\"bl-card__tx\">\n                    <time class=\"bl-date\" datetime=\"2026-10-28\">2026-10-28<\/time>\n                    <b>客戶問「這是怎麼來的？」，您拿得出什麼？<\/b>\n                    <span class=\"pd-scene__go\">閱讀全文 <span class=\"arr\">→<\/span><\/span>\n                <\/div>\n            <\/a>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 4 how you pay: the structure only, no amounts (D10) ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">PRICING // how it is paid for<\/div>\n        <h2 class=\"pd-h2\">怎麼付費<\/h2>\n        <div class=\"pc-pay\">\n            <p class=\"pc-pay__main\">一次買斷，永久使用；之後可選擇加購維護合約，取得更新與修正。沒有維護合約也能繼續用，只是拿不到更新。<\/p>\n            <ul class=\"pc-pay__notes\">\n                <li>維護合約不含一對一技術支援。<\/li>\n                <li>沒有維護合約，就拿不到任何更新，包括外部服務（AI API 等）改版造成的修正。<\/li>\n            <\/ul>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 5 where the product stands ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"pd-stage\">\n            <p>這個產品還在打磨，還沒開放使用。我們想先聽聽您最近一次交出有數字或引用的內容時，是怎麼確認出處的；您的回答會決定我們先做哪一部分。<\/p>\n            <a class=\"qf-btn qf-btn--primary\" href=\"#/survey/content\">說說您怎麼確認出處 <span class=\"arr\">→<\/s <meta name=\"description\" content=\"六分鐘的問卷：說說您最近一次交出有數字或引用的內容，怎麼確認出處、花了多久、願意付多少。\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:title\" content=\"您交出去的內容，出處都查得到嗎？\">\n    <meta property=\"og:description\" content=\"六分鐘的問卷：說說您最近一次交出有數字或引用的內容，怎麼確認出處、花了多久、願意付多少。\">\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/survey/content\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/survey/content\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\" class=\"is-active\">產品方案<\/a>\n        <a href=\"#/blog\">文章<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/survey/content\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/survey/content\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening: one title, why we ask, three promises ---- -->\n    <section class=\"sv-section sc-open\">\n        <div class=\"sv-eb\">SURVEY // where your numbers come from<\/div>\n        <h1 class=\"sc-title\">您交出去的內容，出處都查得到嗎？<\/h1>\n        <p class=\"sc-why\">我們在做一個讓每一句都查得到出處的內容工具。想先知道，這件事在您的工作裡是不是真的麻煩、麻煩到什麼程度。<\/p>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>約 6 分鐘<\/b><span>開放題可以留空<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>不公開<\/b><span>名字和聯絡方式只有我們看得到<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>彙整報告<\/b><span>寄到您留的聯絡方式；開放試用時優先通知您<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form: one submit sends everything ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sc-form\">\n    <form class=\"qf-survey sv-form sc-form\" method=\"post\" action=\"/survey/content\"\n          data-content-survey novalidate>\n\n        <!-- ---- 01 about you ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p1\">// 01 · 關於您<\/div>\n\n        <div class=\"qf-field\" data-q=\"role\" data-required>\n            <div class=\"qf-field__q\">您最接近哪一種？<span class=\"qf-field__req\">必填<\/span><\/div>\n            <div class=\"qf-choices qf-choices--stack\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"行銷／內容工作室\" id=\"role1\" name=\"role\">行銷／內容工作室<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"自由接案的內容或行銷工作者\" id=\"role2\" name=\"role\">自由接案的內容或行銷工作者<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"研究型創作者（部落格、電子報、YouTube…）\" id=\"role3\" name=\"role\">研究型創作者（部落格、電子報、YouTube…）<\/label><label class=\"qf-choice qf-choice--other\"><input type=\"radio\" value=\"其他\" id=\"role4\" name=\"role\">其他<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"請寫下是哪一種\" aria-label=\"其他：請寫下是哪一種\" data-other-text id=\"roleOther\" name=\"roleOther\" value=\"\"><\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; 請選一項；選「其他」的話，請寫下是哪一種。<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"teamSize\" data-required>\n            <div class=\"qf-field__q\">團隊幾個人？<span class=\"qf-field__req\">必填<\/span><\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"1 人\" id=\"teamSize1\" name=\"teamSize\">1 人<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"2–5\" id=\"teamSize2\" name=\"teamSize\">2–5<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"6–20\" id=\"teamSize3\" name=\"teamSize\">6–20<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"20 人以上\" id=\"teamSize4\" name=\"teamSize\">20 人以上<\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; 請選一項。<\/div>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"monthlyPieces\" data-required>\n            <div class=\"qf-field__q\">每個月交出幾篇內容？<span class=\"qf-field__req\">必填<\/span><\/div>\n            <div class=\"qf-choices\">\n                <label class=\"qf-choice\"><input type=\"radio\" value=\"1–3\" id=\"monthlyPieces1\" name=\"monthlyPieces\">1–3<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"4–10\" id=\"monthlyPieces2\" name=\"monthlyPieces\">4–10<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"11–30\" id=\"monthlyPieces3\" name=\"monthlyPieces\">11–30<\/label><label class=\"qf-choice\"><input type=\"radio\" value=\"30 以上\" id=\"monthlyPieces4\" name=\"monthlyPieces\">30 以上<\/label>\n            <\/div>\n            <div class=\"qf-field__err\">&gt; 請選一項。<\/div>\n        <\/div>\n\n        <!-- ---- 02 the last time ---- -->\n        <div class=\"qf-survey__part\" id=\"sc-p2\">// 02 · 最近一次<\/div>\n\n        <div class=\"qf-field\" data-q=\"lastPiece\">\n            <label for=\"sc-last\">最近一次交出一篇「裡面有數字或引用」的內容，是什麼、交給誰？<\/label>\n            <textarea id=\"sc-last\" rows=\"4\" maxlength=\"2000\" name=\"lastPiece\"><\/textarea>\n        <\/div>\n\n        <div class=\"qf-field\" data-q=\"howChecked\">\n            <label for=\"sc-how\">裡面的數字和引用，您是怎麼確認的？<\/label>\n            <textarea id=\"sc-how\" rows=\"4\" maxlength=\"2000\" name=\"howChecked\"><\/textarea>\n        <\/div>\ ain\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_chain.mp4\" poster=\"backend/src/main/resources/static/media/bp_chain.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"藍圖：證據鏈中間一環裂開\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-B<\/span><span class=\"st\">選這個<\/span><\/span><b>被問「這是怎麼來的」<\/b><span class=\"s\">主管、客戶、稽核、主管機關要您說明<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"inventory\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_mainframe.mp4\" poster=\"backend/src/main/resources/static/media/bp_mainframe.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"藍圖：舊主機拆解圖\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-C<\/span><span class=\"st\">選這個<\/span><\/span><b>弄清楚舊系統在做什麼<\/b><span class=\"s\">接手、換系統、文件跟實際對不上<\/span><\/span>\n            <\/button>\n        <\/div>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"other\">都不是這三種？<u>寫下您遇到的<\/u> →<\/button>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"none\">都沒遇過？<u>也請告訴我們，只有一題<\/u> →<\/button>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>約 7 分鐘<\/b><span>可以只寫幾句<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>不公開<\/b><span>名字與公司只有我們看得到<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>彙整報告<\/b><span>寄到您留的聯絡方式<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-form\">\n        <div class=\"sv-formwrap\">\n            <nav class=\"sv-toc\" aria-label=\"表單段落\" data-sv-toc>\n                <a href=\"#sv-p1\"><span>01<\/span>關於您<\/a>\n                <a href=\"#sv-p2\"><span>02<\/span>最近一次<\/a>\n                <a href=\"#sv-p3\" data-branch-link=\"story\"><span>03<\/span>花了多少<\/a>\n                <a href=\"#sv-p4\" data-branch-link=\"story\"><span>04<\/span>試過的做法<\/a>\n                <a href=\"#sv-p5\"><span>05<\/span>後續<\/a>\n                <a href=\"#sv-p6\"><span>06<\/span>聯絡方式<\/a>\n            <\/nav>\n\n        <form class=\"qf-survey sv-form\" method=\"post\" action=\"/survey/verify\" data-survey-form novalidate>\n\n            <!-- ---- about you ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p1\">// 01 · 關於您<\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">您的角色最接近哪一個？<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程師\" id=\"role1\" name=\"role\">工程師<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程主管或技術主管\" id=\"role2\" name=\"role\">工程主管或技術主管<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"法遵或法務\" id=\"role3\" name=\"role\">法遵或法務<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"內部稽核或風險管理\" id=\"role4\" name=\"role\">內部稽核或風險管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"資訊或 IT 管理\" id=\"role5\" name=\"role\">資訊或 IT 管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"產品或專案管理\" id=\"role6\" name=\"role\">產品或專案管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"其他\" id=\"role7\" name=\"role\">其他<\/label>\n                <\/div>\n                <div class=\"qf-survey__other\" data-show-if=\"role=其他\">\n                    <input id=\"sf-role-other\" type=\"text\" maxlength=\"64\" placeholder=\"請寫您的角色\" name=\"roleOther\" value=\"\">\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一個角色。<\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">您所在組織的規模？<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1–10 人\" id=\"orgSize1\" name=\"orgSize\">1–10 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"11–50 人\" id=\"orgSize2\" name=\"orgSize\">11–50 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"51–200 人\" id=\"orgSize3\" name=\"orgSize\">51–200 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"201–1000 人\" id=\"orgSize4\" name=\"orgSize\">201–1000 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1000 人以上\" id=\"orgSize5\" name=\"orgSize\">1000 人以上<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一個規模。<\/div>\n            <\/div>\n\n            <!-- ---- the last time ---- -->\n            <div class=\"sv-part\" id=\"sv-p2\">\n                <img data-sv-part-img src=\"backend/src/main/resources/static/media/bp_desk.jpg\" alt=\"\">\n                <div><span class=\"k\" data-sv-part-k>// 02 · 最近一次<\/span><b data-sv-part-title>最近一次，您需要處理的那一件事<\/b><\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">最近一次您（或您的團隊）需要做下面哪一件事？選最近發生的那一件。<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices qf-choices--stack\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"verify\" id=\"situation1\" name=\"situation\">確認 AI 產出的內容（程式碼、文件、回答）是否正確<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"explain\" id=\"situation2\" name=\"situation\">回應別人對「我們怎麼用 AI」的詢問或要求（主管、客戶、稽核、主管機關）<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"inventory\" id=\"situation3\" name=\"situation\">盤點舊系統、舊程式裡有什麼、誰在用、還能不能動<\/label>\n                    <label class=\"qf-choice qf-choice--other\"><input type=\"radio\" value=\"other\" id=\"situation4\" name=\"situation\">其他<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"寫下是什麼事\" aria-label=\"其他：寫下是什麼事\" data-other-text id=\"situationOther\" name=\"situationOther\" value=\"\"><\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"situation5\" name=\"situation\">以上都沒發生過<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一項；選「其他」的話，請寫下是什麼事。<\/div>\n            <\/div>\n\n            <div data-branch=\"story\">\n                <div class=\"qf-field\" data-required>\n                    <div class=\"qf-field__q\">那一次大約是什麼時候？<span class=\"qf-field__req\">必填<\/span><\/div>\n                    <div class=\"qf-field__hint\">想不起來的話，可以從最近一次交報告、上線、稽核或客戶詢問往回想。<\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一週內\" id=\"occurredWhen1\" name=\"occurredWhen\">過去一週內<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一個月內\" id=\"occurredWhen2\" name=\"occurredWhen\">過去一個月內<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"一到六個月前\" id=\"occurredWhen3\" name=\"occurredWhen\">一到六個月前<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"超過半年前\" id=\"occurredWhen4\" name=\"occurredWhen\">超過半年前<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; 請選一個時間。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-what\">那一次發生了什麼事？是什麼讓您覺得一定要處理，而不是直接放著或直接用？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"sv-why\">我們想知道「決定要確認」的那一刻。目前公開的調查都沒有問過這件事。<\/div>\n                    <textarea id=\"sf-what\" rows=\"6\" maxlength=\"2000\" data-sv-count-text name=\"whatHappened\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-steps\">從開始處理到您覺得可以放心交出去，中間做了哪些步驟？誰參與？用了什麼工具或文件？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"sv-why\">「怎麼確認」的步驟，就是我們最想了解的部分。照順序寫幾步就好。<\/div>\n                    <textarea id=\"sf-steps\" rows=\"6\" maxlength=\"2000\" data-sv-count-text placeholder=\"例如：先對原始檔、再請同事看一遍、最後跟去年的報告比\" name=\"steps\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-outcome\">最後結果如何？有沒有漏掉什麼，後來才發現？<\/label>\n                    <textarea id=\"sf-outcome\" rows=\"4\" maxlength=\"2000\" name=\"outcome\"><\/textarea>\n                <\/div>\n\n                <!-- ---- cost ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p3\">// 03 · 花了多少<\/div>\n\n                <div class=\"qf-field\">\n                    <div class=\"qf-field__q\">大概花了多少時間？<\/div>\n                    <div class=\"sv-why\">覆核要花多少工時。大概就好。<\/div>\n                    <div class=\"qf-inline\">\n                        <input id=\"sf-hours\" type=\"text\" inputmode=\"decimal\" maxlength=\"16\" name=\"hours\" value=\"\">小時，\n                        <input id=\"sf-people\" type=\"text\" inputmode=\"numeric\" maxlength=\"16\" name=\"people\" value=\"\">個人參與\n                    <\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-amounts>\n                    <div class=\"qf-field__q\">有沒有因此另外花錢（工具、外包、顧問、加班費）？<\/div>\n                    <div class=\"qf-inline\">\n                        <span class=\"qf-inline__group\">US$ <input id=\"sf-extra-usd\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" aria-label=\"另外花的錢（美金）\" data-amount name=\"extraSpendUsd\" value=\"\"><\/span>\n                    <\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"extraSpend1\" name=\"extraSpend\">沒有<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"unknown\" id=\"extraSpend2\" name=\"extraSpend\">不知道<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; 金額只能填數字（不加幣別），例如 500 或 1,200.5。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-worst\">如果那次沒有處理，最壞可能發生什麼事？<\/label>\n                    <textarea id=\"sf-worst\" rows=\"4\" maxlength=\"2000\" name=\"worstCase\"><\/textarea>\n                <\/div>\n\n                <!-- ---- what you tried ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p4\">// 04 · 試過的做法<\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-tried\">您有沒有找過或試過其他做法、工具或服務？試了什麼？為什麼繼續用，或為什麼不用了？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"qf-field__hint\">如果沒有找過，也請寫「沒有」，可以的話說說為什麼。<\/div>\n                    <textarea id=\"sf-tried\" rows=\"5\" maxlength=\"2000\" data-sv-count-text name=\"triedOther\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-hardest\">回想那一次，哪一個步驟最花時間或最讓您不放心？如果那一步可以變得不一樣，您希望它變成什麼樣子？<\/label>\n                    <textarea id=\"sf-hardest\" rows=\"5\" maxlength=\"2000\" name=\"hardestStep\"><\/textarea>\n                <\/div>\n            <\/div>\n\n            <div data-branch=\"none\">\n                <div class=\"qf-field\">\n                    <label for=\"sf-why-not\">您的工作裡有用到 AI 工具嗎？如果有，為什麼不需要確認它的產出？<\/label>\n                    <textarea id=\"sf-why-not\" rows=\"5\" maxlength=\"2000\" name=\"whyNotNeeded\"><\/textarea>\n                <\/div>\n            <\/div>\n\n            <!-- ---- follow-up ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p5\">// 05 · 後續<\/div>\n\n            <div class=\"qf-field\" data-required data-amounts>\n                <div class=\"qf-field__q\"><span data-show-if=\"situation!=none\">為了解決上述問題，您的組織每年願意付多少？<\/span><span data-show-if=\"situation=none\" hidden>如果之後需要確認 AI 產出的內容、回應別人對 AI 使用的詢問，或盤點舊系統，您的組織每年願意付多少？<\/span><span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-field__hint\">如果是固定金額，兩格填一樣。<\/div>\n                <div class=\"qf-inline\">\n                    <span class=\"qf-inline__group\">每年 US$<input id=\"sf-pay-min\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" placeholder=\"最低\" aria-label=\"每年最低金額（美金）\" data-amount name=\"payMin\" value=\"\"><\/span>\n                    <span class=\"qf-inline__group\">到 US$<input id=\"sf-pay-max\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" placeholder=\"最高\" aria-label=\"每年最高金額（美金）\" data-amount name=\"payMax\" value=\"\"><\/span>\n                <\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"payOption1\" name=\"payOption\">不會付費<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"unknown\" id=\"payOption2\" name=\"payOption\">不知道<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請填金額範圍，或選「不會付費」「不知道」。<\/div>\n            <\/div>\n\n            <div class=\"qf-field\">\n                <label for=\"sf-message\">有什麼是您想告訴我們的<\/label>\n                <textarea id=\"sf-message\" rows   function show() {
