<script id="pages" type="application/json">{"/about": {"title": "關於我們 — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>關於我們 — 麒麟魚 Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/about\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/about\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\"    class=\"is-active\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\">文章<\/a>\n        <a href=\"#/survey\">填寫問卷<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/about\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/about\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"backend/src/main/resources/static/media/about_crystal.mp4\"\n               poster=\"backend/src/main/resources/static/media/about_crystal.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\">ABOUT // who we are<\/div>\n            <h1 class=\"ab-hero__title\" data-typewriter>美感是『普適模式』被『主觀經驗』解構後的殘餘。<\/h1>\n        <\/div>\n    <\/header>\n\n    <!-- ---- what we do ---- -->\n    <section class=\"ab-section\" data-reveal>\n        <div class=\"qf-eyebrow\">WHAT<\/div>\n        \n        <h2 class=\"ab-h2\" data-typewriter><span style=\"display:inline-block\"><span style=\"display:inline-block\">我們幫使用 AI<\/span> <span style=\"display:inline-block\">且要為此負責的人，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">在交出 AI 的產物之前，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">抓出監督盲區的未爆彈，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">而且不用<\/span><span style=\"display:inline-block\">每一次每一條<\/span><span style=\"display:inline-block\">都親自回到<\/span><span style=\"display:inline-block\">原始出處核對。<\/span><\/span><\/h2>\n    <\/section>\n\n    <!-- ---- why we do this ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WHY<\/div>\n        <h2 class=\"ab-h2\">為什麼做這件事<\/h2>\n        <div class=\"ab-story\">\n            <p>我們遇過系統遷移的顧問案，也接手過規模很大、交接卻不齊全的舊系統。傳統做法是靠人一項一項讀、一項一項對，曠日費時，對人員的經驗和系統的條件要求都很高。<\/p>\n            <p>現在，很多這類工作都期待導入 AI，或者被要求導入 AI。可是傳統做法有嚴謹的流程、有專業的人，仍然會出錯；換成一個本身就不穩定的 AI 工具，風險只會更大。我們自己每天用 AI 代理寫程式，也常常遇到它回報「做完了」，打開一看，有一部分沒做，或者做的跟它說的不一樣。<\/p>\n            <p>同時，要求監管 AI 的聲音越來越多。主管、客戶、稽核都會問：「這是怎麼來的？」<\/p>\n            <p>所以我們在做一個工具，讓 AI 的結果可以被檢查，人要監督也比較省力，出了事也查得到根據。<\/p>\n            <p>我們還不知道其他行業怎麼處理這件事。律師、顧問、客服遇到的情況，可能跟我們很不一樣。這就是我們做問卷的原因。<\/p>\n        <\/div>\n    <\/section>\n\n    <!-- ---- how we think ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WAY // 工程觀點<\/div>\n        <h2 class=\"ab-h2\">我們怎麼想事情<\/h2>\n        <ol class=\"ab-way\">\n            <li>\n                <span class=\"n\">01<\/span>\n                <span>工程不是堆疊技術，是把複雜性收斂到使用者看不見的地方。<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">02<\/span>\n                <span>每一行程式碼都該為一個明確的決策服務。<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">03<\/span>\n                <span>好的系統不只能跑，還能被下一個人讀懂、改動、擴展。<\/span>\n            <\/li>\n        <\/ol>\n    <\/section>\n\n    <!-- ---- next step ---- -->\n    <section class=\"ab-section ab-section--flush ab-next\" data-reveal>\n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey\">說說您那一次 <span class=\"arr\">→<\/span><\/a>\n        <a class=\"ab-also\" href=\"#/contact\">也接 Web 開發與專案設計 → 聯絡我們<\/a>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/blog": {"title": "文章 — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>文章 — 麒麟魚 Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/ .googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\"     class=\"is-active\">文章<\/a>\n        <a href=\"#/survey\">填寫問卷<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/shadow-ai\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/shadow-ai-en\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        \n        <img class=\"ab-hero__video\" src=\"content/articles/shadow-ai/media/hero.jpg\" alt=\"\" aria-hidden=\"true\">\n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/blog\">← 所有文章<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-10-26\">2026-10-26<\/time><\/div>\n            <h1 class=\"ab-hero__title\">您的公司知道員工在用哪些 AI 嗎？<\/h1>\n            <p class=\"st-lede\">將近一半用 AI 的員工承認用法違反公司規定。這篇整理國際調查、真實事件、各地規範，以及台灣的現況。<\/p>\n        <\/div>\n    <\/header>\n    <article class=\"bl-post\">\n        \n        <div class=\"bl-prose\">\n\n            <h2 id=\"what\">什麼是影子 AI<\/h2>\n            <p>影子 AI（shadow AI）指員工沒有經過公司核准，自己找 AI 工具來處理工作。台灣的法律資料庫 Lawsnote 這樣定義：「影子 AI，是指員工或組織成員在未經核准、缺乏管理的情況下，自行使用生成式 AI 工具處理工作。」<\/p>\n            <p>同一篇文章舉了幾個例子：<\/p>\n            <ul>\n                <li>用個人帳號，把客戶資料貼進免費版 AI。<\/li>\n                <li>沒有經過核准，就用瀏覽器外掛摘要文件。<\/li>\n                <li>助理自己用 AI 搜尋判決，再把結果交給律師。<\/li>\n                <li>部門私下訂閱 AI 工具，沒有經過資安或法遵審查。<\/li>\n            <\/ul>\n            <p>問題不在 AI 本身，而在公司不知道：用了哪個工具、輸入了什麼、產出用在哪裡。出了事的時候，也就很難說清楚發生了什麼。<\/p>\n\n            <h2 id=\"how-common\">有多普遍<\/h2>\n            <p>KPMG 與墨爾本大學在 2024 年底到 2025 年初，調查了 47 個國家的 48,340 人。用 AI 工作的員工裡，將近一半承認用法違反公司的規定。用得最多的是免費的公開工具（70%），公司提供的工具只有 42%。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.1 · 受訪員工自己說的<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>避免讓人知道自己用了 AI<\/span><b>61<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:61%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>不確定公司准不准，就先用了<\/span><b>56<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:56%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>把公司資料上傳到公開的 AI 工具<\/span><b>48<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>用法違反公司的規定<\/span><b>44<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:44%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">KPMG × 墨爾本大學《Trust, attitudes and use of AI》2025 · 47 國 48,340 人 · 台灣不在樣本內 · 比例為回答「很少」以上（報告 Figure 44：100% 減「從不」）<\/span>\n            <\/figure>\n\n            <p>這和管理者的感受一致。國際資訊治理組織 ISACA 在 2025 年問了 3,029 位資安、稽核、治理領域的專業人員，81% 認為公司裡的員工不管准不准都在用 AI，但只有 28% 的組織有正式而完整的 AI 政策。到了 2026 年，同一份調查的這個比例升到 38%。微軟與 LinkedIn 2024 年調查 31 個國家的 31,000 人，發現 78% 的 AI 使用者是自己帶 AI 工具上班。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.2 · 員工在用，規則還沒跟上<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>認為員工不管准不准都在用 AI<\/span><b>81<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:81%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>組織有正式而完整的 AI 政策<\/span><b>28<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:28%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">ISACA 2025 AI Pulse Poll · 3,029 位數位信任專業人員 · 2025-06<\/span>\n            <\/figure>\n\n            <h2 id=\"incidents\">出過的事<\/h2>\n            <p>IBM 每年統計資料外洩的成本。2025 年的報告分析了 600 家發生外洩的組織，每 5 家就有 1 家的外洩是影子 AI 造成的。影子 AI 用得多的組織，每次外洩的成本平均多出 67 萬美元。這類外洩洩漏個人資料與智慧財產的比例，也都比平均高。這 600 家組織裡，只有 37% 有管理 AI 或偵測影子 AI 的政策。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.3 · 外洩事件裡洩漏了什麼<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>個人資料：影子 AI 造成的外洩<\/span><b>65<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:65%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>個人資料：全體平均<\/span><b>53<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:53%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>智慧財產：影子 AI 造成的外洩<\/span><b>40<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:40%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>智慧財產：全體平均<\/span><b>33<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:33%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">IBM Cost of a Data Breach Report 2025 · 600 家發生外洩的組織 · 2024-03 至 2025-02<\/span>\n            <\/figure>\n\n            <h3>澳洲：水災災民的資料進了 ChatGPT<\/h3>\n            <p>2025 年 3 月 12 日到 15 日，澳洲新南威爾斯州重建署的一名前臨時員工，把一份 Excel 試算表上傳到 ChatGPT。檔案有 10 欄、超過 12,000 列，內容是北河地區水災房屋計畫申請人的資料：姓名、聯絡方式、住址、出生日期、敏感的健康資訊，還有少量財務相關的註記。<\/p>\n            <p>重建署說，這個工具「沒有經過授權」。事件在 2025 年 10 月 6 日公開，當時說最多可能影響 3,000 人。2026 年 3 月更新的說明確定是 2,031 人。之後重建署加裝了控管，擋住把個人資料上傳到 AI 工具，也修改了內部規定與訓練。<\/p>\n\n            <h3>AI 助理的外掛，也可能出問題<\/h3>\n            <p>影子 AI 不只是聊天視窗。現在的 AI 助理可以裝外掛，替人寄信、讀檔案、操作系統。2025 年 9 月，開源套件庫裡一個讓 AI 助理寄信的外掛 <code>postmark-mcp<\/code> 被列為惡意套件：從 1.0.16 版開始，它會用密件副本把經手的信件偷偷寄出去。如果是員工自己裝的外掛，公司就不會知道它在那裡。<\/p>\n\n            <h2 id=\"law\">法規怎麼說<\/h2>\n            <p>我們沒有找到直接寫「影子 AI」的法律。但已經有幾份規範，要求組織掌握自己的人怎麼用 AI。<\/p>\n\n            <h3>歐盟 AI 法：員工用 ChatGPT 也算<\/h3>\n            <p>歐盟《人工智慧法》第 4 條從 2025 年 2 月 2 日開始適用，要求提供或使用 AI 系統的組織採取措施，讓員工具備足夠的 AI 素養。歐盟執委會的問答直接回答了一個問題：員工用 ChatGPT 寫廣告文案、翻譯文件，公司也要符合這一條嗎？答案是「要」，應該讓員工知道特定的風險，例如 AI 會一本正經地編造內容。這一條的修正在 2026 年 7 月中生效後，從「確保足夠的程度」改成「支持員工培養 AI 素養」，不再要求保證達到某個程度，但組織仍然要採取措施。<\/p>\n\n            <h3>美國 NIST：先把清單列出來<\/h3>\n            <p>美國國家標準與技術研究院（NIST）2024 年 7 月發布的生成式 AI 風險管理指引，建議組織盤點所有能接觸到組織內容的第三方，並且建立核准使用的生成式 AI 工具清單。這是自願採用的指引，不是法律。<\/p>\n\n            <h3>新加坡金管局：第一次在監理指引裡點名<\/h3>\n            <p>新加坡金融管理局 2026 年 10 月 7 日發布 AI 風險管理指引，2027 年 10 月 7 日生效。指引直接把「影子 AI」列為風險，要求新加坡的金融機構一致地找出各部門在哪裡用了 AI、建立 AI 使用清單。對於找不出來的使用，也要評估風險並採取措施。指引舉的例子包括：告訴員工哪些用法可以、哪些不行，例如不得把機密或客戶資料輸入公開的 AI 工具。<\/p>\n\n            <h2 id=\"taiwan\">台灣現況<\/h2>\n            <p>我們沒有找到台灣本地專門調查「員工未經核准使用 AI」的數字。最接近的有兩份。微軟 2024 年的調查指出，台灣 84% 的知識工作者在工作上使用生成式 AI；AI 使用者中將近八成自己帶 AI 工具上班，比全球還高。趨勢科技 2026 年 3 月發布的調查訪問了台灣 200 位企業的業務與 IT 決策者，74% 曾經在有安全疑慮的情況下仍被迫批准導入 AI，高於全球的 67%。<\/p>\n\n            <h3>公部門：先禁、再立法<\/h3>\n            <p>2023 年 8 月 31 日的行政院院會議案中，國科會提出使用生成式 AI 的參考指引草案，要求各機關負責任地使用，並注意安全、隱私、資料治理與問責。2025 年 2 月 3 日，行政院宣布公務機關原則上全面禁用 DeepSeek 的 AI 服務。2025 年 12 月 1 日施行的新版《資通安全管理法》第 11 條規定，公務機關不得下載、安裝或使用危害國家資通安全的產品。2026 年 1 月 14 日公布的《人工智慧基本法》第 19 條也要求政府訂定使用規範或內控管理機制。<\/p>\n\n            <h3>金融業：資料不能隨便給 AI<\/h3>\n            <p>金管會 2024 年 6 月發布的《金融業運用人工智慧(AI)指引》屬於行政指導。指引寫明，在沒有適當管控的情況下，金融機構人員「不得向生成式 AI 提供未經客戶同意提供之資訊」，也建議金融機構建立並維護 AI 模型清單。金管會在 2023 年 4 月的問卷發現，有 95 家金融機構及周邊單位已經對員工使用生成式 AI 進行管制，例如用防火牆擋住內網連到 ChatGPT。<\/p>\n\n            <h3>法院：不要用 AI 寫上訴狀<\/h3>\n            <p>2026 年 7 月 24 日，桃園地方法院在一件民事判決（115 年度訴字第 867 號）裡提醒當事人：拿到判決後，請找一位「活生生的、有血有肉有執照的律師」問清楚。「不要問AI，不要用AI寫上訴狀，更不要以為人家看不出是AI寫的。」<\/p>\n\n            <h3>出事之後，要說得出發生了什麼<\/h3>\n            <p>《個人資料保護法》在 2025 年 11 月 11 日修正，施行日期由行政院另訂。修正後的第 12 條要求，個人資料外洩時要通知當事人、立即應變，並且記載相關事實、影響與採取的措施，保存紀錄以備主管機關查驗；符合一定範圍時，還要通報主管機關。如果資料是經過公司不知道的 AI 工具流出去，這些事就很難說清楚。<\/p>\n\n            <div class=\"pd-stage bl-invite\">\n                <p>您的公司有沒有發生過「事後才知道有人用了 AI」的事？我們正在整理實際的經驗，想聽聽您遇過的情況。<\/p>\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey\">填寫問卷 <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n\n            <h2 id=\"refs\">參考資料<\/h2>\n            <ol class=\"bl-refs\">\n                <li><span class=\"pub\">Lawsnote<\/span><span class=\"d\">2026-07-21<\/span><a href=\"https://blog.lawsnote.com/2026/07/ai-%e6%99%82%e4%bb%a3%e7%9a%84%e5%88%a4%e6%b1%ba%e6%aa%a2%e7%b4%a2%ef%bd%9c%e5%be%8b%e5%b8%ab%e5%bf%85%e7%9c%8b%e7%9a%84%e5%88%a4%e6%b1%ba%e6%90%9c%e5%b0%8b%e6%9f%a5%e8%ad%89%e6%b5%81%e7%a8%8b/\" rel=\"noopener\" target=\"_blank\">AI 時代的判決檢索｜律師必看的判決搜尋查證流程與影子 AI 風險<\/a><\/li>\n                <li><span class=\"pub\">KPMG × The University of Melbourne<\/span><span class=\"d\">2025-04<\/span><a href=\"https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI: A global study 2025<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2025-06-25<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2025/digital-trust-pros-say-increased-ai-skills-and-knowledge-needed-to-advance-their-career\" rel=\"noopener\" target=\"_blank\">2025 AI Pulse Poll 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2026-05-05<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2026/ai-use-accelerates-while-governance-and-roi-lag-says-new-isaca-research\" rel=\"noopener\" target=\"_blank\">2026 AI Pulse Poll 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">Microsoft<\/span><span class=\"d\">2024-05-08<\/span><a href=\"https://news.microsoft.com/source/2024/05/08/microsoft-and-linkedin-release-the-2024-work-trend-index-on-the-state-of-ai-at-work/\" rel=\"noopener\" target=\"_blank\">Microsoft and LinkedIn release the 2024 Work Trend Index<\/a><\/li>\n                <li><span class=\"pub\">IBM<\/span><span class=\"d\">2025-07-30<\/span><a href=\"https://newsroom.ibm.com/2025-07-30-ibm-report-13-of-organizations-reported-breaches-of-ai-models-or-applications,-97-of-which-reported-lacking-proper-ai-access-controls\" rel=\"noopener\" target=\"_blank\">Cost of a Data Breach Report 2025 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">2025-10-06<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/media-releases/northern-rivers-resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Northern Rivers Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">2026-03-26 更新<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">OSV（開源漏洞資料庫）<\/span><span class=\"d\">2025-09-26<\/span><a href=\"https://osv.dev/vulnerability/MAL-2025-47604\" rel=\"noopener\" target=\"_blank\">MAL-2025-47604：postmark-mcp<\/a><\/li>\n                <li><span class=\"pub\">European Commission<\/span><span class=\"d\">2026-10-20 更新<\/span><a href=\"https://digital-strategy.ec.europa.eu/en/faqs/ai-literacy-questions-answers\" rel=\"noopener\" target=\"_blank\">AI Literacy – Questions &amp; Answers<\/a><\/li>\n                <li><span class=\"pub\">European Commission AI Act Service Desk<\/span><span class=\"d\">2026-07-27 合併版<\/span><a href=\"https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4\" rel=\"noopener\" target=\"_blank\">AI Act Article 4: AI literacy<\/a><\/li>\n                <li><span class=\"pub\">NIST<\/span><span class=\"d\">2024-07<\/span><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">NIST AI 600-1：Generative Artificial Intelligence Profile<\/a><\/li>\n                <li><span class=\"pub\">Monetary Authority of Singapore<\/span><span class=\"d\">2026-10-07<\/span><a href=\"https://www.mas.gov.sg/news/media-releases/2026/mas-sets-out-supervisory-expectations-on-responsible-ai-adoption-by-financial-institutions\" rel=\"noopener\" target=\"_blank\">Guidelines on AI Risk Management 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">Monetary Authority of Singapore<\/span><span class=\"d\">2026-10-07<\/span><a href=\"https://www.mas.gov.sg/-/media/mas-media-library/regulation/guidelines/bd/guidelines-on-artificial-intelligence-risk-management-for-financial-institutions/guidelines-on-artificial-intelligence-risk-management.pdf\" rel=\"noopener\" target=\"_blank\">Guidelines on Artificial Intelligence Risk Management（指引本文 PDF）<\/a><\/li>\n                <li><span class=\"pub\">台灣微軟<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://news.microsoft.com/zh-tw/ms-wti-ai/\" rel=\"noopener\" target=\"_blank\">2024 年工作趨勢指數<\/a><\/li>\n                <li><span class=\"pub\">趨勢科技<\/span><span class=\"d\">2026-03-26<\/span><a href=\"https://www.trendmicro.com/zh_tw/about/newsroom/press-releases/2026/2026-03-26.html\" rel=\"noopener\" target=\"_blank\">新聞稿<\/a><\/li>\n                <li><span class=\"pub\">行政院<\/span><span class=\"d\">2023-08-31<\/span><a href=\"https://www.ey.gov.tw/Page/448DE008087A1971/40c1a925-121d-4b6b-8f40-7e9e1a5401f2\" rel=\"noopener\" target=\"_blank\">使用生成式 AI 參考指引<\/a><\/li>\n                <li><span class=\"pub\">行政院<\/span><span class=\"d\">2025-02-03<\/span><a href=\"https://www.ey.gov.tw/Page/9277F759E41CCD91/3ce9fe8f-2f5f-4d1d-8176-6fa4cf622b82\" rel=\"noopener\" target=\"_blank\">卓揆：公務機關全面禁用 Deepseek AI 服務<\/a><\/li>\n                <li><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">2025-12-01 施行<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=A0030297&amp;flno=11\" rel=\"noopener\" target=\"_blank\">資通安全管理法 第 11 條<\/a><\/li>\n                <li><span class=\"pub\">總統府公報 第 7837 號<\/span><span class=\"d\">2026-01-14<\/span><a href=\"https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7\" rel=\"noopener\" target=\"_blank\">人工智慧基本法<\/a><\/li>\n                <li><span class=\"pub\">金融監督管理委員會<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">金融業運用人工智慧(AI)指引 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">金融監督管理委員會<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">金融業運用人工智慧(AI)指引（指引本文 PDF）<\/a><\/li>\n                <li><span class=\"pub\">司法院裁判書查詢<\/span><span class=\"d\">2026-07-24<\/span><a href=\"https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&amp;id=TYDV,115,%E8%A8%B4,867,20260724,1\" rel=\"noopener\" target=\"_blank\">臺灣桃園地方法院 115 年度訴字第 867 號民事判決<\/a><\/li>\n                <li><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">2025-11-11 修正<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021\" rel=\"noopener\" target=\"_blank\">個人資料保護法<\/a><\/li>\n            <\/ol>\n        <\/div>\n\n    <\/article>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/blog/solo-trust": {"title": "客戶問「這是怎麼來的？」，您拿得出什麼？ — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>客戶問「這是怎麼來的？」，您拿得出什麼？ — 麒麟魚 Qilinfish Studio<\/title>\n    <meta name=\"description\" content=\"多數受訪者希望知道產品與服務是否使用 AI。研究顯示，主動揭露使用 AI 可能降低信任，悄悄使用後被發現的信任下降更多。交付時可說明 AI 用在哪一步、誰複核、如何驗證，以及由誰負責。\">\n    <link rel=\"canonical\" href=\"http://localhost:18080/blog/solo-trust\">\n    \n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"http://localhost:18080/blog/solo-trust\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"http://localhost:18080/en/blog/ai-handover\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:title\" content=\"客戶問「這是怎麼來的？」，您拿得出什麼？\">\n    <meta property=\"og:description\" content=\"多數受訪者希望知道產品與服務是否使用 AI。研究顯示，主動揭露使用 AI 可能降低信任，悄悄使用後被發現的信任下降更多。交付時可說明 AI 用在哪一步、誰複核、如何驗證，以及由誰負責。\">\n    <meta property=\"og:url\" content=\"http://localhost:18080/blog/solo-trust\">\n    <meta property=\"og:image\" content=\"http://localhost:18080/articles/solo-trust/media/hero.jpg\">\n    <script type=\"application/ld+json\">\n    {\n      \"@context\": \"https://schema.org\",\n      \"@type\": \"Article\",\n      \"headline\": \"\\u5BA2\\u6236\\u554F\\u300C\\u9019\\u662F\\u600E\\u9EBC\\u4F86\\u7684\\uFF1F\\u300D\\uFF0C\\u60A8\\u62FF\\u5F97\\u51FA\\u4EC0\\u9EBC\\uFF1F\",\n      \"description\": \"\\u591A\\u6578\\u53D7\\u8A2A\\u8005\\u5E0C\\u671B\\u77E5\\u9053\\u7522\\u54C1\\u8207\\u670D\\u52D9\\u662F\\u5426\\u4F7F\\u7528 AI\\u3002\\u7814\\u7A76\\u986F\\u793A\\uFF0C\\u4E3B\\u52D5\\u63ED\\u9732\\u4F7F\\u7528 AI \\u53EF\\u80FD\\u964D\\u4F4E\\u4FE1\\u4EFB\\uFF0C\\u6084\\u6084\\u4F7F\\u7528\\u5F8C\\u88AB\\u767C\\u73FE\\u7684\\u4FE1\\u4EFB\\u4E0B\\u964D\\u66F4\\u591A\\u3002\\u4EA4\\u4ED8\\u6642\\u53EF\\u8AAA\\u660E AI \\u7528\\u5728\\u54EA\\u4E00\\u6B65\\u3001\\u8AB0\\u8907\\u6838\\u3001\\u5982\\u4F55\\u9A57\\u8B49\\uFF0C\\u4EE5\\u53CA\\u7531\\u8AB0\\u8CA0\\u8CAC\\u3002\",\n      \"datePublished\": \"2026-10-28\",\n      \"image\": \"http:\\/\\/localhost:18080\\/articles\\/solo-trust\\/media\\/hero.jpg\",\n      \"url\": \"http:\\/\\/localhost:18080\\/blog\\/solo-trust\",\n      \"inLanguage\": \"zh-Hant-TW\",\n      \"author\": { \"@type\": \"Organization\", \"name\": \"\\u9E92\\u9E9F\\u9B5A Qilinfish Studio\" },\n      \"publisher\": { \"@type\": \"Organization\", \"name\": \"\\u9E92\\u9E9F\\u9B5A Qilinfish Studio\" }\n    }\n    <\/script>\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\"     class=\"is-active\">文章<\/a>\n        <a href=\"#/survey\">填寫問卷<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/solo-trust\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/ai-handover\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"content/articles/solo-trust/media/hero.mp4\" poster=\"content/articles/solo-trust/media/hero.jpg\"\n               data-sv-play muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        \n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/blog\">← 所有文章<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-10-28\">2026-10-28<\/time><\/div>\n            <h1 class=\"ab-hero__title\">客戶問「這是怎麼來的？」，您拿得出什麼？<\/h1>\n            <p class=\"st-lede\">您一個人接案，用 AI 幫客戶做事。客戶想知道您有沒有用 AI，也想知道出了錯誰負責。這篇整理調查、事件與各地的指引，看看交付時要附上什麼。<\/p>\n        <\/div>\n    <\/header>\n    <article class=\"bl-post\">\n        \n        <div class=\"bl-prose\">\r\n\r\n            <aside class=\"bl-tldr\" data-reveal>\r\n                <span class=\"sv-eb\">TL;DR<\/span>\r\n                <ol>\r\n                    <li>多數受訪者希望被告知產品或服務用了 AI。但主動說了，信任會降一些；悄悄用、之後被別人發現，降得最多。<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup><sup class=\"cite\" data-e=\"E17 E18\"><a href=\"#r8\">[8]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/li>\r\n                    <li>人們排斥 AI 標籤，是因為以為內容「完全由 AI 寫、沒有人監督」。所以要說清楚的是：誰複核、怎麼驗證、誰負責。<sup class=\"cite\" data-e=\"E22\"><a href=\"#r11\">[11]<\/a><\/sup><sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/li>\r\n                    <li>一人公司交出去的東西，背後只有您一個人。這份說明要放進交付物裡。<\/li>\r\n                <\/ol>\r\n            <\/aside>\r\n\r\n            <p>在台灣，用 AI 工作已經很普遍。微軟 2024 年的調查指出，台灣 84% 的知識工作者在工作上使用生成式 AI；AI 使用者中將近八成自己帶 AI 工具上班。<sup class=\"cite\" data-e=\"E89\"><a href=\"#r1\">[1]<\/a><\/sup>這是受訪者自己說的。<\/p>\r\n            <p>一個人做事的人也不少。主計總處的統計，2025 年台灣的自營作業者平均有 127.0 萬人，占就業者的 10.92%。<sup class=\"cite\" data-e=\"E75\"><a href=\"#r2\">[2]<\/a><\/sup>這個數字包含農業與攤販，不等於接案者，但可以看出規模。<\/p>\r\n            <p>這篇寫給兩種讀者：用 AI 替客戶做事的您，和委託接案者、要為結果負責的您。兩邊遲早會遇到同一個問題：「這是怎麼來的？」<\/p>\r\n\r\n            <div class=\"qf-eyebrow\">01<\/div>\r\n            <h2 id=\"want\">客戶想知道您有沒有用 AI，而且期待您先開口<\/h2>\r\n            <p><strong>調查裡，多數人要求揭露 AI 的使用；企業客戶也希望外部事務所用 AI，但多半不知道對方有沒有用。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-1.jpg\" alt=\"綠色毛氈上一封還沒打開的信封\" loading=\"lazy\"><\/figure>\r\n            <p>Ipsos 2025 年在 30 個國家訪問了 23,216 人，平均 79% 同意「用 AI 的產品與服務應該要揭露這件事」。<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup>Salesforce 2024 年調查 18 國的 15,015 名消費者，近 75% 想知道自己是不是在跟 AI 代理溝通。<sup class=\"cite\" data-e=\"E12\"><a href=\"#r4\">[4]<\/a><\/sup>美國的 Pew 研究中心在 2025 年問了 5,023 名成人：<\/p>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.1 · 受訪者自己說的<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>能分辨內容是 AI 還是人做的，極為或非常重要<\/span><b>76<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:76%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>不太有或完全沒有信心分辨<\/span><b>53<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:53%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Pew Research Center 2025-09-17 · 美國成人 5,023 人 · 2025-06-09 至 06-15 · 只有美國<sup class=\"cite\" data-e=\"E15 E16\"><a href=\"#r5\">[5]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <p>企業客戶這一端，Thomson Reuters Institute 2025 年 10 到 11 月調查了 27 國 1,514 位法律、稅務、風險與政府法務的專業人員。報告指出，大多數企業部門希望外部事務所在案件上用 AI，但不到三分之一知道事務所有沒有在用。<sup class=\"cite\" data-e=\"E23\"><a href=\"#r6\">[6]<\/a><\/sup>約三分之二的企業受訪者認為事務所應該用 AI，但不到 20% 透過指引或招標文件提出要求。約四分之三的受訪者認為，應該由事務所主動開啟這個討論。<sup class=\"cite\" data-e=\"E24 E26\"><a href=\"#r7\">[7]<\/a><\/sup><\/p>\r\n            <p>報告引了一位美國企業法務長的話：「品質還是要檢查，人還是要為品質負責，就像資淺律師的工作要由資深的人仔細審一樣。但他們應該用。」（\"The quality still needs to be checked, and the human beings should still be responsible for the quality … But they should use it.\"）<sup class=\"cite\" data-e=\"E28\"><a href=\"#r7\">[7]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 1 · 揭露期待的調查<\/span>\r\n                <table>\r\n                    <thead><tr><th>調查<\/th><th>樣本<\/th><th>結果<\/th><th>台灣<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr><td>Ipsos AI Monitor 2025<\/td><td>30 國 23,216 人，2025-03 至 04<\/td><td>79% 同意用 AI 的產品與服務應該揭露<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Salesforce 2024<\/td><td>18 國 15,015 名消費者，2024-07 至 08<\/td><td>近 75% 想知道是不是在跟 AI 代理溝通<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Pew 2025<\/td><td>美國成人 5,023 人，2025-06<\/td><td>76% 認為能分辨很重要；53% 沒信心分辨<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Thomson Reuters Institute 2026<\/td><td>27 國 1,514 位專業人員，2025-10 至 11<\/td><td>不到三分之一的企業部門知道事務所有沒有用 AI<\/td><td>報告沒有列出<\/td><\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">我們沒有找到含台灣樣本的同類調查。Salesforce 販售 AI 代理產品；Thomson Reuters 販售 AI 法律與稅務工具。<\/span>\r\n            <\/div>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.2 · 希望被告知用了 AI（各調查題目不同）<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Ipsos：用 AI 的產品與服務應該揭露（30 國平均）<\/span><b>79<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:79%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Pew：能分辨 AI 或人做的，極為或非常重要（美國）<\/span><b>76<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:76%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Salesforce：想知道是不是在跟 AI 代理溝通（18 國）<\/span><b>近 75<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:75%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Ipsos 2025-06-06 · 23,216 人 · Pew 2025-09-17 · 5,023 人 · Salesforce 2024-10-31 · 15,015 人 · 台灣都不在樣本內<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup><sup class=\"cite\" data-e=\"E15\"><a href=\"#r5\">[5]<\/a><\/sup><sup class=\"cite\" data-e=\"E12\"><a href=\"#r4\">[4]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <div class=\"qf-eyebrow\">02<\/div>\r\n            <h2 id=\"penalty\">說了會掉分，藏起來被發現掉更多<\/h2>\r\n            <p><strong>揭露自己用 AI 有代價，但被第三方揭穿的代價更高。排斥的來源，是以為沒有人監督。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-2.jpg\" alt=\"用金色修補裂痕的黑色茶碗\" loading=\"lazy\"><\/figure>\r\n            <p>2025 年發表的一篇研究，用 13 個實驗、超過 5,000 名參與者測試同一件事。結果一致：揭露自己用 AI 的人，比不揭露的人被信任得少，不論揭露是自願還是被要求的。不過這個效果比被第三方揭露時弱。<sup class=\"cite\" data-e=\"E17\"><a href=\"#r8\">[8]<\/a><\/sup>作者寫道：「悄悄用 AI，若之後被別人發現，信任下降最多。」即使是懂科技的評估者，也比較不信任說自己用 AI 的人；參與者包括學生、法律分析師、招募主管、投資人。<sup class=\"cite\" data-e=\"E18 E19\"><a href=\"#r9\">[9]<\/a><\/sup><\/p>\r\n            <p>其他實驗也看到類似的結果。一項美國研究讓 1,276 名成人看虛構的家醫科廣告，提到用 AI 的醫師，在每一種 AI 條件下都被認為明顯較不稱職。<sup class=\"cite\" data-e=\"E20\"><a href=\"#r10\">[10]<\/a><\/sup>另一項美國與英國的研究發現，把新聞標題標為「AI 生成」，會降低讀者認為的準確度與分享意願，不論標題是真是假、由人還是 AI 寫的。<sup class=\"cite\" data-e=\"E21\"><a href=\"#r11\">[11]<\/a><\/sup><\/p>\r\n            <p>同一份研究也找到原因：「這種對 AI 的排斥，來自人們以為標了 AI 生成的標題是完全由 AI 寫、沒有人監督。」（\"entirely written by AI with no human supervision\"）研究者的結論是，標籤要有效，需要讓人清楚標籤的意思。<sup class=\"cite\" data-e=\"E22\"><a href=\"#r11\">[11]<\/a><\/sup><\/p>\r\n            <p>所以很多人選擇不說。KPMG 與墨爾本大學 2025 年的全球調查摘要指出，61% 的員工會避免透露自己在工作中用了 AI 工具。<sup class=\"cite\" data-e=\"E9\"><a href=\"#r12\">[12]<\/a><\/sup><\/p>\r\n            <p>這些都是實驗或調查，量的是評估者的態度，不是真實客戶的行為。樣本也都不含台灣。<\/p>\r\n\r\n            <div class=\"qf-eyebrow\">03<\/div>\r\n            <h2 id=\"who-pays\">出事時，客戶追究的是交出去的人<\/h2>\r\n            <p><strong>錯誤是 AI 產生的，但退費、道歉、終止合作，都落在交付的那一層。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><video src=\"content/articles/solo-trust/media/h2-3.mp4\" poster=\"content/articles/solo-trust/media/h2-3.jpg\" data-sv-play muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video><\/figure>\r\n\r\n            <h3>芝加哥太陽報：一份不存在的書單<\/h3>\r\n            <p>2025 年 5 月 18 日，美國《芝加哥太陽報》刊出一份夏季特刊。兩天後報社發表聲明：「那份書單是用 AI 工具做出來的，推薦了不存在的書」，而且「沒經我們編輯部審閱就放進報紙」。<sup class=\"cite\" data-e=\"E56\"><a href=\"#r13\">[13]<\/a><\/sup><\/p>\r\n            <p>特刊不是報社自己做的。聲明轉述內容供應商 King Features 的說法：King Features 與一名自由撰稿人合作，此人用 AI 代理協助做出這份特刊；King Features 正在終止與此人的合作。報社則決定這期付費版不向訂戶收費，電子版撤下特刊。<sup class=\"cite\" data-e=\"E57 E58\"><a href=\"#r13\">[13]<\/a><\/sup><\/p>\r\n            <p>報社事後查核全部 10 篇有具名來源的文章，每篇都有多處錯誤。推薦的 15 本書裡，10 本書名是假的，作者是真的。<sup class=\"cite\" data-e=\"E59\"><a href=\"#r14\">[14]<\/a><\/sup>執行長 Melissa Bell 寫了道歉文：「我沒有深入查這些特刊，很快就核准團隊沿用既有做法。」她認為 King 的團隊「很可能」沒做徹底的事實查核。之後第三方內容改由新成立的 Standards 團隊審閱，報社也不打算再用 King Features 的其他編輯特刊。<sup class=\"cite\" data-e=\"E60\"><a href=\"#r15\">[15]<\/a><\/sup><\/p>\r\n            <p>這條鏈是：自由撰稿人 → 內容供應商 → 報社 → 讀者。報社說特刊沒經編輯部審閱；執行長推測供應商很可能沒做徹底的查核。最後被終止合作的，是最前面那個撰稿人。<\/p>\r\n\r\n            <h3>澳洲：退回部分合約款<\/h3>\r\n            <p>據澳洲綠黨 2025 年 10 月 9 日的新聞稿，財政部在參議院預算聽證會上表示，Deloitte 只退了 97,587 澳元，不到 44 萬澳元合約的四分之一；財政部也承認，它是從媒體報導發現 Deloitte 的錯誤。<sup class=\"cite\" data-e=\"E52 E53\"><a href=\"#r16\">[16]<\/a><\/sup>這是綠黨的轉述，不是議事錄；新聞稿的標題稱這件事是「AI report bungle」。<\/p>\r\n\r\n            <h3>AI 會出錯，而且查核要花時間<\/h3>\r\n            <ul>\r\n                <li>Stanford 等研究者 2024 年測試主要的法律 AI 研究工具，各有 17% 到 33% 的時間會幻覺。測試用的是 200 多個刻意有難度的美國法律查詢。<sup class=\"cite\" data-e=\"E71\"><a href=\"#r18\">[18]<\/a><\/sup><\/li>\r\n                <li>同一份研究：回答正確且有依據的比例，三個工具分別是 65%、41%、19%。回答越長，查核越花時間，因為「每個命題和引用都要個別評估」。<sup class=\"cite\" data-e=\"E72\"><a href=\"#r18\">[18]<\/a><\/sup><\/li>\r\n                <li>Vectara 的摘要幻覺率排行榜（2026-10-22 版）：最低 1.8%，部分主流模型在 3.1% 到 12.2% 之間。測的是有原文可對照的摘要任務，由 Vectara 自家模型判定。<sup class=\"cite\" data-e=\"E73\"><a href=\"#r19\">[19]<\/a><\/sup><\/li>\r\n            <\/ul>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.3 · 法律 AI 研究工具：回答正確且有依據的比例<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Lexis+ AI<\/span><b>65<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:65%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Westlaw AI-Assisted Research<\/span><b>41<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:41%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Ask Practical Law AI<\/span><b>19<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:19%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Magesh 等 arXiv 預印本 2024-05-30 · 200 多個刻意有難度的美國法律查詢 · 2024-03 至 05 執行<sup class=\"cite\" data-e=\"E72 E71\"><a href=\"#r18\">[18]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 2 · 出事之後<\/span>\r\n                <table>\r\n                    <thead><tr><th>事件<\/th><th>誰用了 AI<\/th><th>後果<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr><td>芝加哥太陽報夏季特刊（2025-05）<\/td><td>內容供應商合作的自由撰稿人<\/td><td>撰稿人被終止合作；報社不向訂戶收費、撤下電子版、執行長道歉<\/td><\/tr>\r\n                        <tr><td>Deloitte 澳洲合約（2025-10 揭露退款）<\/td><td>據綠黨新聞稿，問題出在 Deloitte 的報告<\/td><td>據綠黨新聞稿，退回 97,587 澳元<\/td><\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">來源：Chicago Sun-Times 2025-05-20、2025-05-29；Australian Greens 2025-10-09<\/span>\r\n            <\/div>\r\n\r\n            <div class=\"qf-eyebrow\">04<\/div>\r\n            <h2 id=\"checklist\">各地指引要求的，是同一張清單<\/h2>\r\n            <p><strong>律師、金融、公部門的指引寫法不同，但都要求說清楚：用了什麼、在哪一步、誰檢查、誰負責。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-4.jpg\" alt=\"拆開的錶芯零件依序排在黑布上\" loading=\"lazy\"><\/figure>\r\n            <p>新加坡律政部 2026 年 3 月發布的法律業生成式 AI 指南寫得最具體。它建議法律專業人員向客戶：<\/p>\r\n            <ul>\r\n                <li>說明怎麼用 GenAI，「例如用哪些工具、在工作流程的哪個階段、由誰用、產出怎麼驗證」（\"which tools are used, at what stage of the legal workflow, by whom, and how the output is verified\"）；<\/li>\r\n                <li>說明雖然可能使用 GenAI 工具，專業人員對工作成果保有全部責任；<\/li>\r\n                <li>提供客戶選擇，讓案件不使用 GenAI。<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/li>\r\n            <\/ul>\r\n            <p>同一份指南轉述新加坡最高法院的要求：法院使用者要準備好，在被問到時指出文件哪裡用了 GenAI，並說明產出怎麼驗證。<sup class=\"cite\" data-e=\"E36\"><a href=\"#r20\">[20]<\/a><\/sup>指南也附了委任書的範例條款：所有產出都經合格專業人員審閱；沒有必要防護與客戶事先同意，不把客戶敏感資訊交給外部 AI 系統。<sup class=\"cite\" data-e=\"E39\"><a href=\"#r20\">[20]<\/a><\/sup>指南自稱不具拘束力，但寫明使用 GenAI 不會轉移或減輕專業人員對成果的最終責任。<sup class=\"cite\" data-e=\"E34\"><a href=\"#r20\">[20]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 3 · 指引要客戶知道什麼、要留什麼紀錄<\/span>\r\n                <table>\r\n                    <thead><tr><th>指引<\/th><th>效力<\/th><th>告知與責任<\/th><th>紀錄與資料<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>新加坡律政部 法律業 GenAI 指南（2026-03-06）<\/td>\r\n                            <td>自願指引<\/td>\r\n                            <td>說明工具、階段、使用者、驗證方式；保有全部責任；客戶可選不用<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/td>\r\n                            <td>未經同意，不把敏感資訊交給外部 AI（範例條款）<sup class=\"cite\" data-e=\"E39\"><a href=\"#r20\">[20]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>加州律師公會 生成式 AI 實務指引（2026-05-14 核准）<\/td>\r\n                            <td>職業倫理實務指引<\/td>\r\n                            <td>對 AI 協助產生的成果負全部責任，必須審閱、驗證、更正；必須考慮向客戶揭露，並遵守客戶限制 AI 的指示<sup class=\"cite\" data-e=\"E29 E31\"><a href=\"#r21\">[21]<\/a><\/sup><\/td>\r\n                            <td>未取得客戶知情同意，不得把機密資訊輸入有重大風險的生成式 AI<sup class=\"cite\" data-e=\"E30\"><a href=\"#r21\">[21]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>金管會 金融業運用 AI 指引（2024-06-20）<\/td>\r\n                            <td>行政指導（台灣）<\/td>\r\n                            <td>面對客戶時宜告知、尊重選擇、提醒替代方案；金融機構應對所用 AI 負責，生成式 AI 產出仍需人員管控<sup class=\"cite\" data-e=\"E43 E46\"><a href=\"#r22\">[22]<\/a><\/sup><\/td>\r\n                            <td>宜要求第三方業者留存作業紀錄；針對模型、資料及提示留下紀錄<sup class=\"cite\" data-e=\"E45\"><a href=\"#r22\">[22]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>加拿大 NL 省政府 AI 政策（2025-04-17）<\/td>\r\n                            <td>政府內部政策<\/td>\r\n                            <td>適用對象包括顧問與廠商；個人須為 AI 產出的正確性負責<sup class=\"cite\" data-e=\"E55\"><a href=\"#r17\">[17]<\/a><\/sup><\/td>\r\n                            <td>使用前必須由人驗證正確性<sup class=\"cite\" data-e=\"E55\"><a href=\"#r17\">[17]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">這些指引不直接管台灣的一人公司。表格只當清單參考。<\/span>\r\n            <\/div>\r\n\r\n            <p>金管會的指引有一點和一人公司直接相關。它的對象是金融機構，但寫明「金融機構宜要求第三方業者留存執行受託辦理事項之書面或數位作業紀錄」。<sup class=\"cite\" data-e=\"E45\"><a href=\"#r22\">[22]<\/a><\/sup>如果您的客戶是金融機構，您就是那個第三方。金管會也寫明，金融機構使用 AI 與消費者直接互動前，宜主動告知該服務是 AI 自動完成的。<sup class=\"cite\" data-e=\"E44\"><a href=\"#r22\">[22]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"qf-eyebrow\">05<\/div>\r\n            <h2 id=\"taiwan\">台灣目前：原則有了，細則還沒有<\/h2>\r\n            <p><strong>我們沒有找到要求台灣一人公司向客戶揭露 AI 使用的具體規定。契約與紀錄要自己補上。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-5.jpg\" alt=\"桌上的拼圖只拼好外框，中間空著\" loading=\"lazy\"><\/figure>\r\n\r\n            <h3>人工智慧基本法：政府的原則<\/h3>\r\n            <p>《人工智慧基本法》2026 年 1 月 14 日公布，同日施行。第 4 條寫：「人工智慧之產出應做適當資訊揭露或標記」，也要求「應確保承擔相應之責任」。<sup class=\"cite\" data-e=\"E48\"><a href=\"#r23\">[23]<\/a><\/sup>但這一條的主詞是「政府推動人工智慧之研發與應用」，是政府的施政原則，不是對個別業者的義務。全法沒有罰則。對民間的管理規範，要等各目的事業主管機關訂定；法律要求施行後二年內完成法規調整。<sup class=\"cite\" data-e=\"E48 E49\"><a href=\"#r23\">[23]<\/a><\/sup><\/p>\r\n\r\n            <h3>專業團體：還在進修階段<\/h3>\r\n            <p>全國律師聯合會 2026 年 4 月 18 日修正後的《律師倫理規範》，全文沒有出現「人工智慧」「生成式」「AI」字樣。<sup class=\"cite\" data-e=\"E40\"><a href=\"#r24\">[24]<\/a><\/sup>全聯會 2024 年 10 月通過了「人工智慧（AI）與法律」的進修課綱，但那是研習課程，不是行為規範。<sup class=\"cite\" data-e=\"E41\"><a href=\"#r25\">[25]<\/a><\/sup>我們沒有找到台灣律師團體正式發布的生成式 AI 使用指引。<\/p>\r\n\r\n            <h3>著作權：交付物歸誰，要寫進契約<\/h3>\r\n            <ul>\r\n                <li>智慧財產局的說明：AI 生成的成果是否享有著作權，「應視創作過程中有無人類實際的創意投入而定」；完全由 AI 獨立完成的，無法享有著作權。<sup class=\"cite\" data-e=\"E80\"><a href=\"#r26\">[26]<\/a><\/sup><\/li>\r\n                <li>智慧局也建議先釐清 AI 模型的授權、遵循 AI 提供者的使用規範；有爭議時由司法機關個案認定。<sup class=\"cite\" data-e=\"E81\"><a href=\"#r26\">[26]<\/a><\/sup><\/li>\r\n                <li>《著作權法》第 12 條：出資聘人完成的著作，沒有約定時，著作財產權「歸受聘人享有」，出資人得利用該著作。<sup class=\"cite\" data-e=\"E82\"><a href=\"#r27\">[27]<\/a><\/sup>也就是說，成果如果有著作權，又沒寫進契約，客戶付了錢，著作財產權仍歸您。<\/li>\r\n                <li>賴文智律師放在智慧局網站上的講義寫：「若使用生成式AI自行生成，請保留使用的紀錄」；「使用生成式AI，還是由使用者負實體世界的法律責任」，「對外利用前也須再次檢視」。<sup class=\"cite\" data-e=\"E83 E84\"><a href=\"#r28\">[28]<\/a><\/sup>這是講者的講義，不是智慧局的函釋。<\/li>\r\n            <\/ul>\r\n\r\n            <h3>客戶資料：能不能貼進 AI<\/h3>\r\n            <p>金管會的指引寫明：「在無適當管控機制下，金融機構人員不得向生成式 AI 提供未經客戶同意提供之資訊。」<sup class=\"cite\" data-e=\"E88\"><a href=\"#r22\">[22]<\/a><\/sup>這是對金融業的行政指導，不直接適用其他行業。<\/p>\r\n            <p>《個人資料保護法》2025 年 11 月 11 日修正公布，第 12 條要求個資外洩時通知當事人並保存紀錄。施行日期「由行政院定之」，目前還沒有定。條文沒有提到 AI。<sup class=\"cite\" data-e=\"E50\"><a href=\"#r29\">[29]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"qf-eyebrow\">06<\/div>\r\n            <h2 id=\"deliver\">把「這是怎麼來的」做成交付物的一部分<\/h2>\r\n            <p><strong>可追溯讓客戶能檢查，但不保證正確。交付時，這兩件事要分開說。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-6.jpg\" alt=\"標本抽屜裡的菊石化石，綁著空白吊牌\" loading=\"lazy\"><\/figure>\r\n            <p>美國國家標準暨技術研究院（NIST）的 AI 風險管理框架寫：「可信的 AI 取決於問責。問責以透明為前提。」（\"Trustworthy AI depends upon accountability. Accountability presupposes transparency.\"）同一份文件也寫：「透明的系統不一定是準確……的系統。」<sup class=\"cite\" data-e=\"E61\"><a href=\"#r30\">[30]<\/a><\/sup>內容來源標準 C2PA 也這樣說明自己：來源資訊能證明出處與歷史，「但光靠來源資訊，不能告訴你內容是否真實、正確或符合事實」。<sup class=\"cite\" data-e=\"E70\"><a href=\"#r34\">[34]<\/a><\/sup><\/p>\r\n            <p>NIST 的生成式 AI 指引，引用白宮 2022 年的定義，描述什麼是「高完整性資訊」：分清事實、意見與推論；承認不確定；公開說明經過多少查核；能用適當證據連回原始來源；有清楚的保管鏈。<sup class=\"cite\" data-e=\"E64\"><a href=\"#r31\">[31]<\/a><\/sup>它也建議追蹤數位內容的來源與修改，並且複核、查證生成式 AI 輸出裡的來源與引用。<sup class=\"cite\" data-e=\"E62 E63\"><a href=\"#r31\">[31]<\/a><\/sup>OECD 的 AI 原則要求提供淺白資訊，說明輸出的來源與邏輯，讓受影響的人能理解、也能質疑；並確保資料、過程與決定的可追溯性。<sup class=\"cite\" data-e=\"E68 E69\"><a href=\"#r32\">[32]<\/a><a href=\"#r33\">[33]<\/a><\/sup>這些都是自願指引。<\/p>\r\n            <p>調查也指向同一個方向。KPMG 與墨爾本大學的全球調查中，83% 的受訪者說，有保證機制時會更願意信任 AI 系統；機制包括人可以介入修正、出問題時清楚由誰負責。<sup class=\"cite\" data-e=\"E6\"><a href=\"#r35\">[35]<\/a><\/sup><\/p>\r\n            <p>把上面的指引放在一起，交付物可以附上這五項：<\/p>\r\n            <ol class=\"st-cards\">\r\n                <li><span class=\"n\">01<\/span><span><strong>來源清單。<\/strong>每個數字、每句引言，都連回原始文件。<sup class=\"cite\" data-e=\"E64 E62\"><a href=\"#r31\">[31]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">02<\/span><span><strong>AI 用在哪一步。<\/strong>寫明哪個工具、用在工作流程的哪個階段。<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">03<\/span><span><strong>誰複核、怎麼驗證。<\/strong>寫明您檢查了什麼、用什麼方法查證。<sup class=\"cite\" data-e=\"E37 E36\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">04<\/span><span><strong>責任聲明。<\/strong>寫明成果由您負責，不因為用了 AI 而改變。<sup class=\"cite\" data-e=\"E37 E34\"><a href=\"#r20\">[20]<\/a><\/sup><sup class=\"cite\" data-e=\"E29\"><a href=\"#r21\">[21]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">05<\/span><span><strong>客戶的選擇。<\/strong>客戶可以要求不用 AI，或限制哪些資料能交給 AI。<sup class=\"cite\" data-e=\"E37 E39\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n            <\/ol>\r\n            <p>第 1 項讓客戶能檢查；第 3、4 項回答「錯了怎麼辦」。兩者要分開寫，因為來源清楚，不代表內容正確。<\/p>\r\n\r\n            <div class=\"pd-stage bl-invite\">\r\n                <p>客戶問過您「這是怎麼來的？」嗎？您當時怎麼回答？<\/p>\r\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey\">填寫問卷 <span class=\"arr\">→<\/span><\/a>\n        <\/div>\r\n\r\n            <h2 id=\"refs\">參考資料<\/h2>\r\n            <ol class=\"bl-refs\">\r\n                <li id=\"r1\"><span class=\"pub\">台灣微軟<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://news.microsoft.com/zh-tw/ms-wti-ai/\" rel=\"noopener\" target=\"_blank\">2024 工作趨勢指數台灣版新聞稿<\/a><\/li>\r\n                <li id=\"r2\"><span class=\"pub\">行政院主計總處<\/span><span class=\"d\">2026-03<\/span><a href=\"https://www.stat.gov.tw/News_Content.aspx?n=4001&amp;s=236078\" rel=\"noopener\" target=\"_blank\">114 年人力資源調查統計（表 15 歷年就業者之從業身分）<\/a><\/li>\r\n                <li id=\"r3\"><span class=\"pub\">Ipsos<\/span><span class=\"d\">2025-06-06<\/span><a href=\"https://www.ipsos.com/sites/default/files/ct/news/documents/2025-06/Ipsos-AI-Monitor-2025_0.pdf\" rel=\"noopener\" target=\"_blank\">Ipsos AI Monitor 2025<\/a><\/li>\r\n                <li id=\"r4\"><span class=\"pub\">Salesforce<\/span><span class=\"d\">2024-10-31<\/span><a href=\"https://www.salesforce.com/news/stories/ai-customer-research/\" rel=\"noopener\" target=\"_blank\">AI customer research（新聞頁）<\/a><\/li>\r\n                <li id=\"r5\"><span class=\"pub\">Pew Research Center<\/span><span class=\"d\">2025-09-17<\/span><a href=\"https://www.pewresearch.org/science/2025/09/17/how-americans-view-ai-and-its-impact-on-people-and-society/\" rel=\"noopener\" target=\"_blank\">How Americans View AI and Its Impact on People and Society<\/a><\/li>\r\n                <li id=\"r6\"><span class=\"pub\">Thomson Reuters Institute<\/span><span class=\"d\">2026-02-09<\/span><a href=\"https://www.thomsonreuters.com/en-us/posts/technology/ai-in-professional-services-report-2026\" rel=\"noopener\" target=\"_blank\">2026 AI in Professional Services Report（文章）<\/a><\/li>\r\n                <li id=\"r7\"><span class=\"pub\">Thomson Reuters Institute<\/span><span class=\"d\">2026-02-09<\/span><a href=\"https://www.thomsonreuters.com/content/dam/ewp-m/documents/thomsonreuters/en/pdf/reports/2026-ai-in-professional-services-report.pdf\" rel=\"noopener\" target=\"_blank\">2026 AI in Professional Services Report（報告 PDF）<\/a><\/li>\r\n                <li id=\"r8\"><span class=\"pub\">Schilke &amp; Reimann, Organizational Behavior and Human Decision Processes<\/span><span class=\"d\">2025-05-01<\/span><a href=\"https://par.nsf.gov/biblio/10597787\" rel=\"noopener\" target=\"_blank\">The transparency dilemma: How AI disclosure erodes trust<\/a><\/li>\r\n                <li id=\"r9\"><span class=\"pub\">University of Arizona News（作者文章）<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://news.arizona.edu/employee-news/being-honest-about-using-ai-work-makes-people-trust-you-less-research-finds\" rel=\"noopener\" target=\"_blank\">Being honest about using AI at work makes people trust you less, research finds<\/a><\/li>\r\n                <li id=\"r10\"><span class=\"pub\">JAMA Network Open<\/span><span class=\"d\">2025-07-17<\/span><a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/10.1001/jamanetworkopen.2025.21643\" rel=\"noopener\" target=\"_blank\">Public Perception of Physicians Who Use Artificial Intelligence<\/a><\/li>\r\n                <li id=\"r11\"><span class=\"pub\">Altay &amp; Gilardi, PNAS Nexus<\/span><span class=\"d\">2024-10-01<\/span><a href=\"https://academic.oup.com/pnasnexus/article/3/10/pgae403/7795946\" rel=\"noopener\" target=\"_blank\">People are skeptical of headlines labeled as AI-generated, even if true or human-made, because they assume full AI automation<\/a><\/li>\r\n                <li id=\"r12\"><span class=\"pub\">KPMG × The University of Melbourne<\/span><span class=\"d\">2025-04<\/span><a href=\"https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2025/trust-attitudes-artificial-intelligence-executive-summary.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI（摘要 PDF）<\/a><\/li>\r\n                <li id=\"r13\"><span class=\"pub\">Chicago Sun-Times<\/span><span class=\"d\">2025-05-20<\/span><a href=\"https://chicago.suntimes.com/press-room/2025/05/20/chicago-sun-times-response-to-may-18-special-section\" rel=\"noopener\" target=\"_blank\">Chicago Sun-Times response to May 18 special section<\/a><\/li>\r\n                <li id=\"r14\"><span class=\"pub\">Chicago Sun-Times<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://chicago.suntimes.com/news/2025/05/29/special-section-king-fake-book-list-errors-sun-times-review\" rel=\"noopener\" target=\"_blank\">Special section with fake book list plagued with additional errors, Sun-Times review finds<\/a><\/li>\r\n                <li id=\"r15\"><span class=\"pub\">Chicago Sun-Times（Melissa Bell）<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://chicago.suntimes.com/opinion/2025/05/29/lessons-apology-from-sun-times-ceo-ai-generated-book-list\" rel=\"noopener\" target=\"_blank\">Lessons (and an apology) from the Sun-Times CEO on that AI-generated book list<\/a><\/li>\r\n                <li id=\"r16\"><span class=\"pub\">Australian Greens<\/span><span class=\"d\">2025-10-09<\/span><a href=\"https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report\" rel=\"noopener\" target=\"_blank\">Greens slam Deloitte's unethical behaviour and measly refund over AI report bungle<\/a><\/li>\r\n                <li id=\"r17\"><span class=\"pub\">Government of Newfoundland and Labrador, OCIO<\/span><span class=\"d\">2025-04-17<\/span><a href=\"https://www.gov.nl.ca/exec/ocio/ai-policy/\" rel=\"noopener\" target=\"_blank\">Responsible Use of Artificial Intelligence Technology（AI policy）<\/a><\/li>\r\n                <li id=\"r18\"><span class=\"pub\">Magesh 等（arXiv 預印本）<\/span><span class=\"d\">2024-05-30<\/span><a href=\"https://arxiv.org/abs/2405.20362\" rel=\"noopener\" target=\"_blank\">Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools<\/a><\/li>\r\n                <li id=\"r19\"><span class=\"pub\">Vectara<\/span><span class=\"d\">2026-10-22 更新<\/span><a href=\"https://github.com/vectara/hallucination-leaderboard\" rel=\"noopener\" target=\"_blank\">Hallucination Leaderboard<\/a><\/li>\r\n                <li id=\"r20\"><span class=\"pub\">Ministry of Law, Singapore<\/span><span class=\"d\">2026-03-06<\/span><a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">Guide for Using Generative Artificial Intelligence in the Legal Sector<\/a><\/li>\r\n                <li id=\"r21\"><span class=\"pub\">The State Bar of California, COPRAC<\/span><span class=\"d\">2026-05-14 核准<\/span><a href=\"https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf\" rel=\"noopener\" target=\"_blank\">Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law<\/a><\/li>\r\n                <li id=\"r22\"><span class=\"pub\">金融監督管理委員會<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">金融業運用人工智慧(AI)指引（指引本文 PDF）<\/a><\/li>\r\n                <li id=\"r23\"><span class=\"pub\">總統府公報 第 7837 號<\/span><span class=\"d\">2026-01-14<\/span><a href=\"https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7\" rel=\"noopener\" target=\"_blank\">人工智慧基本法<\/a><\/li>\r\n                <li id=\"r24\"><span class=\"pub\">中華民國律師公會全國聯合會<\/span><span class=\"d\">2026-04-18 修正<\/span><a href=\"https://www.twba.org.tw/regulation/morale/65bfe5e5-1a32-47db-b2b2-3783369c8e60\" rel=\"noopener\" target=\"_blank\">律師倫理規範（全文含對照表）<\/a><\/li>\r\n                <li id=\"r25\"><span class=\"pub\">中華民國律師公會全國聯合會<\/span><span class=\"d\">2024-10-25<\/span><a href=\"https://www.twba.org.tw/news/ab9dce85-2a8b-472d-8146-ce3f4b3fb295\" rel=\"noopener\" target=\"_blank\">「人工智慧（AI）與法律」專業領域進修科目課綱公告<\/a><\/li>\r\n                <li id=\"r26\"><span class=\"pub\">經濟部智慧財產局<\/span><span class=\"d\">2025-05-22（更新 2025-07-02）<\/span><a href=\"https://www.tipo.gov.tw/tw/copyright/692-34252.html\" rel=\"noopener\" target=\"_blank\">電子郵件 1140522c<\/a><\/li>\r\n                <li id=\"r27\"><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">—<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=J0070017&amp;flno=12\" rel=\"noopener\" target=\"_blank\">著作權法 第 12 條<\/a><\/li>\r\n                <li id=\"r28\"><span class=\"pub\">賴文智律師（講義放在經濟部智慧財產局網站）<\/span><span class=\"d\">2025-10-30<\/span><a href=\"https://www.tipo.gov.tw/wSite/public/Attachment/006/f1762389262199.pdf\" rel=\"noopener\" target=\"_blank\">AI人工智慧相關著作權議題<\/a><\/li>\r\n                <li id=\"r29\"><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">2025-11-11 修正<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021\" rel=\"noopener\" target=\"_blank\">個人資料保護法<\/a><\/li>\r\n                <li id=\"r30\"><span class=\"pub\">NIST<\/span><span class=\"d\">2023-01<\/span><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf\" rel=\"noopener\" target=\"_blank\">NIST AI 100-1：AI Risk Management Framework (AI RMF 1.0)<\/a><\/li>\r\n                <li id=\"r31\"><span class=\"pub\">NIST<\/span><span class=\"d\">2024-07<\/span><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">NIST AI 600-1：Generative Artificial Intelligence Profile<\/a><\/li>\r\n                <li id=\"r32\"><span class=\"pub\">OECD<\/span><span class=\"d\">2024-05 更新<\/span><a href=\"https://oecd.ai/en/dashboards/ai-principles/P7\" rel=\"noopener\" target=\"_blank\">OECD AI Principles 1.3：Transparency and explainability<\/a><\/li>\r\n                <li id=\"r33\"><span class=\"pub\">OECD<\/span><span class=\"d\">2024-05 更新<\/span><a href=\"https://oecd.ai/en/dashboards/ai-principles/P9\" rel=\"noopener\" target=\"_blank\">OECD AI Principles 1.5：Accountability<\/a><\/li>\r\n                <li id=\"r34\"><span class=\"pub\">C2PA<\/span><span class=\"d\">規格 2.3<\/span><a href=\"https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html\" rel=\"noopener\" target=\"_blank\">C2PA and Content Credentials Explainer<\/a><\/li>\r\n                <li id=\"r35\"><span class=\"pub\">The University of Melbourne × KPMG<\/span><span class=\"d\">2025-04<\/span><a href=\"https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI: A global study 2025<\/a><\/li>\r\n            <\/ol>\r\n        <\/div>\n\n    <\/article>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/cases": {"title": "成功案例 — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>成功案例 — 麒麟魚 Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/cases\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/cases\">\n    \n    <link rel=\"pre
