 development, so visitors can cross-check for themselves.<\/p>\n        <\/div>\n\n        <div class=\"qf-list\" data-reveal>\n            <a href=\"https://law.moj.gov.tw/\" target=\"_blank\" rel=\"noopener\">\n                <span class=\"n\">R-01<\/span>\n                <span class=\"label\">Laws &amp; Regulations Database of the Republic of China (Taiwan)<\/span>\n                <span class=\"desc\">Maintained by the Ministry of Justice — the search portal for Taiwan&#39;s current laws and regulations, judicial precedents and interpretations, orders, and administrative rulings.<\/span>\n                <span class=\"arr\">↗<\/span>\n            <\/a>\n        <\/div>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/survey": {"title": "Take the survey — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Take the survey — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/survey\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/survey\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <a href=\"#/en/survey\"   class=\"is-active\">Survey<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/survey\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/survey\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"sv-hero\">\n        <video class=\"sv-hero__video\" src=\"backend/src/main/resources/static/media/court.mp4\"\n               poster=\"backend/src/main/resources/static/media/court.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"sv-corner tl\"><\/span><span class=\"sv-corner tr\"><\/span>\n        <div class=\"sv-hero__inner\">\n            <div class=\"sv-rec\"><span><span class=\"sv-rec__dot\">●<\/span> REC<\/span><span>2023-06-22 · Federal court, New York<\/span><span class=\"warn\">6 cases did not exist<\/span><\/div>\n            <h1 class=\"sv-hero__title\">Every one of these was handed over first, <em>and caught by someone else afterwards.<\/em><\/h1>\n            <p class=\"sv-hero__sub\">Lawyers, consultants, support staff and engineers have all had AI hand them something that was &quot;almost right&quot;. We want to hear about your most recent time: how did you decide it was good to go?<\/p>\n            <a class=\"qf-btn qf-btn--primary sv-cta\" href=\"#sv-choose\">Tell us about that time <span class=\"arr\">↓<\/span><\/a>\n            <div class=\"sv-meta\"><span>TIME / <b>About 7 minutes<\/b><\/span><span>PRIVACY / <b>No names or companies published<\/b><\/span><span>YOU GET / <b>The summary report<\/b><\/span><\/div>\n        <\/div>\n        <span class=\"sv-ai\">Illustration · AI generated<\/span>\n    <\/header>\n\n    <!-- ---- numbers ---- -->\n    <section class=\"sv-section\">\n        <div class=\"sv-eb\">fig.1 · Already on the record<\/div>\n        <div class=\"sv-dots\">\n            <canvas data-sv-dots width=\"1400\" height=\"560\" aria-label=\"2,207 dots, one for every AI-fabricated citation in a court record\"><\/canvas>\n            <div class=\"sv-dots__over\">\n                <b data-sv-count>2,207<\/b>\n                <span>Every dot is one AI-fabricated citation in a court record. The ones who caught it were almost always opposing counsel or the judge.<\/span>\n                <span class=\"sv-src\">AI HALLUCINATION CASES DATABASE · D. CHARLOTIN · AS OF 2026-10-23<\/span>\n            <\/div>\n        <\/div>\n        <div class=\"sv-two\" data-sv-grow>\n            <div class=\"sv-panel\">\n                <div class=\"sv-eb\">fig.2 · Distrust, but not a check every time<\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Do not fully trust AI output<\/span><b>96%<\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:96%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Check before every submission<\/span><b>48%<\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <span class=\"sv-gapq\">Those 48 points in between: what decides it is good to go?<\/span>\n                <span class=\"sv-src\">SONAR 2026 · 1,100+ developers · vendor survey<\/span>\n            <\/div>\n            <div class=\"sv-panel sv-scale\">\n                <div class=\"sv-eb\">fig.3 · The price once it is found<\/div>\n                <svg viewBox=\"0 0 540 150\" role=\"img\" aria-label=\"Amounts on a log scale: airline chatbot CA$812, lawyer&#39;s brief US$5,000, consulting report refund AU$97,000, false AI claims US$400,000, insurer&#39;s system change NT$30M, bank system migration £48.65M\">\n                    <line x1=\"20\" y1=\"80\" x2=\"520\" y2=\"80\" class=\"ax\"/>\n                    <g class=\"tick\" text-anchor=\"middle\">\n                        <text x=\"20\" y=\"98\">$100<\/text><text x=\"103\" y=\"98\">$1K<\/text><text x=\"187\" y=\"98\">$10K<\/text><text x=\"270\" y=\"98\">$100K<\/text><text x=\"353\" y=\"98\">$1M<\/text><text x=\"437\" y=\"98\">$10M<\/text><text x=\"520\" y=\"98\">$100M<\/text>\n                    <\/g>\n                    <g class=\"lab\">\n                        <g class=\"pt\" style=\"transition-delay:.1s\"><circle cx=\"84\" cy=\"80\" r=\"4.5\"/><text x=\"84\" y=\"62\" text-anchor=\"middle\">Airline chatbot<\/text><text x=\"84\" y=\"50\" text-anchor=\"middle\" class=\"amt\">CA$812<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.35s\"><circle cx=\"161\" cy=\"80\" r=\"4.5\"/><text x=\"161\" y=\"118\" text-anchor=\"middle\">Lawyer&#39;s brief<\/text><text x=\"161\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$5K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.6s\"><circle cx=\"252\" cy=\"80\" r=\"4.5\"/><text x=\"244\" y=\"62\" text-anchor=\"middle\">Consulting refund<\/text><text x=\"244\" y=\"50\" text-anchor=\"middle\" class=\"amt\">AU$97K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.85s\"><circle cx=\"320\" cy=\"80\" r=\"4.5\"/><text x=\"316\" y=\"118\" text-anchor=\"middle\">False AI claims<\/text><text x=\"316\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$400K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.1s\"><circle cx=\"350\" cy=\"80\" r=\"5.5\"/><line x1=\"352\" y1=\"74\" x2=\"368\" y2=\"36\" class=\"lead\"/><text x=\"372\" y=\"30\" text-anchor=\"middle\">Insurer&#39;s new system<\/text><text x=\"372\" y=\"18\" text-anchor=\"middle\" class=\"amt\">NT$30M<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.35s\"><circle cx=\"500\" cy=\"80\" r=\"7\" class=\"big\"/><text x=\"506\" y=\"62\" text-anchor=\"end\">Bank migration<\/text><text x=\"506\" y=\"50\" text-anchor=\"end\" class=\"amt\">£48.65M<\/text><\/g>\n                    <\/g>\n                <\/svg>\n                <span class=\"sv-src\">Fines, damages and refunds, roughly converted to US dollars and placed on one log scale<\/span>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- four stills ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">fig.4 · Four things that really happened<\/div>\n        <div class=\"sv-reel\">\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/court.mp4\" poster=\"backend/src/main/resources/static/media/court.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"A lawyer&#39;s desk at night, the brief&#39;s citations circled in red\"><\/video>\n                <figcaption><span class=\"d\">2023-06-22 · Federal court, New York<\/span><b>A lawyer wrote a brief with AI and filed 6 cases that do not exist<\/b><span class=\"amt\">Fined US$5,000<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/chat.mp4\" poster=\"backend/src/main/resources/static/media/chat.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"A phone on an airport table, open on a support chat\"><\/video>\n                <figcaption><span class=\"d\">2024-02-14 · Canada<\/span><b>An airline&#39;s support chatbot got the refund rules wrong, and the airline was held liable<\/b><span class=\"amt\">Ordered to pay CA$812<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/review.mp4\" poster=\"backend/src/main/resources/static/media/review.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"An engineer reviewing code on screen late at night\"><\/video>\n                <figcaption><span class=\"d\">2025 · STACK OVERFLOW DEVELOPER SURVEY<\/span><b>66% have met AI answers that were &quot;almost right, but not quite&quot;<\/b><span class=\"amt\">31,476 respondents<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/server.mp4\" poster=\"backend/src/main/resources/static/media/server.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Reading system documents by flashlight in an old server room\"><\/video>\n                <figcaption><span class=\"d\">2019-09 · Taiwan<\/span><b>A life insurer replaced its core system, and 152,000 policies went wrong<\/b><span class=\"amt\">Fined NT$30M<\/span><\/figcaption><\/figure>\n        <\/div>\n        <div class=\"sv-note\">The pictures are AI-generated illustrations, not the actual scenes.<\/div>\n    <\/section>\n\n    <!-- ---- choose one ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-choose\">\n        <div class=\"sv-eb\">STEP 01 · Pick one<\/div>\n        <h2 class=\"sv-h2\">Which one was your most recent?<\/h2>\n        <div class=\"sv-choose\" role=\"group\" aria-label=\"Pick one experience\">\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"verify\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_desk.mp4\" poster=\"backend/src/main/resources/static/media/bp_desk.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: a checklist on a review desk with one box left empty\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-A<\/span><span class=\"st\">Pick this<\/span><\/span><b>Checking whether AI output can be used<\/b><span class=\"s\">Code, reports, support replies, an agent saying &quot;done&quot;<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"explain\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_chain.mp4\" poster=\"backend/src/main/resources/static/media/bp_chain.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: one link in a chain of evidence cracked open\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-B<\/span><span class=\"st\">Pick this<\/span><\/span><b>Being asked &quot;where did this come from?&quot;<\/b><span class=\"s\">A manager, client, auditor or regulator wants you to explain<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"inventory\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_mainframe.mp4\" poster=\"backend/src/main/resources/static/media/bp_mainframe.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"Blueprint: exploded view of an old mainframe\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-C<\/span><span class=\"st\">Pick this<\/span><\/span><b>Working out what a legacy system does<\/b><span class=\"s\">Taking over, replacing a system, documents that do not match reality<\/span><\/span>\n            <\/button>\n        <\/div>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"other\">None of these three? <u>Write down what you ran into<\/u> →<\/button>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"none\">Never happened to you? <u>Please tell us too, it is one question<\/u> →<\/button>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>About 7 minutes<\/b><span>A few sentences is fine<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>Not published<\/b><span>Only we see names and companies<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>The summary report<\/b><span>Sent to the contact you leave<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-form\">\n        <div class=\"sv-formwrap\">\n            <nav class=\"sv-toc\" aria-label=\"Form sections\" data-sv-toc>\n                <a href=\"#sv-p1\"><span>01<\/span>About you<\/a>\n                <a href=\"#sv-p2\"><span>02<\/span>The last time<\/a>\n                <a href=\"#sv-p3\" data-branch-link=\"story\"><span>03<\/span>What it cost<\/a>\n                <a href=\"#sv-p4\" data-branch-link=\"story\"><span>04<\/span>What you tried<\/a>\n                <a href=\"#sv-p5\"><span>05<\/span>Follow-up<\/a>\n                <a href=\"#sv-p6\"><span>06<\/span>Contact<\/a>\n            <\/nav>\n\n        <form class=\"qf-survey sv-form\" method=\"post\" action=\"/en/survey\" data-survey-form novalidate>\n\n            <!-- ---- about you ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p1\">// 01 · About you<\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">Which of these is closest to your role?<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程師\" id=\"role1\" name=\"role\">Engineer<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程主管或技術主管\" id=\"role2\" name=\"role\">Engineering or technical manager<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"法遵或法務\" id=\"role3\" name=\"role\">Compliance or legal<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"內部稽核或風險管理\" id=\"role4\" name=\"role\">Internal audit or risk management<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"資訊或 IT 管理\" id=\"role5\" name=\"role\">Information or IT management<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"產品或專案管理\" id=\"role6\" name=\"role\">Product or project management<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"其他\" id=\"role7\" name=\"role\">Other<\/label>\n                <\/div>\n                <div class=\"qf-survey__other\" data-show-if=\"role=其他\">\n                    <input id=\"sf-role-other\" type=\"text\" maxlength=\"64\" placeholder=\"Your role\" name=\"roleOther\" value=\"\">\n                <\/div>\n                <div class=\"qf-field__err\">&gt; Please pick a role.<\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">How large is your organization?<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1–10 人\" id=\"orgSize1\" name=\"orgSize\">1–10 people<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"11–50 人\" id=\"orgSize2\" name=\"orgSize\">11–50 people<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"51–200 人\" id=\"orgSize3\" name=\"orgSize\">51–200 people<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"201–1000 人\" id=\"orgSize4\" name=\"orgSize\">201–1000 people<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1000 人以上\" id=\"orgSize5\" name=\"orgSize\">Over 1000 people<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; Please pick a size.<\/div>\n            <\/div>\n\n            <!-- ---- the last time ---- -->\n            <div class=\"sv-part\" id=\"sv-p2\">\n                <img data-sv-part-img src=\"backend/src/main/resources/static/media/bp_desk.jpg\" alt=\"\">\n                <div><span class=\"k\" data-sv-part-k>// 02 · The last time<\/span><b data-sv-part-title>The last time you had to deal with one of these<\/b><\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">Most recently, which of these did you (or your team) need to do? Pick the one that happened most recently.<span class=\"qf-field__req\">Required<\/span><\/div>\n                <div class=\"qf-choices qf-choices--stack\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"verify\" id=\"situation1\" name=\"situation\">Check whether AI output (code, documents, answers) was correct<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"explain\" id=\"situation2\" name=\"situation\">Respond to someone asking or demanding to know &quot;how we use AI&quot; (a manager, client, auditor or regulator)<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"inventory\" id=\"situation3\" name=\"situation\">Take stock of a legacy system or old code: what is in it, who uses it, whether it still runs<\/label>\n                    <label class=\"qf-choice qf-choice--other\"><input type=\"radio\" value=\"other\" id=\"situation4\" name=\"situation\">Other<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"Write down what it was\" aria-label=\"Other: write down what it was\" data-other-text id=\"situationOther\" name=\"situationOther\" value=\"\"><\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"situation5\" name=\"situation\">None of these has happened<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; Please pick one; if you pick &quot;Other&quot;, write down what it was.<\/div>\n            <\/div>\n\n            <div data-branch=\"story\">\n                <div class=\"qf-field\" data-required>\n                    <div class=\"qf-field__q\">Roughly when was that?<span class=\"qf-field__req\">Required<\/span><\/div>\n                    <div class=\"qf-field__hint\">If it is hard to recall, think back from your last report, release, audit or client inquiry.<\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一週內\" id=\"occurredWhen1\" name=\"occurredWhen\">Within the past week<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一個月內\" id=\"occurredWhen2\" name=\"occurredWhen\">Within the past month<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"一到六個月前\" id=\"occurredWhen3\" name=\"occurredWhen\">One to six months ago<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"超過半年前\" id=\"occurredWhen4\" name=\"occurredWhen\">More than six months ago<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; Please pick a time.<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-what\">What happened that time? What made you feel it had to be dealt with, rather than left alone or used as it was?<span class=\"qf-field__req\">Required<\/span><\/label>\n                    <div class=\"sv-why\">We want to know about the moment you decided to check. No public survey has asked about this yet.<\/div>\n                    <textarea id=\"sf-what\" rows=\"6\" maxlength=\"2000\" data-sv-count-text name=\"whatHappened\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; This one is required.<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-steps\">From starting to deal with it until you felt safe handing it over, what steps did you take? Who was involved? What tools or documents did you use?<span class=\"qf-field__req\">Required<\/span><\/label>\n                    <div class=\"sv-why\">The steps of &quot;how you checked&quot; are the part we most want to understand. A few steps, in order, is enough.<\/div>\n                    <textarea id=\"sf-steps\" rows=\"6\" maxlength=\"2000\" data-sv-count-text placeholder=\"e.g. checked against the source files first, then had a colleague read it, then compared it with last year&#39;s report\" name=\"steps\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; This one is required.<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-outcome\">How did it turn out? Did anything slip through that you only found later?<\/label>\n                    <textarea id=\"sf-outcome\" rows=\"4\" maxlength=\"2000\" name=\"outcome\"><\/textarea>\n                <\/div>\n\n                <!-- ---- cost ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p3\">// 03 · What it cost<\/div>\n\n                <div class=\"qf-field\">\n                    <div class=\"qf-field__q\">Roughly how much time did it take?<\/div>\n                    <div class=\"sv-why\">How many working hours the review takes. A rough figure is fine.<\/div>\n                    <div class=\"qf-inline\">\n                        <input id=\"sf-hours\" type=\"text\" inputmode=\"decimal\" maxlength=\"16\" name=\"hours\" value=\"\">hours,\n                        <input id=\"sf-people\" type=\"text\" inputmode=\"numeric\" maxlength=\"16\" name=\"people\" value=\"\">people involved\n                    <\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-amounts>\n                    <div class=\"qf-field__q\">Did you spend extra money because of it (tools, outsourcing, consultants, overtime)?<\/div>\n                    <div class=\"qf-inline\">\n                        <span class=\"qf-inline__group\">US$ <input id=\"sf-extra-usd\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" aria-label=\"Extra money spent (US dollars)\" data-amount name=\"extraSpendUsd\" value=\"\"><\/span>\n                    <\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"extraSpend1\" name=\"extraSpend\">None<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"unknown\" id=\"extraSpend2\" name=\"extraSpend\">Don&#39;t know<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; Amounts must be numbers only (no currency), e.g. 500 or 1,200.5.<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-worst\">If it had not been dealt with that time, what is the worst that could have happened?<\/label>\n                    <textarea id=\"sf-worst\" rows=\"4\" maxlength=\"2000\" name=\"worstCase\"><\/textarea>\n                <\/div>\n\n                <!-- ---- what you tried ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p4\">// 04 · What you tried<\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-tried\">Have         <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\">文章<\/a>\n        <a href=\"#/survey\"   class=\"is-active\">填寫問卷<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/survey\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/survey\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"sv-hero\">\n        <video class=\"sv-hero__video\" src=\"backend/src/main/resources/static/media/court.mp4\"\n               poster=\"backend/src/main/resources/static/media/court.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"sv-corner tl\"><\/span><span class=\"sv-corner tr\"><\/span>\n        <div class=\"sv-hero__inner\">\n            <div class=\"sv-rec\"><span><span class=\"sv-rec__dot\">●<\/span> REC<\/span><span>2023-06-22 · 紐約聯邦法院<\/span><span class=\"warn\">6 個判例不存在<\/span><\/div>\n            <h1 class=\"sv-hero__title\">這些事，都是交出去之後，<em>才被別人發現的。<\/em><\/h1>\n            <p class=\"sv-hero__sub\">律師、顧問、客服、工程師，都碰過 AI 給的東西「幾乎對」。我們想聽您最近一次：您是怎麼決定它能交出去的？<\/p>\n            <a class=\"qf-btn qf-btn--primary sv-cta\" href=\"#sv-choose\">說說您那一次 <span class=\"arr\">↓<\/span><\/a>\n            <div class=\"sv-meta\"><span>TIME / <b>約 7 分鐘<\/b><\/span><span>PRIVACY / <b>不公開名字與公司<\/b><\/span><span>YOU GET / <b>彙整報告<\/b><\/span><\/div>\n        <\/div>\n        <span class=\"sv-ai\">示意畫面 · AI 生成<\/span>\n    <\/header>\n\n    <!-- ---- numbers ---- -->\n    <section class=\"sv-section\">\n        <div class=\"sv-eb\">fig.1 · 已經被記下來的<\/div>\n        <div class=\"sv-dots\">\n            <canvas data-sv-dots width=\"1400\" height=\"560\" aria-label=\"2,207 個點，每一點是一件法院紀錄裡的 AI 捏造引用\"><\/canvas>\n            <div class=\"sv-dots__over\">\n                <b data-sv-count>2,207<\/b>\n                <span>每一個點，是一件法院紀錄裡的 AI 捏造引用。發現錯誤的，幾乎都是對造律師或法官。<\/span>\n                <span class=\"sv-src\">AI HALLUCINATION CASES DATABASE · D. CHARLOTIN · 截至 2026-10-23<\/span>\n            <\/div>\n        <\/div>\n        <div class=\"sv-two\" data-sv-grow>\n            <div class=\"sv-panel\">\n                <div class=\"sv-eb\">fig.2 · 不信任，但沒有每次檢查<\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>不完全信任 AI 產出<\/span><b>96%<\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:96%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>每次提交前都檢查<\/span><b>48%<\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <span class=\"sv-gapq\">中間這 48 個百分點，靠什麼決定能交出去？<\/span>\n                <span class=\"sv-src\">SONAR 2026 · 1,100+ 位開發者 · 廠商調查<\/span>\n            <\/div>\n            <div class=\"sv-panel sv-scale\">\n                <div class=\"sv-eb\">fig.3 · 被發現之後的代價<\/div>\n                <svg viewBox=\"0 0 540 150\" role=\"img\" aria-label=\"金額對數尺：航空客服 CA$812、律師書狀 US$5,000、顧問報告退款 AU$97,000、AI 不實宣稱 US$400,000、壽險換系統 NT$3,000 萬、銀行系統遷移 £48.65M\">\n                    <line x1=\"20\" y1=\"80\" x2=\"520\" y2=\"80\" class=\"ax\"/>\n                    <g class=\"tick\" text-anchor=\"middle\">\n                        <text x=\"20\" y=\"98\">$100<\/text><text x=\"103\" y=\"98\">$1K<\/text><text x=\"187\" y=\"98\">$10K<\/text><text x=\"270\" y=\"98\">$100K<\/text><text x=\"353\" y=\"98\">$1M<\/text><text x=\"437\" y=\"98\">$10M<\/text><text x=\"520\" y=\"98\">$100M<\/text>\n                    <\/g>\n                    <g class=\"lab\">\n                        <g class=\"pt\" style=\"transition-delay:.1s\"><circle cx=\"84\" cy=\"80\" r=\"4.5\"/><text x=\"84\" y=\"62\" text-anchor=\"middle\">航空客服<\/text><text x=\"84\" y=\"50\" text-anchor=\"middle\" class=\"amt\">CA$812<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.35s\"><circle cx=\"161\" cy=\"80\" r=\"4.5\"/><text x=\"161\" y=\"118\" text-anchor=\"middle\">律師書狀<\/text><text x=\"161\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$5K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.6s\"><circle cx=\"252\" cy=\"80\" r=\"4.5\"/><text x=\"244\" y=\"62\" text-anchor=\"middle\">顧問報告退款<\/text><text x=\"244\" y=\"50\" text-anchor=\"middle\" class=\"amt\">AU$97K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:.85s\"><circle cx=\"320\" cy=\"80\" r=\"4.5\"/><text x=\"316\" y=\"118\" text-anchor=\"middle\">AI 不實宣稱<\/text><text x=\"316\" y=\"131\" text-anchor=\"middle\" class=\"amt\">US$400K<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.1s\"><circle cx=\"350\" cy=\"80\" r=\"5.5\"/><line x1=\"352\" y1=\"74\" x2=\"368\" y2=\"36\" class=\"lead\"/><text x=\"372\" y=\"30\" text-anchor=\"middle\">壽險換系統<\/text><text x=\"372\" y=\"18\" text-anchor=\"middle\" class=\"amt\">NT$3,000 萬<\/text><\/g>\n                        <g class=\"pt\" style=\"transition-delay:1.35s\"><circle cx=\"500\" cy=\"80\" r=\"7\" class=\"big\"/><text x=\"506\" y=\"62\" text-anchor=\"end\">銀行系統遷移<\/text><text x=\"506\" y=\"50\" text-anchor=\"end\" class=\"amt\">£48.65M<\/text><\/g>\n                    <\/g>\n                <\/svg>\n                <span class=\"sv-src\">罰款、判賠或退款，約略換算美元後放在同一把對數尺上<\/span>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- four stills ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">fig.4 · 四件真實的事<\/div>\n        <div class=\"sv-reel\">\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/court.mp4\" poster=\"backend/src/main/resources/static/media/court.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"夜裡的律師桌，書狀的引用被紅筆圈起\"><\/video>\n                <figcaption><span class=\"d\">2023-06-22 · 紐約聯邦法院<\/span><b>律師用 AI 寫書狀，交出 6 個不存在的判例<\/b><span class=\"amt\">罰 US$5,000<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/chat.mp4\" poster=\"backend/src/main/resources/static/media/chat.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"機場桌上的手機開著客服對話\"><\/video>\n                <figcaption><span class=\"d\">2024-02-14 · 加拿大<\/span><b>航空公司的客服機器人講錯退款規則，公司要負責<\/b><span class=\"amt\">判賠 CA$812<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/review.mp4\" poster=\"backend/src/main/resources/static/media/review.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"深夜看著螢幕審程式的工程師\"><\/video>\n                <figcaption><span class=\"d\">2025 · STACK OVERFLOW 開發者調查<\/span><b>66% 遇過「幾乎對，但不完全對」的 AI 答案<\/b><span class=\"amt\">31,476 人回答<\/span><\/figcaption><\/figure>\n            <figure class=\"sv-still\"><video src=\"backend/src/main/resources/static/media/server.mp4\" poster=\"backend/src/main/resources/static/media/server.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"老舊機房裡用手電筒看系統文件\"><\/video>\n                <figcaption><span class=\"d\">2019-09 · 台灣<\/span><b>壽險公司換核心系統，15.2 萬張保單出問題<\/b><span class=\"amt\">罰 NT$3,000 萬<\/span><\/figcaption><\/figure>\n        <\/div>\n        <div class=\"sv-note\">照片為示意畫面，由 AI 生成，不是事件現場。<\/div>\n    <\/section>\n\n    <!-- ---- choose one ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-choose\">\n        <div class=\"sv-eb\">STEP 01 · 先選一種<\/div>\n        <h2 class=\"sv-h2\">您最近一次遇到的，是哪一種？<\/h2>\n        <div class=\"sv-choose\" role=\"group\" aria-label=\"選一種經驗\">\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"verify\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_desk.mp4\" poster=\"backend/src/main/resources/static/media/bp_desk.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"藍圖：審查桌上的清單有一格空著\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-A<\/span><span class=\"st\">選這個<\/span><\/span><b>確認 AI 產出能不能用<\/b><span class=\"s\">程式碼、報告、客服回覆、代理說的「已完成」<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"explain\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_chain.mp4\" poster=\"backend/src/main/resources/static/media/bp_chain.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"藍圖：證據鏈中間一環裂開\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-B<\/span><span class=\"st\">選這個<\/span><\/span><b>被問「這是怎麼來的」<\/b><span class=\"s\">主管、客戶、稽核、主管機關要您說明<\/span><\/span>\n            <\/button>\n            <button class=\"sv-opt\" type=\"button\" data-sv-pick=\"inventory\" aria-pressed=\"false\">\n                <span class=\"sv-opt__img\"><video src=\"backend/src/main/resources/static/media/bp_mainframe.mp4\" poster=\"backend/src/main/resources/static/media/bp_mainframe.jpg\" muted loop playsinline preload=\"none\" data-sv-play aria-label=\"藍圖：舊主機拆解圖\"><\/video><\/span>\n                <span class=\"sv-opt__tx\"><span class=\"n\"><span>DWG-C<\/span><span class=\"st\">選這個<\/span><\/span><b>弄清楚舊系統在做什麼<\/b><span class=\"s\">接手、換系統、文件跟實際對不上<\/span><\/span>\n            <\/button>\n        <\/div>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"other\">都不是這三種？<u>寫下您遇到的<\/u> →<\/button>\n        <button class=\"sv-none\" type=\"button\" data-sv-pick=\"none\">都沒遇過？<u>也請告訴我們，只有一題<\/u> →<\/button>\n        <div class=\"sv-deal\">\n            <div><span class=\"k\">TIME<\/span><b>約 7 分鐘<\/b><span>可以只寫幾句<\/span><\/div>\n            <div><span class=\"k\">PRIVACY<\/span><b>不公開<\/b><span>名字與公司只有我們看得到<\/span><\/div>\n            <div><span class=\"k\">YOU GET<\/span><b>彙整報告<\/b><span>寄到您留的聯絡方式<\/span><\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- the form ---- -->\n    <section class=\"sv-section sv-section--flush\" id=\"sv-form\">\n        <div class=\"sv-formwrap\">\n            <nav class=\"sv-toc\" aria-label=\"表單段落\" data-sv-toc>\n                <a href=\"#sv-p1\"><span>01<\/span>關於您<\/a>\n                <a href=\"#sv-p2\"><span>02<\/span>最近一次<\/a>\n                <a href=\"#sv-p3\" data-branch-link=\"story\"><span>03<\/span>花了多少<\/a>\n                <a href=\"#sv-p4\" data-branch-link=\"story\"><span>04<\/span>試過的做法<\/a>\n                <a href=\"#sv-p5\"><span>05<\/span>後續<\/a>\n                <a href=\"#sv-p6\"><span>06<\/span>聯絡方式<\/a>\n            <\/nav>\n\n        <form class=\"qf-survey sv-form\" method=\"post\" action=\"/survey\" data-survey-form novalidate>\n\n            <!-- ---- about you ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p1\">// 01 · 關於您<\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">您的角色最接近哪一個？<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程師\" id=\"role1\" name=\"role\">工程師<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"工程主管或技術主管\" id=\"role2\" name=\"role\">工程主管或技術主管<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"法遵或法務\" id=\"role3\" name=\"role\">法遵或法務<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"內部稽核或風險管理\" id=\"role4\" name=\"role\">內部稽核或風險管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"資訊或 IT 管理\" id=\"role5\" name=\"role\">資訊或 IT 管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"產品或專案管理\" id=\"role6\" name=\"role\">產品或專案管理<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"其他\" id=\"role7\" name=\"role\">其他<\/label>\n                <\/div>\n                <div class=\"qf-survey__other\" data-show-if=\"role=其他\">\n                    <input id=\"sf-role-other\" type=\"text\" maxlength=\"64\" placeholder=\"請寫您的角色\" name=\"roleOther\" value=\"\">\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一個角色。<\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">您所在組織的規模？<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1–10 人\" id=\"orgSize1\" name=\"orgSize\">1–10 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"11–50 人\" id=\"orgSize2\" name=\"orgSize\">11–50 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"51–200 人\" id=\"orgSize3\" name=\"orgSize\">51–200 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"201–1000 人\" id=\"orgSize4\" name=\"orgSize\">201–1000 人<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"1000 人以上\" id=\"orgSize5\" name=\"orgSize\">1000 人以上<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一個規模。<\/div>\n            <\/div>\n\n            <!-- ---- the last time ---- -->\n            <div class=\"sv-part\" id=\"sv-p2\">\n                <img data-sv-part-img src=\"backend/src/main/resources/static/media/bp_desk.jpg\" alt=\"\">\n                <div><span class=\"k\" data-sv-part-k>// 02 · 最近一次<\/span><b data-sv-part-title>最近一次，您需要處理的那一件事<\/b><\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <div class=\"qf-field__q\">最近一次您（或您的團隊）需要做下面哪一件事？選最近發生的那一件。<span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-choices qf-choices--stack\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"verify\" id=\"situation1\" name=\"situation\">確認 AI 產出的內容（程式碼、文件、回答）是否正確<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"explain\" id=\"situation2\" name=\"situation\">回應別人對「我們怎麼用 AI」的詢問或要求（主管、客戶、稽核、主管機關）<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"inventory\" id=\"situation3\" name=\"situation\">盤點舊系統、舊程式裡有什麼、誰在用、還能不能動<\/label>\n                    <label class=\"qf-choice qf-choice--other\"><input type=\"radio\" value=\"other\" id=\"situation4\" name=\"situation\">其他<input type=\"text\" class=\"qf-choice__text\" maxlength=\"200\" placeholder=\"寫下是什麼事\" aria-label=\"其他：寫下是什麼事\" data-other-text id=\"situationOther\" name=\"situationOther\" value=\"\"><\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"situation5\" name=\"situation\">以上都沒發生過<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請選一項；選「其他」的話，請寫下是什麼事。<\/div>\n            <\/div>\n\n            <div data-branch=\"story\">\n                <div class=\"qf-field\" data-required>\n                    <div class=\"qf-field__q\">那一次大約是什麼時候？<span class=\"qf-field__req\">必填<\/span><\/div>\n                    <div class=\"qf-field__hint\">想不起來的話，可以從最近一次交報告、上線、稽核或客戶詢問往回想。<\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一週內\" id=\"occurredWhen1\" name=\"occurredWhen\">過去一週內<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"過去一個月內\" id=\"occurredWhen2\" name=\"occurredWhen\">過去一個月內<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"一到六個月前\" id=\"occurredWhen3\" name=\"occurredWhen\">一到六個月前<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"超過半年前\" id=\"occurredWhen4\" name=\"occurredWhen\">超過半年前<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; 請選一個時間。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-what\">那一次發生了什麼事？是什麼讓您覺得一定要處理，而不是直接放著或直接用？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"sv-why\">我們想知道「決定要確認」的那一刻。目前公開的調查都沒有問過這件事。<\/div>\n                    <textarea id=\"sf-what\" rows=\"6\" maxlength=\"2000\" data-sv-count-text name=\"whatHappened\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-steps\">從開始處理到您覺得可以放心交出去，中間做了哪些步驟？誰參與？用了什麼工具或文件？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"sv-why\">「怎麼確認」的步驟，就是我們最想了解的部分。照順序寫幾步就好。<\/div>\n                    <textarea id=\"sf-steps\" rows=\"6\" maxlength=\"2000\" data-sv-count-text placeholder=\"例如：先對原始檔、再請同事看一遍、最後跟去年的報告比\" name=\"steps\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-outcome\">最後結果如何？有沒有漏掉什麼，後來才發現？<\/label>\n                    <textarea id=\"sf-outcome\" rows=\"4\" maxlength=\"2000\" name=\"outcome\"><\/textarea>\n                <\/div>\n\n                <!-- ---- cost ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p3\">// 03 · 花了多少<\/div>\n\n                <div class=\"qf-field\">\n                    <div class=\"qf-field__q\">大概花了多少時間？<\/div>\n                    <div class=\"sv-why\">覆核要花多少工時。大概就好。<\/div>\n                    <div class=\"qf-inline\">\n                        <input id=\"sf-hours\" type=\"text\" inputmode=\"decimal\" maxlength=\"16\" name=\"hours\" value=\"\">小時，\n                        <input id=\"sf-people\" type=\"text\" inputmode=\"numeric\" maxlength=\"16\" name=\"people\" value=\"\">個人參與\n                    <\/div>\n                <\/div>\n\n                <div class=\"qf-field\" data-amounts>\n                    <div class=\"qf-field__q\">有沒有因此另外花錢（工具、外包、顧問、加班費）？<\/div>\n                    <div class=\"qf-inline\">\n                        <span class=\"qf-inline__group\">US$ <input id=\"sf-extra-usd\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" aria-label=\"另外花的錢（美金）\" data-amount name=\"extraSpendUsd\" value=\"\"><\/span>\n                    <\/div>\n                    <div class=\"qf-choices\">\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"extraSpend1\" name=\"extraSpend\">沒有<\/label>\n                        <label class=\"qf-choice\"><input type=\"radio\" value=\"unknown\" id=\"extraSpend2\" name=\"extraSpend\">不知道<\/label>\n                    <\/div>\n                    <div class=\"qf-field__err\">&gt; 金額只能填數字（不加幣別），例如 500 或 1,200.5。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-worst\">如果那次沒有處理，最壞可能發生什麼事？<\/label>\n                    <textarea id=\"sf-worst\" rows=\"4\" maxlength=\"2000\" name=\"worstCase\"><\/textarea>\n                <\/div>\n\n                <!-- ---- what you tried ---- -->\n                <div class=\"qf-survey__part\" id=\"sv-p4\">// 04 · 試過的做法<\/div>\n\n                <div class=\"qf-field\" data-required>\n                    <label for=\"sf-tried\">您有沒有找過或試過其他做法、工具或服務？試了什麼？為什麼繼續用，或為什麼不用了？<span class=\"qf-field__req\">必填<\/span><\/label>\n                    <div class=\"qf-field__hint\">如果沒有找過，也請寫「沒有」，可以的話說說為什麼。<\/div>\n                    <textarea id=\"sf-tried\" rows=\"5\" maxlength=\"2000\" data-sv-count-text name=\"triedOther\"><\/textarea>\n                    <div class=\"sv-cnt\"><\/div>\n                    <div class=\"qf-field__err\">&gt; 這題必填。<\/div>\n                <\/div>\n\n                <div class=\"qf-field\">\n                    <label for=\"sf-hardest\">回想那一次，哪一個步驟最花時間或最讓您不放心？如果那一步可以變得不一樣，您希望它變成什麼樣子？<\/label>\n                    <textarea id=\"sf-hardest\" rows=\"5\" maxlength=\"2000\" name=\"hardestStep\"><\/textarea>\n                <\/div>\n            <\/div>\n\n            <div data-branch=\"none\">\n                <div class=\"qf-field\">\n                    <label for=\"sf-why-not\">您的工作裡有用到 AI 工具嗎？如果有，為什麼不需要確認它的產出？<\/label>\n                    <textarea id=\"sf-why-not\" rows=\"5\" maxlength=\"2000\" name=\"whyNotNeeded\"><\/textarea>\n                <\/div>\n            <\/div>\n\n            <!-- ---- follow-up ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p5\">// 05 · 後續<\/div>\n\n            <div class=\"qf-field\" data-required data-amounts>\n                <div class=\"qf-field__q\"><span data-show-if=\"situation!=none\">為了解決上述問題，您的組織每年願意付多少？<\/span><span data-show-if=\"situation=none\" hidden>如果之後需要確認 AI 產出的內容、回應別人對 AI 使用的詢問，或盤點舊系統，您的組織每年願意付多少？<\/span><span class=\"qf-field__req\">必填<\/span><\/div>\n                <div class=\"qf-field__hint\">如果是固定金額，兩格填一樣。<\/div>\n                <div class=\"qf-inline\">\n                    <span class=\"qf-inline__group\">每年 US$<input id=\"sf-pay-min\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" placeholder=\"最低\" aria-label=\"每年最低金額（美金）\" data-amount name=\"payMin\" value=\"\"><\/span>\n                    <span class=\"qf-inline__group\">到 US$<input id=\"sf-pay-max\" type=\"text\" inputmode=\"decimal\" maxlength=\"24\" placeholder=\"最高\" aria-label=\"每年最高金額（美金）\" data-amount name=\"payMax\" value=\"\"><\/span>\n                <\/div>\n                <div class=\"qf-choices\">\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"none\" id=\"payOption1\" name=\"payOption\">不會付費<\/label>\n                    <label class=\"qf-choice\"><input type=\"radio\" value=\"unknown\" id=\"payOption2\" name=\"payOption\">不知道<\/label>\n                <\/div>\n                <div class=\"qf-field__err\">&gt; 請填金額範圍，或選「不會付費」「不知道」。<\/div>\n            <\/div>\n\n            <div class=\"qf-field\">\n                <label for=\"sf-message\">有什麼是您想告訴我們的<\/label>\n                <textarea id=\"sf-message\" rows=\"4\" maxlength=\"2000\" name=\"message\"><\/textarea>\n            <\/div>\n\n            <!-- ---- contact ---- -->\n            <div class=\"qf-survey__part\" id=\"sv-p6\">// 06 · 聯絡方式<\/div>\n\n            <div class=\"sv-priv\">\n                <div><b>您的資料<\/b>不公開、不轉給第三方。<\/div>\n            <\/div>\n\n            <div class=\"qf-field\" data-required>\n                <label for=\"sf-name\">名字<span class=\"qf-field__req\">必填<\/span><\/label>\n                <input id=\"sf-name\" type=\"text\" maxlength=\"64\" name=\"name\" value=\"\">\n                <div class=\"qf-field__err\">&gt; 請留下名字。<\/div>\n            <\/div>\n            <div class=\"qf-field\" data-required>\n                <label for=\"sf-company\">公司<span class=\"qf-field__req\">必填<\/span><\/label>\n                <input id=\"sf-company\" type=\"text\" maxlength=\"128\" name=\"company\" value=\"\">\n                <div class=\"qf-field__err\">&gt; 請留下公司名稱。<\/div>\n            <\/div>\n            <div class=\"qf-field\" data-required>\n                <label for=\"sf-contact\">Email 或電話<span class=\"qf-field__req\">必填<\/span><\/label>\n                <input id=\"sf-contact\" type=\"text\" maxlength=\"128\" data-contact name=\"contact\" value=\"\">\n                <div class=\"qf-field__err\">&gt; 請填一個 Email 或電話號碼。<\/div>\n            <\/div>\n\n            <button type=\"submit\" class=\"qf-btn qf-btn--primary\">送出 <span class=\"arr\">→<\/span><\/button>\n\n            <div class=\"qf-form-status\"\n                 data-form-status><\/div>\n        <\/form>\n        <\/div>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}}</script>
<script>
(function () {
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var frame = document.getElementById('page');
  function show() {
    var route = location.hash.slice(1).split('?')[0] || '/about';
    var page = pages[route] || pages['/about'];
    frame.srcdoc = page.html;
    document.title = page.title + ' — Preview';
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.previewRoute) location.hash = e.data.previewRoute;
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
