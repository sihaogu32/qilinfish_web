.org/abs/2405.20362\" rel=\"noopener\" target=\"_blank\">https://arxiv.org/abs/2405.20362<\/a> （PDF <a href=\"https://arxiv.org/pdf/2405.20362\" rel=\"noopener\" target=\"_blank\">https://arxiv.org/pdf/2405.20362<\/a> ）<\/p>\n<\/section><\/template><template data-ev-src=\"E73\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Vectara<\/b><span>Hallucination Leaderboard<\/span><time>README 標 &quot;Last updated on October 22, 2026&quot;<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;To build this leaderboard, fed the full set of documents in the dataset to each of the LLMs and asked them to summarize each document, using only the facts presented in the document. We then computed the overall factual consistency rate (no hallucinations) and hallucination rate (100 - accuracy) for each model.&quot;<\/p><p class=\"ev-tr\">把資料集全部文件交給每個模型，要求只用文中事實寫摘要，再計算事實一致率與幻覺率（100 減一致率）。（原文句首缺主詞，照抄。）<\/p><p class=\"ev-line\">&quot;This leaderboard uses HHEM-2.3, Vectara&#39;s commercial hallucination evaluation model, to compute the LLM rankings.&quot;<\/p><p class=\"ev-tr\">排行榜用 Vectara 的商用幻覺評估模型 HHEM-2.3 計算排名。<\/p><p class=\"ev-line\">Dataset：&quot;Not publicly available to avoid overfitting by any LLM&quot;；&quot;Contains over 7700 articles from a variery of sources includeing: news, technology, science, medicine, legal, sports, sports, business and education.&quot;<\/p><p class=\"ev-tr\">資料集不公開，以免模型過度擬合；含 7,700 多篇文章。（拼字照抄。）<\/p><p class=\"ev-line\">&quot;Determining hallucinations is impossible to do for any ad hoc question as it&#39;s not known precisely what data every LLM is trained on.&quot;<\/p><p class=\"ev-tr\">對任意臨時問題判定幻覺做不到，因為不知道每個模型確切用什麼資料訓練。<\/p><p class=\"ev-line\">表格列（2026-10-22 版，欄位：Model｜Hallucination Rate｜Factual Consistency Rate｜Answer Rate｜Average Summary Length）：&quot;|antgroup/finix_s1_32b|1.8 %|98.2 %|99.5 %|172.4|&quot;（第一列，也是最低值）；&quot;|openai/gpt-5.4-nano-2026-03-17|3.1 %|96.9 %|100.0 %|144.4|&quot;；&quot;|google/gemini-2.5-pro|7.0 %|93.0 %|99.1 %|106.4|&quot;；&quot;|anthropic/claude-opus-4-6|12.2 %|87.8 %|99.8 %|137.6|&quot;<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">研究（廠商自己公布的測試數字，非同儕審查）。測的是有原文可對照的摘要任務的事實一致性，不是開放問答或研究任務。判定者是 Vectara 自家商用模型，不是人工。溫度 0（做不到時例外）；只計所有模型都有回答的文件。數字隨版本更新，引用要寫「2026-10-22 版」。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://github.com/vectara/hallucination-leaderboard\" rel=\"noopener\" target=\"_blank\">https://github.com/vectara/hallucination-leaderboard<\/a> （README 原文 <a href=\"https://raw.githubusercontent.com/vectara/hallucination-leaderboard/main/README.md\" rel=\"noopener\" target=\"_blank\">https://raw.githubusercontent.com/vectara/hallucination-leaderboard/main/README.md<\/a> ）<\/p>\n<\/section><\/template><template data-ev-src=\"E75\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>行政院主計總處（國勢普查處）<\/b><span>114年人力資源調查統計（Yearbook of Manpower Survey Statistics 2025）；表 15〈歷年就業者之從業身分〉<\/span><time>2026-03<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">表頭：「表１５　歷年就業者之從業身分 | TABLE 15. EMPLOYED PERSONS BY CLASS OF WORKER, 1978 TO DATE」「單位：千人」<\/p><p class=\"ev-line\">「１１４年平均 Ave., 2025 | 11626 | 6366 | 5260 | 470 | 367 | 103 | 1270 | 888 | 381 | …」（總計 11,626；雇主 470；自營作業者 1,270，男 888、女 381；單位千人）<\/p><p class=\"ev-line\">百分比列：「１１４年平均 Ave., 2025 | 100 | 54.76 | 45.24 | 4.05 | 3.16 | 0.89 | 10.92 | 7.64 | 3.28 | …」（雇主 4.05%；自營作業者 10.92%）<\/p><p class=\"ev-line\">抽樣：&quot;Approximately 550 TSUN/LIs and 21,000 households (about 55,000 people) were drawn in the first stage and second stage of sampling&quot;<\/p><p class=\"ev-tr\">兩階段抽樣，約 550 個村里、21,000 戶（約 55,000 人）；派員面訪或電話訪問。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">依查核修正：「114 年平均就業者 1,162.6 萬人；自營作業者 127.0 萬人，占 10.92%；雇主 47.0 萬人，占 4.05%。」母體是全體就業者；自營作業者涵蓋所有行業（含農業、攤販），不等於知識型接案者或顧問；年報沒有「接案者」「一人公司」分類。名詞定義的中文原句未逐字核對，不引用。台灣官方統計。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">發布頁 <a href=\"https://www.stat.gov.tw/News_Content.aspx?n=4001&amp;s=236078\" rel=\"noopener\" target=\"_blank\">https://www.stat.gov.tw/News_Content.aspx?n=4001&amp;s=236078<\/a> ；年報 PDF <a href=\"https://ws.dgbas.gov.tw/001/Upload/463/relfile/11516/236078/f194afc4-ad75-46bf-aa65-02239bdfdf8d.pdf\" rel=\"noopener\" target=\"_blank\">https://ws.dgbas.gov.tw/001/Upload/463/relfile/11516/236078/f194afc4-ad75-46bf-aa65-02239bdfdf8d.pdf<\/a> ；表 15 Excel <a href=\"https://ws.dgbas.gov.tw/001/Upload/463/relfile/11516/236078/table15.xlsx\" rel=\"noopener\" target=\"_blank\">https://ws.dgbas.gov.tw/001/Upload/463/relfile/11516/236078/table15.xlsx<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E80\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>經濟部智慧財產局（著作權主題網，解釋資料檢索）<\/b><span>電子郵件1140522c<\/span><time>2025-05-22（更新 2025-07-02）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">提問：「所詢利用ChatGPT輸入指令後生成的圖畫是否享有著作權」<\/p><p class=\"ev-line\">「著作必須係以自然人或法人為權利義務主體的情形下，由自然人所為的創作，方可能受到著作權的保護。」「故AI生成之圖畫是否享有著作權，應視創作過程中有無人類實際的創意投入而定」<\/p><p class=\"ev-line\">「若只是把AI當作輔助工具(例如:繪圖軟體)來使用，而有人類實際的創意投入，則完成的創作成果仍可受著作權保護」「該圖畫之著作權歸屬，除有著作權法第11條(僱傭關係)及第12條(出資聘用關係)之情形外，原則上由該實際創作之人(即投入實際創意的自然人)享有。」<\/p><p class=\"ev-line\">「(二)反之，若創作過程中完全是由AI的演算功能獨立進行完成」「並無人類精神文明之投入，則該AI生成的圖畫無法享有著作權。」<\/p><p class=\"ev-line\">「可一併參考本局電子郵件1111031、電子郵件1120317之說明。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">對單一民眾提問的電子郵件回覆，不是法規命令，對法院沒有拘束力。問的是「圖畫」，沒有直接回答文字或報告類成果。台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.tipo.gov.tw/tw/copyright/692-34252.html\" rel=\"noopener\" target=\"_blank\">https://www.tipo.gov.tw/tw/copyright/692-34252.html<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E81\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>經濟部智慧財產局（著作權主題網，解釋資料檢索）<\/b><span>電子郵件1140522c<\/span><time>2025-05-22（更新 2025-07-02）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">「為避免產生著作權糾紛，建議先向AI模型之開發或管理者釐清有無取得著作財產權人之授權及得否轉授權第三人商業利用」「並應遵循生成式AI提供者所訂定之使用規範。」<\/p><p class=\"ev-line\">「由於著作權係屬私權，個案中利用AI生成之圖畫是否受著作權保護？是否侵害他人著作權？如有爭議」「仍應由司法機關就個案具體事實調查證據認定之。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">對單一民眾提問的電子郵件回覆，不是法規命令，對法院沒有拘束力。問的是「圖畫」，沒有直接回答文字或報告類成果。台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.tipo.gov.tw/tw/copyright/692-34252.html\" rel=\"noopener\" target=\"_blank\">https://www.tipo.gov.tw/tw/copyright/692-34252.html<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E82\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>法務部全國法規資料庫<\/b><span>著作權法 第 12 條<\/span><time>頁面最新修正紀錄為 111 年 5 月 4 日（第 12 條不在其中）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 1 項：「出資聘請他人完成之著作，除前條情形外，以該受聘人為著作人。但契約約定以出資人為著作人者，從其約定。」<\/p><p class=\"ev-line\">第 2 項：「依前項規定，以受聘人為著作人者，其著作財產權依契約約定歸受聘人或出資人享有。未約定著作財產權之歸屬者，其著作財產權歸受聘人享有。」<\/p><p class=\"ev-line\">第 3 項：「依前項規定著作財產權歸受聘人享有者，出資人得利用該著作。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">法律，台灣。法條沒有提到 AI。只處理「有著作權」的成果歸屬；依 E80，AI 獨立生成、沒有人類創意投入的部分原則上沒有著作權可歸屬。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=J0070017&amp;flno=12\" rel=\"noopener\" target=\"_blank\">https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=J0070017&amp;flno=12<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E83\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>益思科技法律事務所 賴文智律師（講義檔放在經濟部智慧財產局網站）<\/b><span>AI人工智慧相關著作權議題<\/span><time>2025-10-30<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 17 頁：「若使用生成式AI自行生成，請保留使用的紀錄，以降低被認定故意侵權的風險」<\/p><p class=\"ev-line\">第 15 頁（標題「智慧財產局電子郵件1111031」）：「(二)第二種是「人工智慧獨立創作」，也就是人類並無實際的創意投入，完全是由AI的演算功能獨立進行完成創作，此時由於AI並非自然人，沒有人類精神文明的投入，其創作完成成果自然不屬於著作權法保護的著作，原則上無法享有著作權。」<\/p><p class=\"ev-line\">第 13 頁：「如何證明是人類的創作成果？」（列為問題）<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">律師個人講義，不是智慧局函釋或官方立場；引用要寫講者名字。第 17 頁「保留紀錄」的上下文是圖片生成與侵權風險。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.tipo.gov.tw/wSite/public/Attachment/006/f1762389262199.pdf\" rel=\"noopener\" target=\"_blank\">https://www.tipo.gov.tw/wSite/public/Attachment/006/f1762389262199.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E84\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>益思科技法律事務所 賴文智律師（講義檔放在經濟部智慧財產局網站）<\/b><span>AI人工智慧相關著作權議題<\/span><time>2025-10-30<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 36 頁：「使用生成式AI，還是由使用者負實體世界的法律責任」「對外利用前也須再次檢視」<\/p><p class=\"ev-line\">第 43 頁：「應用生成式AI生成的成果做出適當的標示，讓使用者有機會評估是否信任或使用」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">律師個人講義，不是智慧局函釋或官方立場；引用要寫講者名字。第 17 頁「保留紀錄」的上下文是圖片生成與侵權風險。第 43 頁「適當的標示」列在「如何降低生成式AI應用的著作權風險」，對象寫的是企業。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.tipo.gov.tw/wSite/public/Attachment/006/f1762389262199.pdf\" rel=\"noopener\" target=\"_blank\">https://www.tipo.gov.tw/wSite/public/Attachment/006/f1762389262199.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E88\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>金融監督管理委員會<\/b><span>金融業運用人工智慧(AI)指引<\/span><time>2024-06-20<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">「以生成式 AI 之運用為例，在無適當管控機制下，金融機構人員不得向生成式 AI 提供未經客戶同意提供之資訊。前稱適當管控機制，例如採用封閉型部署之生成式 AI 模型、確認系統環境安全性等。如不涉及個人資料、無法直接或間接辨識特定個人之客戶行為者，則不在此限。」<\/p><p class=\"ev-line\">新聞稿：「本指引主要提供金融業者於導入及使用AI 時可注意的事項，是屬於行政指導性質。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">適用對象是金融業者；性質是行政指導。條文有但書（不涉個資者不在此限）。不直接拘束接案者；「金融業客戶會帶進委外契約」未驗證，不可寫成事實。到 2026-10-26 查不到修訂。引句沿用既有查核檔，本輪未重開。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞稿 <a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News<\/a> ；指引 PDF 見 content/articles/shadow-ai/verified/verified-taiwan.md 第 6 節<\/p>\n<\/section><\/template><template data-ev-src=\"E89\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>台灣微軟（微軟＋LinkedIn《2024 工作趨勢指數》）<\/b><span>2024 工作趨勢指數台灣版新聞稿<\/span><time>2024-06-20<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">「台灣有高達 84% 的知識型工作者積極使用生成式 AI 輔助日常工作」<\/p><p class=\"ev-line\">「運用自身 AI 工具工作（BYOAI）的 AI 使用者將近八成，亦高於全球工作者比例」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">受訪者自述；台灣樣本數原文沒寫。全球方法：31,000 名全職受雇或自雇知識工作者，31 個市場，含台灣。依查核修正：母體是「全職受雇或自雇的知識工作者」。「近八成」的母體是「AI 使用者」，不是全體知識工作者。引句沿用既有查核檔，本輪未重開。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://news.microsoft.com/zh-tw/ms-wti-ai/\" rel=\"noopener\" target=\"_blank\">https://news.microsoft.com/zh-tw/ms-wti-ai/<\/a><\/p>\n<\/section><\/template>\n\n        \n        <div class=\"bl-prose\">\r\n\r\n            <aside class=\"bl-tldr\" data-reveal>\r\n                <span class=\"sv-eb\">TL;DR<\/span>\r\n                <ol>\r\n                    <li>多數受訪者希望被告知產品或服務用了 AI。但主動說了，信任會降一些；悄悄用、之後被別人發現，降得最多。<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup><sup class=\"cite\" data-e=\"E17 E18\"><a href=\"#r8\">[8]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/li>\r\n                    <li>人們排斥 AI 標籤，是因為以為內容「完全由 AI 寫、沒有人監督」。所以要說清楚的是：誰複核、怎麼驗證、誰負責。<sup class=\"cite\" data-e=\"E22\"><a href=\"#r11\">[11]<\/a><\/sup><sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/li>\r\n                    <li>一人公司交出去的東西，背後只有您一個人。這份說明要放進交付物裡。<\/li>\r\n                <\/ol>\r\n            <\/aside>\r\n\r\n            <p>在台灣，用 AI 工作已經很普遍。微軟 2024 年的調查指出，台灣 84% 的知識工作者在工作上使用生成式 AI；AI 使用者中將近八成自己帶 AI 工具上班。<sup class=\"cite\" data-e=\"E89\"><a href=\"#r1\">[1]<\/a><\/sup>這是受訪者自己說的。<\/p>\r\n            <p>一個人做事的人也不少。主計總處的統計，2025 年台灣的自營作業者平均有 127.0 萬人，占就業者的 10.92%。<sup class=\"cite\" data-e=\"E75\"><a href=\"#r2\">[2]<\/a><\/sup>這個數字包含農業與攤販，不等於接案者，但可以看出規模。<\/p>\r\n            <p>這篇寫給兩種讀者：用 AI 替客戶做事的您，和委託接案者、要為結果負責的您。兩邊遲早會遇到同一個問題：「這是怎麼來的？」<\/p>\r\n\r\n            <div class=\"qf-eyebrow\">01<\/div>\r\n            <h2 id=\"want\">客戶想知道您有沒有用 AI，而且期待您先開口<\/h2>\r\n            <p><strong>調查裡，多數人要求揭露 AI 的使用；企業客戶也希望外部事務所用 AI，但多半不知道對方有沒有用。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-1.jpg\" alt=\"綠色毛氈上一封還沒打開的信封\" loading=\"lazy\"><\/figure>\r\n            <p>Ipsos 2025 年在 30 個國家訪問了 23,216 人，平均 79% 同意「用 AI 的產品與服務應該要揭露這件事」。<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup>Salesforce 2024 年調查 18 國的 15,015 名消費者，近 75% 想知道自己是不是在跟 AI 代理溝通。<sup class=\"cite\" data-e=\"E12\"><a href=\"#r4\">[4]<\/a><\/sup>美國的 Pew 研究中心在 2025 年問了 5,023 名成人：<\/p>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.1 · 受訪者自己說的<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>能分辨內容是 AI 還是人做的，極為或非常重要<\/span><b>76<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:76%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>不太有或完全沒有信心分辨<\/span><b>53<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:53%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Pew Research Center 2025-09-17 · 美國成人 5,023 人 · 2025-06-09 至 06-15 · 只有美國<sup class=\"cite\" data-e=\"E15 E16\"><a href=\"#r5\">[5]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <p>企業客戶這一端，Thomson Reuters Institute 2025 年 10 到 11 月調查了 27 國 1,514 位法律、稅務、風險與政府法務的專業人員。報告指出，大多數企業部門希望外部事務所在案件上用 AI，但不到三分之一知道事務所有沒有在用。<sup class=\"cite\" data-e=\"E23\"><a href=\"#r6\">[6]<\/a><\/sup>約三分之二的企業受訪者認為事務所應該用 AI，但不到 20% 透過指引或招標文件提出要求。約四分之三的受訪者認為，應該由事務所主動開啟這個討論。<sup class=\"cite\" data-e=\"E24 E26\"><a href=\"#r7\">[7]<\/a><\/sup><\/p>\r\n            <p>報告引了一位美國企業法務長的話：「品質還是要檢查，人還是要為品質負責，就像資淺律師的工作要由資深的人仔細審一樣。但他們應該用。」（\"The quality still needs to be checked, and the human beings should still be responsible for the quality … But they should use it.\"）<sup class=\"cite\" data-e=\"E28\"><a href=\"#r7\">[7]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 1 · 揭露期待的調查<\/span>\r\n                <table>\r\n                    <thead><tr><th>調查<\/th><th>樣本<\/th><th>結果<\/th><th>台灣<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr><td>Ipsos AI Monitor 2025<\/td><td>30 國 23,216 人，2025-03 至 04<\/td><td>79% 同意用 AI 的產品與服務應該揭露<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Salesforce 2024<\/td><td>18 國 15,015 名消費者，2024-07 至 08<\/td><td>近 75% 想知道是不是在跟 AI 代理溝通<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Pew 2025<\/td><td>美國成人 5,023 人，2025-06<\/td><td>76% 認為能分辨很重要；53% 沒信心分辨<\/td><td>不在樣本內<\/td><\/tr>\r\n                        <tr><td>Thomson Reuters Institute 2026<\/td><td>27 國 1,514 位專業人員，2025-10 至 11<\/td><td>不到三分之一的企業部門知道事務所有沒有用 AI<\/td><td>報告沒有列出<\/td><\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">我們沒有找到含台灣樣本的同類調查。Salesforce 販售 AI 代理產品；Thomson Reuters 販售 AI 法律與稅務工具。<\/span>\r\n            <\/div>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.2 · 希望被告知用了 AI（各調查題目不同）<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Ipsos：用 AI 的產品與服務應該揭露（30 國平均）<\/span><b>79<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:79%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Pew：能分辨 AI 或人做的，極為或非常重要（美國）<\/span><b>76<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:76%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Salesforce：想知道是不是在跟 AI 代理溝通（18 國）<\/span><b>近 75<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:75%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Ipsos 2025-06-06 · 23,216 人 · Pew 2025-09-17 · 5,023 人 · Salesforce 2024-10-31 · 15,015 人 · 台灣都不在樣本內<sup class=\"cite\" data-e=\"E10\"><a href=\"#r3\">[3]<\/a><\/sup><sup class=\"cite\" data-e=\"E15\"><a href=\"#r5\">[5]<\/a><\/sup><sup class=\"cite\" data-e=\"E12\"><a href=\"#r4\">[4]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <div class=\"qf-eyebrow\">02<\/div>\r\n            <h2 id=\"penalty\">說了會掉分，藏起來被發現掉更多<\/h2>\r\n            <p><strong>揭露自己用 AI 有代價，但被第三方揭穿的代價更高。排斥的來源，是以為沒有人監督。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-2.jpg\" alt=\"用金色修補裂痕的黑色茶碗\" loading=\"lazy\"><\/figure>\r\n            <p>2025 年發表的一篇研究，用 13 個實驗、超過 5,000 名參與者測試同一件事。結果一致：揭露自己用 AI 的人，比不揭露的人被信任得少，不論揭露是自願還是被要求的。不過這個效果比被第三方揭露時弱。<sup class=\"cite\" data-e=\"E17\"><a href=\"#r8\">[8]<\/a><\/sup>作者寫道：「悄悄用 AI，若之後被別人發現，信任下降最多。」即使是懂科技的評估者，也比較不信任說自己用 AI 的人；參與者包括學生、法律分析師、招募主管、投資人。<sup class=\"cite\" data-e=\"E18 E19\"><a href=\"#r9\">[9]<\/a><\/sup><\/p>\r\n            <p>其他實驗也看到類似的結果。一項美國研究讓 1,276 名成人看虛構的家醫科廣告，提到用 AI 的醫師，在每一種 AI 條件下都被認為明顯較不稱職。<sup class=\"cite\" data-e=\"E20\"><a href=\"#r10\">[10]<\/a><\/sup>另一項美國與英國的研究發現，把新聞標題標為「AI 生成」，會降低讀者認為的準確度與分享意願，不論標題是真是假、由人還是 AI 寫的。<sup class=\"cite\" data-e=\"E21\"><a href=\"#r11\">[11]<\/a><\/sup><\/p>\r\n            <p>同一份研究也找到原因：「這種對 AI 的排斥，來自人們以為標了 AI 生成的標題是完全由 AI 寫、沒有人監督。」（\"entirely written by AI with no human supervision\"）研究者的結論是，標籤要有效，需要讓人清楚標籤的意思。<sup class=\"cite\" data-e=\"E22\"><a href=\"#r11\">[11]<\/a><\/sup><\/p>\r\n            <p>所以很多人選擇不說。KPMG 與墨爾本大學 2025 年的全球調查摘要指出，61% 的員工會避免透露自己在工作中用了 AI 工具。<sup class=\"cite\" data-e=\"E9\"><a href=\"#r12\">[12]<\/a><\/sup><\/p>\r\n            <p>這些都是實驗或調查，量的是評估者的態度，不是真實客戶的行為。樣本也都不含台灣。<\/p>\r\n\r\n            <div class=\"qf-eyebrow\">03<\/div>\r\n            <h2 id=\"who-pays\">出事時，客戶追究的是交出去的人<\/h2>\r\n            <p><strong>錯誤是 AI 產生的，但退費、道歉、終止合作，都落在交付的那一層。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><video src=\"content/articles/solo-trust/media/h2-3.mp4\" poster=\"content/articles/solo-trust/media/h2-3.jpg\" data-sv-play muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video><\/figure>\r\n\r\n            <h3>芝加哥太陽報：一份不存在的書單<\/h3>\r\n            <p>2025 年 5 月 18 日，美國《芝加哥太陽報》刊出一份夏季特刊。兩天後報社發表聲明：「那份書單是用 AI 工具做出來的，推薦了不存在的書」，而且「沒經我們編輯部審閱就放進報紙」。<sup class=\"cite\" data-e=\"E56\"><a href=\"#r13\">[13]<\/a><\/sup><\/p>\r\n            <p>特刊不是報社自己做的。聲明轉述內容供應商 King Features 的說法：King Features 與一名自由撰稿人合作，此人用 AI 代理協助做出這份特刊；King Features 正在終止與此人的合作。報社則決定這期付費版不向訂戶收費，電子版撤下特刊。<sup class=\"cite\" data-e=\"E57 E58\"><a href=\"#r13\">[13]<\/a><\/sup><\/p>\r\n            <p>報社事後查核全部 10 篇有具名來源的文章，每篇都有多處錯誤。推薦的 15 本書裡，10 本書名是假的，作者是真的。<sup class=\"cite\" data-e=\"E59\"><a href=\"#r14\">[14]<\/a><\/sup>執行長 Melissa Bell 寫了道歉文：「我沒有深入查這些特刊，很快就核准團隊沿用既有做法。」她認為 King 的團隊「很可能」沒做徹底的事實查核。之後第三方內容改由新成立的 Standards 團隊審閱，報社也不打算再用 King Features 的其他編輯特刊。<sup class=\"cite\" data-e=\"E60\"><a href=\"#r15\">[15]<\/a><\/sup><\/p>\r\n            <p>這條鏈是：自由撰稿人 → 內容供應商 → 報社 → 讀者。報社說特刊沒經編輯部審閱；執行長推測供應商很可能沒做徹底的查核。最後被終止合作的，是最前面那個撰稿人。<\/p>\r\n\r\n            <h3>澳洲：退回部分合約款<\/h3>\r\n            <p>據澳洲綠黨 2025 年 10 月 9 日的新聞稿，財政部在參議院預算聽證會上表示，Deloitte 只退了 97,587 澳元，不到 44 萬澳元合約的四分之一；財政部也承認，它是從媒體報導發現 Deloitte 的錯誤。<sup class=\"cite\" data-e=\"E52 E53\"><a href=\"#r16\">[16]<\/a><\/sup>這是綠黨的轉述，不是議事錄；新聞稿的標題稱這件事是「AI report bungle」。<\/p>\r\n\r\n            <h3>AI 會出錯，而且查核要花時間<\/h3>\r\n            <ul>\r\n                <li>Stanford 等研究者 2024 年測試主要的法律 AI 研究工具，各有 17% 到 33% 的時間會幻覺。測試用的是 200 多個刻意有難度的美國法律查詢。<sup class=\"cite\" data-e=\"E71\"><a href=\"#r18\">[18]<\/a><\/sup><\/li>\r\n                <li>同一份研究：回答正確且有依據的比例，三個工具分別是 65%、41%、19%。回答越長，查核越花時間，因為「每個命題和引用都要個別評估」。<sup class=\"cite\" data-e=\"E72\"><a href=\"#r18\">[18]<\/a><\/sup><\/li>\r\n                <li>Vectara 的摘要幻覺率排行榜（2026-10-22 版）：最低 1.8%，部分主流模型在 3.1% 到 12.2% 之間。測的是有原文可對照的摘要任務，由 Vectara 自家模型判定。<sup class=\"cite\" data-e=\"E73\"><a href=\"#r19\">[19]<\/a><\/sup><\/li>\r\n            <\/ul>\r\n\r\n            <figure class=\"bl-chart\" data-sv-grow data-reveal>\r\n                <figcaption class=\"sv-eb\">fig.3 · 法律 AI 研究工具：回答正確且有依據的比例<\/figcaption>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Lexis+ AI<\/span><b>65<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:65%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Westlaw AI-Assisted Research<\/span><b>41<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:41%\"><\/i><\/div><\/div>\r\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Ask Practical Law AI<\/span><b>19<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:19%\"><\/i><\/div><\/div>\r\n                <span class=\"sv-src\">Magesh 等 arXiv 預印本 2024-05-30 · 200 多個刻意有難度的美國法律查詢 · 2024-03 至 05 執行<sup class=\"cite\" data-e=\"E72 E71\"><a href=\"#r18\">[18]<\/a><\/sup><\/span>\r\n            <\/figure>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 2 · 出事之後<\/span>\r\n                <table>\r\n                    <thead><tr><th>事件<\/th><th>誰用了 AI<\/th><th>後果<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr><td>芝加哥太陽報夏季特刊（2025-05）<\/td><td>內容供應商合作的自由撰稿人<\/td><td>撰稿人被終止合作；報社不向訂戶收費、撤下電子版、執行長道歉<\/td><\/tr>\r\n                        <tr><td>Deloitte 澳洲合約（2025-10 揭露退款）<\/td><td>據綠黨新聞稿，問題出在 Deloitte 的報告<\/td><td>據綠黨新聞稿，退回 97,587 澳元<\/td><\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">來源：Chicago Sun-Times 2025-05-20、2025-05-29；Australian Greens 2025-10-09<\/span>\r\n            <\/div>\r\n\r\n            <div class=\"qf-eyebrow\">04<\/div>\r\n            <h2 id=\"checklist\">各地指引要求的，是同一張清單<\/h2>\r\n            <p><strong>律師、金融、公部門的指引寫法不同，但都要求說清楚：用了什麼、在哪一步、誰檢查、誰負責。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-4.jpg\" alt=\"拆開的錶芯零件依序排在黑布上\" loading=\"lazy\"><\/figure>\r\n            <p>新加坡律政部 2026 年 3 月發布的法律業生成式 AI 指南寫得最具體。它建議法律專業人員向客戶：<\/p>\r\n            <ul>\r\n                <li>說明怎麼用 GenAI，「例如用哪些工具、在工作流程的哪個階段、由誰用、產出怎麼驗證」（\"which tools are used, at what stage of the legal workflow, by whom, and how the output is verified\"）；<\/li>\r\n                <li>說明雖然可能使用 GenAI 工具，專業人員對工作成果保有全部責任；<\/li>\r\n                <li>提供客戶選擇，讓案件不使用 GenAI。<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/li>\r\n            <\/ul>\r\n            <p>同一份指南轉述新加坡最高法院的要求：法院使用者要準備好，在被問到時指出文件哪裡用了 GenAI，並說明產出怎麼驗證。<sup class=\"cite\" data-e=\"E36\"><a href=\"#r20\">[20]<\/a><\/sup>指南也附了委任書的範例條款：所有產出都經合格專業人員審閱；沒有必要防護與客戶事先同意，不把客戶敏感資訊交給外部 AI 系統。<sup class=\"cite\" data-e=\"E39\"><a href=\"#r20\">[20]<\/a><\/sup>指南自稱不具拘束力，但寫明使用 GenAI 不會轉移或減輕專業人員對成果的最終責任。<sup class=\"cite\" data-e=\"E34\"><a href=\"#r20\">[20]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"bl-table\" data-reveal>\r\n                <span class=\"sv-eb\">表 3 · 指引要客戶知道什麼、要留什麼紀錄<\/span>\r\n                <table>\r\n                    <thead><tr><th>指引<\/th><th>效力<\/th><th>告知與責任<\/th><th>紀錄與資料<\/th><\/tr><\/thead>\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>新加坡律政部 法律業 GenAI 指南（2026-03-06）<\/td>\r\n                            <td>自願指引<\/td>\r\n                            <td>說明工具、階段、使用者、驗證方式；保有全部責任；客戶可選不用<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/td>\r\n                            <td>未經同意，不把敏感資訊交給外部 AI（範例條款）<sup class=\"cite\" data-e=\"E39\"><a href=\"#r20\">[20]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>加州律師公會 生成式 AI 實務指引（2026-05-14 核准）<\/td>\r\n                            <td>職業倫理實務指引<\/td>\r\n                            <td>對 AI 協助產生的成果負全部責任，必須審閱、驗證、更正；必須考慮向客戶揭露，並遵守客戶限制 AI 的指示<sup class=\"cite\" data-e=\"E29 E31\"><a href=\"#r21\">[21]<\/a><\/sup><\/td>\r\n                            <td>未取得客戶知情同意，不得把機密資訊輸入有重大風險的生成式 AI<sup class=\"cite\" data-e=\"E30\"><a href=\"#r21\">[21]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>金管會 金融業運用 AI 指引（2024-06-20）<\/td>\r\n                            <td>行政指導（台灣）<\/td>\r\n                            <td>面對客戶時宜告知、尊重選擇、提醒替代方案；金融機構應對所用 AI 負責，生成式 AI 產出仍需人員管控<sup class=\"cite\" data-e=\"E43 E46\"><a href=\"#r22\">[22]<\/a><\/sup><\/td>\r\n                            <td>宜要求第三方業者留存作業紀錄；針對模型、資料及提示留下紀錄<sup class=\"cite\" data-e=\"E45\"><a href=\"#r22\">[22]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                        <tr>\r\n                            <td>加拿大 NL 省政府 AI 政策（2025-04-17）<\/td>\r\n                            <td>政府內部政策<\/td>\r\n                            <td>適用對象包括顧問與廠商；個人須為 AI 產出的正確性負責<sup class=\"cite\" data-e=\"E55\"><a href=\"#r17\">[17]<\/a><\/sup><\/td>\r\n                            <td>使用前必須由人驗證正確性<sup class=\"cite\" data-e=\"E55\"><a href=\"#r17\">[17]<\/a><\/sup><\/td>\r\n                        <\/tr>\r\n                    <\/tbody>\r\n                <\/table>\r\n                <span class=\"sv-src\">這些指引不直接管台灣的一人公司。表格只當清單參考。<\/span>\r\n            <\/div>\r\n\r\n            <p>金管會的指引有一點和一人公司直接相關。它的對象是金融機構，但寫明「金融機構宜要求第三方業者留存執行受託辦理事項之書面或數位作業紀錄」。<sup class=\"cite\" data-e=\"E45\"><a href=\"#r22\">[22]<\/a><\/sup>如果您的客戶是金融機構，您就是那個第三方。金管會也寫明，金融機構使用 AI 與消費者直接互動前，宜主動告知該服務是 AI 自動完成的。<sup class=\"cite\" data-e=\"E44\"><a href=\"#r22\">[22]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"qf-eyebrow\">05<\/div>\r\n            <h2 id=\"taiwan\">台灣目前：原則有了，細則還沒有<\/h2>\r\n            <p><strong>我們沒有找到要求台灣一人公司向客戶揭露 AI 使用的具體規定。契約與紀錄要自己補上。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-5.jpg\" alt=\"桌上的拼圖只拼好外框，中間空著\" loading=\"lazy\"><\/figure>\r\n\r\n            <h3>人工智慧基本法：政府的原則<\/h3>\r\n            <p>《人工智慧基本法》2026 年 1 月 14 日公布，同日施行。第 4 條寫：「人工智慧之產出應做適當資訊揭露或標記」，也要求「應確保承擔相應之責任」。<sup class=\"cite\" data-e=\"E48\"><a href=\"#r23\">[23]<\/a><\/sup>但這一條的主詞是「政府推動人工智慧之研發與應用」，是政府的施政原則，不是對個別業者的義務。全法沒有罰則。對民間的管理規範，要等各目的事業主管機關訂定；法律要求施行後二年內完成法規調整。<sup class=\"cite\" data-e=\"E48 E49\"><a href=\"#r23\">[23]<\/a><\/sup><\/p>\r\n\r\n            <h3>專業團體：還在進修階段<\/h3>\r\n            <p>全國律師聯合會 2026 年 4 月 18 日修正後的《律師倫理規範》，全文沒有出現「人工智慧」「生成式」「AI」字樣。<sup class=\"cite\" data-e=\"E40\"><a href=\"#r24\">[24]<\/a><\/sup>全聯會 2024 年 10 月通過了「人工智慧（AI）與法律」的進修課綱，但那是研習課程，不是行為規範。<sup class=\"cite\" data-e=\"E41\"><a href=\"#r25\">[25]<\/a><\/sup>我們沒有找到台灣律師團體正式發布的生成式 AI 使用指引。<\/p>\r\n\r\n            <h3>著作權：交付物歸誰，要寫進契約<\/h3>\r\n            <ul>\r\n                <li>智慧財產局的說明：AI 生成的成果是否享有著作權，「應視創作過程中有無人類實際的創意投入而定」；完全由 AI 獨立完成的，無法享有著作權。<sup class=\"cite\" data-e=\"E80\"><a href=\"#r26\">[26]<\/a><\/sup><\/li>\r\n                <li>智慧局也建議先釐清 AI 模型的授權、遵循 AI 提供者的使用規範；有爭議時由司法機關個案認定。<sup class=\"cite\" data-e=\"E81\"><a href=\"#r26\">[26]<\/a><\/sup><\/li>\r\n                <li>《著作權法》第 12 條：出資聘人完成的著作，沒有約定時，著作財產權「歸受聘人享有」，出資人得利用該著作。<sup class=\"cite\" data-e=\"E82\"><a href=\"#r27\">[27]<\/a><\/sup>也就是說，成果如果有著作權，又沒寫進契約，客戶付了錢，著作財產權仍歸您。<\/li>\r\n                <li>賴文智律師放在智慧局網站上的講義寫：「若使用生成式AI自行生成，請保留使用的紀錄」；「使用生成式AI，還是由使用者負實體世界的法律責任」，「對外利用前也須再次檢視」。<sup class=\"cite\" data-e=\"E83 E84\"><a href=\"#r28\">[28]<\/a><\/sup>這是講者的講義，不是智慧局的函釋。<\/li>\r\n            <\/ul>\r\n\r\n            <h3>客戶資料：能不能貼進 AI<\/h3>\r\n            <p>金管會的指引寫明：「在無適當管控機制下，金融機構人員不得向生成式 AI 提供未經客戶同意提供之資訊。」<sup class=\"cite\" data-e=\"E88\"><a href=\"#r22\">[22]<\/a><\/sup>這是對金融業的行政指導，不直接適用其他行業。<\/p>\r\n            <p>《個人資料保護法》2025 年 11 月 11 日修正公布，第 12 條要求個資外洩時通知當事人並保存紀錄。施行日期「由行政院定之」，目前還沒有定。條文沒有提到 AI。<sup class=\"cite\" data-e=\"E50\"><a href=\"#r29\">[29]<\/a><\/sup><\/p>\r\n\r\n            <div class=\"qf-eyebrow\">06<\/div>\r\n            <h2 id=\"deliver\">把「這是怎麼來的」做成交付物的一部分<\/h2>\r\n            <p><strong>可追溯讓客戶能檢查，但不保證正確。交付時，這兩件事要分開說。<\/strong><\/p>\r\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">示意畫面 · AI 生成<\/span><img src=\"content/articles/solo-trust/media/h2-6.jpg\" alt=\"標本抽屜裡的菊石化石，綁著空白吊牌\" loading=\"lazy\"><\/figure>\r\n            <p>美國國家標準暨技術研究院（NIST）的 AI 風險管理框架寫：「可信的 AI 取決於問責。問責以透明為前提。」（\"Trustworthy AI depends upon accountability. Accountability presupposes transparency.\"）同一份文件也寫：「透明的系統不一定是準確……的系統。」<sup class=\"cite\" data-e=\"E61\"><a href=\"#r30\">[30]<\/a><\/sup>內容來源標準 C2PA 也這樣說明自己：來源資訊能證明出處與歷史，「但光靠來源資訊，不能告訴你內容是否真實、正確或符合事實」。<sup class=\"cite\" data-e=\"E70\"><a href=\"#r34\">[34]<\/a><\/sup><\/p>\r\n            <p>NIST 的生成式 AI 指引，引用白宮 2022 年的定義，描述什麼是「高完整性資訊」：分清事實、意見與推論；承認不確定；公開說明經過多少查核；能用適當證據連回原始來源；有清楚的保管鏈。<sup class=\"cite\" data-e=\"E64\"><a href=\"#r31\">[31]<\/a><\/sup>它也建議追蹤數位內容的來源與修改，並且複核、查證生成式 AI 輸出裡的來源與引用。<sup class=\"cite\" data-e=\"E62 E63\"><a href=\"#r31\">[31]<\/a><\/sup>OECD 的 AI 原則要求提供淺白資訊，說明輸出的來源與邏輯，讓受影響的人能理解、也能質疑；並確保資料、過程與決定的可追溯性。<sup class=\"cite\" data-e=\"E68 E69\"><a href=\"#r32\">[32]<\/a><a href=\"#r33\">[33]<\/a><\/sup>這些都是自願指引。<\/p>\r\n            <p>調查也指向同一個方向。KPMG 與墨爾本大學的全球調查中，83% 的受訪者說，有保證機制時會更願意信任 AI 系統；機制包括人可以介入修正、出問題時清楚由誰負責。<sup class=\"cite\" data-e=\"E6\"><a href=\"#r35\">[35]<\/a><\/sup><\/p>\r\n            <p>把上面的指引放在一起，交付物可以附上這五項：<\/p>\r\n            <ol class=\"st-cards\">\r\n                <li><span class=\"n\">01<\/span><span><strong>來源清單。<\/strong>每個數字、每句引言，都連回原始文件。<sup class=\"cite\" data-e=\"E64 E62\"><a href=\"#r31\">[31]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">02<\/span><span><strong>AI 用在哪一步。<\/strong>寫明哪個工具、用在工作流程的哪個階段。<sup class=\"cite\" data-e=\"E37\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">03<\/span><span><strong>誰複核、怎麼驗證。<\/strong>寫明您檢查了什麼、用什麼方法查證。<sup class=\"cite\" data-e=\"E37 E36\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">04<\/span><span><strong>責任聲明。<\/strong>寫明成果由您負責，不因為用了 AI 而改變。<sup class=\"cite\" data-e=\"E37 E34\"><a href=\"#r20\">[20]<\/a><\/sup><sup class=\"cite\" data-e=\"E29\"><a href=\"#r21\">[21]<\/a><\/sup><\/span><\/li>\r\n                <li><span class=\"n\">05<\/span><span><strong>客戶的選擇。<\/strong>客戶可以要求不用 AI，或限制哪些資料能交給 AI。<sup class=\"cite\" data-e=\"E37 E39\"><a href=\"#r20\">[20]<\/a><\/sup><\/span><\/li>\r\n            <\/ol>\r\n            <p>第 1 項讓客戶能檢查；第 3、4 項回答「錯了怎麼辦」。兩者要分開寫，因為來源清楚，不代表內容正確。<\/p>\r\n\r\n            <div class=\"pd-stage bl-invite\">\r\n                <p>客戶問過您「這是怎麼來的？」嗎？您當時怎麼回答？<\/p>\r\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey/verify\">填寫問卷 <span class=\"arr\">→<\/span><\/a>\n        <\/div>\r\n\r\n            <h2 id=\"refs\">參考資料<\/h2>\r\n            <ol class=\"bl-refs\">\r\n                <li id=\"r1\"><span class=\"pub\">台灣微軟<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://news.microsoft.com/zh-tw/ms-wti-ai/\" rel=\"noopener\" target=\"_blank\">2024 工作趨勢指數台灣版新聞稿<\/a><\/li>\r\n                <li id=\"r2\"><span class=\"pub\">行政院主計總處<\/span><span class=\"d\">2026-03<\/span><a href=\"https://www.stat.gov.tw/News_Content.aspx?n=4001&amp;s=236078\" rel=\"noopener\" target=\"_blank\">114 年人力資源調查統計（表 15 歷年就業者之從業身分）<\/a><\/li>\r\n                <li id=\"r3\"><span class=\"pub\">Ipsos<\/span><span class=\"d\">2025-06-06<\/span><a href=\"https://www.ipsos.com/sites/default/files/ct/news/documents/2025-06/Ipsos-AI-Monitor-2025_0.pdf\" rel=\"noopener\" target=\"_blank\">Ipsos AI Monitor 2025<\/a><\/li>\r\n                <li id=\"r4\"><span class=\"pub\">Salesforce<\/span><span class=\"d\">2024-10-31<\/span><a href=\"https://www.salesforce.com/news/stories/ai-customer-research/\" rel=\"noopener\" target=\"_blank\">AI customer research（新聞頁）<\/a><\/li>\r\n                <li id=\"r5\"><span class=\"pub\">Pew Research Center<\/span><span class=\"d\">2025-09-17<\/span><a href=\"https://www.pewresearch.org/science/2025/09/17/how-americans-view-ai-and-its-impact-on-people-and-society/\" rel=\"noopener\" target=\"_blank\">How Americans View AI and Its Impact on People and Society<\/a><\/li>\r\n                <li id=\"r6\"><span class=\"pub\">Thomson Reuters Institute<\/span><span class=\"d\">2026-02-09<\/span><a href=\"https://www.thomsonreuters.com/en-us/posts/technology/ai-in-professional-services-report-2026\" rel=\"noopener\" target=\"_blank\">2026 AI in Professional Services Report（文章）<\/a><\/li>\r\n                <li id=\"r7\"><span class=\"pub\">Thomson Reuters Institute<\/span><span class=\"d\">2026-02-09<\/span><a href=\"https://www.thomsonreuters.com/content/dam/ewp-m/documents/thomsonreuters/en/pdf/reports/2026-ai-in-professional-services-report.pdf\" rel=\"noopener\" target=\"_blank\">2026 AI in Professional Services Report（報告 PDF）<\/a><\/li>\r\n                <li id=\"r8\"><span class=\"pub\">Schilke &amp; Reimann, Organizational Behavior and Human Decision Processes<\/span><span class=\"d\">2025-05-01<\/span><a href=\"https://par.nsf.gov/biblio/10597787\" rel=\"noopener\" target=\"_blank\">The transparency dilemma: How AI disclosure erodes trust<\/a><\/li>\r\n                <li id=\"r9\"><span class=\"pub\">University of Arizona News（作者文章）<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://news.arizona.edu/employee-news/being-honest-about-using-ai-work-makes-people-trust-you-less-research-finds\" rel=\"noopener\" target=\"_blank\">Being honest about using AI at work makes people trust you less, research finds<\/a><\/li>\r\n                <li id=\"r10\"><span class=\"pub\">JAMA Network Open<\/span><span class=\"d\">2025-07-17<\/span><a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/10.1001/jamanetworkopen.2025.21643\" rel=\"noopener\" target=\"_blank\">Public Perception of Physicians Who Use Artificial Intelligence<\/a><\/li>\r\n                <li id=\"r11\"><span class=\"pub\">Altay &amp; Gilardi, PNAS Nexus<\/span><span class=\"d\">2024-10-01<\/span><a href=\"https://academic.oup.com/pnasnexus/article/3/10/pgae403/7795946\" rel=\"noopener\" target=\"_blank\">People are skeptical of headlines labeled as AI-generated, even if true or human-made, because they assume full AI automation<\/a><\/li>\r\n                <li id=\"r12\"><span class=\"pub\">KPMG × The University of Melbourne<\/span><span class=\"d\">2025-04<\/span><a href=\"https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2025/trust-attitudes-artificial-intelligence-executive-summary.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI（摘要 PDF）<\/a><\/li>\r\n                <li id=\"r13\"><span class=\"pub\">Chicago Sun-Times<\/span><span class=\"d\">2025-05-20<\/span><a href=\"https://chicago.suntimes.com/press-room/2025/05/20/chicago-sun-times-response-to-may-18-special-section\" rel=\"noopener\" target=\"_blank\">Chicago Sun-Times response to May 18 special section<\/a><\/li>\r\n                <li id=\"r14\"><span class=\"pub\">Chicago Sun-Times<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://chicago.suntimes.com/news/2025/05/29/special-section-king-fake-book-list-errors-sun-times-review\" rel=\"noopener\" target=\"_blank\">Special section with fake book list plagued with additional errors, Sun-Times review finds<\/a><\/li>\r\n                <li id=\"r15\"><span class=\"pub\">Chicago Sun-Times（Melissa Bell）<\/span><span class=\"d\">2025-05-29<\/span><a href=\"https://chicago.suntimes.com/opinion/2025/05/29/lessons-apology-from-sun-times-ceo-ai-generated-book-list\" rel=\"noopener\" target=\"_blank\">Lessons (and an apology) from the Sun-Times CEO on that AI-generated book list<\/a><\/li>\r\n                <li id=\"r16\"><span class=\"pub\">Australian Greens<\/span><span class=\"d\">2025-10-09<\/span><a href=\"https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report\" rel=\"noopener\" target=\"_blank\">Greens slam Deloitte's unethical behaviour and measly refund over AI report bungle<\/a><\/li>\r\n                <li id=\"r17\"><span class=\"pub\">Government of Newfoundland and Labrador, OCIO<\/span><span class=\"d\">2025-04-17<\/span><a href=\"https://www.gov.nl.ca/exec/ocio/ai-policy/\" rel=\"noopener\" target=\"_blank\">Responsible Use of Artificial Intelligence Technology（AI policy）<\/a><\/li>\r\n                <li id=\"r18\"><span class=\"pub\">Magesh 等（arXiv 預印本）<\/span><span class=\"d\">2024-05-30<\/span><a href=\"https://arxiv.org/abs/2405.20362\" rel=\"noopener\" target=\"_blank\">Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools<\/a><\/li>\r\n                <li id=\"r19\"><span class=\"pub\">Vectara<\/span><span class=\"d\">2026-10-22 更新<\/span><a href=\"https://github.com/vectara/hallucination-leaderboard\" rel=\"noopener\" target=\"_blank\">Hallucination Leaderboard<\/a><\/li>\r\n                <li id=\"r20\"><span class=\"pub\">Ministry of Law, Singapore<\/span><span class=\"d\">2026-03-06<\/span><a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf arset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>About — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/about\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/about\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\"    class=\"is-active\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/about\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/about\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"backend/src/main/resources/static/media/about_crystal.mp4\"\n               poster=\"backend/src/main/resources/static/media/about_crystal.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"ab-ai\">Illustration · AI generated<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\">ABOUT // who we are<\/div>\n            <h1 class=\"ab-hero__title\" data-typewriter>Beauty is the residue left after universal patterns are deconstructed by subjective experience.<\/h1>\n        <\/div>\n    <\/header>\n\n    <!-- ---- what we do ---- -->\n    <section class=\"ab-section\" data-reveal>\n        <div class=\"qf-eyebrow\">WHAT<\/div>\n        \n        <h2 class=\"ab-h2\" data-typewriter><span style=\"display:inline-block\"><span style=\"display:inline-block\">We help people who use AI<\/span> <span style=\"display:inline-block\">and are accountable for it<\/span> <\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">catch the time bombs<\/span> <span style=\"display:inline-block\">in their oversight blind spots<\/span> <\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">before they hand over<\/span> <span style=\"display:inline-block\">what the AI produced,<\/span> <\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">without going back<\/span> <span style=\"display:inline-block\">to the original source<\/span> <span style=\"display:inline-block\">to check every item themselves,<\/span> <span style=\"display:inline-block\">every single time.<\/span><\/span><\/h2>\n    <\/section>\n\n    <!-- ---- why we do this ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WHY<\/div>\n        <h2 class=\"ab-h2\">Why we do this<\/h2>\n        <div class=\"ab-story\">\n            <p>We have worked on system-migration consulting projects, and we have taken over very large legacy systems that came with incomplete handovers. The traditional approach relies on people reading and checking item by item. It takes a very long time, and it demands a lot of both the people&#39;s experience and the state of the system.<\/p>\n            <p>Today, much of this work is expected to bring in AI, or is required to. But the traditional approach, with its rigorous process and skilled professionals, still makes mistakes; replace it with an AI tool that is itself unreliable, and the risk only grows. We use AI agents to write code every day, and we often see one report &quot;done&quot;, only to open the result and find that part of the work was not done, or was done differently from what it said.<\/p>\n            <p>At the same time, calls to oversee AI keep growing. Managers, clients and auditors all ask: &quot;Where did this come from?&quot;<\/p>\n            <p>So we are building a tool that lets AI results be checked, makes human oversight less laborious, and leaves a basis you can trace when something goes wrong.<\/p>\n            <p>We do not yet know how other fields handle this. What lawyers, consultants and customer-support teams run into may be very different from what we see. That is why we are running a survey.<\/p>\n        <\/div>\n    <\/section>\n\n    <!-- ---- how we think ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WAY // engineering perspective<\/div>\n        <h2 class=\"ab-h2\">How we think<\/h2>\n        <ol class=\"ab-way\">\n            <li>\n                <span class=\"n\">01<\/span>\n                <span>Engineering is not stacking up technology; it is folding complexity away where the user never sees it.<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">02<\/span>\n                <span>Every line of code should serve one explicit decision.<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">03<\/span>\n                <span>A good system does more than run: the next person can read it, change it and extend it.<\/span>\n            <\/li>\n        <\/ol>\n    <\/section>\n\n    <!-- ---- next step ---- -->\n    <section class=\"ab-section ab-section--flush ab-next\" data-reveal>\n        <a class=\"qf-btn qf-btn--primary\" href=\"#/en/survey/verify\">Tell us about that time <span class=\"arr\">→<\/span><\/a>\n        <a class=\"ab-also\" href=\"#/en/contact\">We also take on web development and project design → Contact us<\/a>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/blog": {"title": "Articles — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Articles — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/blog\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/blog\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\"     class=\"is-active\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <section class=\"sv-section\">\n        <div class=\"sv-eb\">NOTES // what we have been reading<\/div>\n        <h1 class=\"pd-h2\">Articles<\/h1>\n        <div class=\"bl-list\">\n            <a class=\"bl-card\" href=\"#/en/blog/ai-handover\">\n                <div class=\"bl-card__img\"><div class=\"bl-cover\">\n    <img src=\"content/articles/ai-handover/media/hero.jpg\" alt=\"\" loading=\"lazy\">\n    <span class=\"bl-ai\">Illustration · AI generated<\/span>\n<\/div><\/div>\n                <div class=\"bl-card__tx\">\n                    <time class=\"bl-date\" datetime=\"2026-11-01\">2026-11-01<\/time>\n                    <b>When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over<\/b>\n                    <span class=\"s\">A useful AI handover explains where AI contributed, which inputs and tools shaped the work, and what you reviewed or changed. It also records uncertainty, intended use, client instructions, and what the next person needs to continue.<\/span>\n                    <span class=\"pd-scene__go\">Read the article <span class=\"arr\">→<\/span><\/span>\n                <\/div>\n            <\/a><a class=\"bl-card\" href=\"#/en/blog/shadow-ai-en\">\n                <div class=\"bl-card__img\"><div class=\"bl-cover\">\n    <img src=\"content/articles/shadow-ai-en/media/hero.jpg\" alt=\"\" loading=\"lazy\">\n    <span class=\"bl-ai\">Illustration · AI generated<\/span>\n<\/div><\/div>\n                <div class=\"bl-card__tx\">\n                    <time class=\"bl-date\" datetime=\"2026-10-26\">2026-10-26<\/time>\n                    <b>Does your company know which AI tools its staff are using?<\/b>\n                    <span class=\"s\">Nearly half of the employees who use AI admit that their use breaks company rules. This note gathers international surveys, real incidents, rules from several jurisdictions, and the situation in Taiwan.<\/span>\n                    <span class=\"pd-scene__go\">Read the article <span class=\"arr\">→<\/span><\/span>\n                <\/div>\n            <\/a>\n        <\/div>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/blog/ai-handover": {"title": "When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over — Qilinfish Studio<\/title>\n    <meta name=\"description\" content=\"A useful AI handover explains where AI contributed, which inputs and tools shaped the work, and what you reviewed or changed. It also records uncertainty, intended use, client instructions, and what the next person needs to continue.\">\n    <link rel=\"canonical\" href=\"http://localhost:8787/en/blog/ai-handover\">\n    \n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"http://localhost:8787/blog/solo-trust\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"http://localhost:8787/en/blog/ai-handover\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:title\" content=\"When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over\">\n    <meta property=\"og:description\" content=\"A useful AI handover explains where AI contributed, which inputs and tools shaped the work, and what you reviewed or changed. It also records uncertainty, intended use, client instructions, and what the next person needs to continue.\">\n    <meta property=\"og:url\" content=\"http://localhost:8787/en/blog/ai-handover\">\n    <meta property=\"og:image\" content=\"http://localhost:8787/articles/ai-handover/media/hero.jpg\">\n    <script type=\"application/ld+json\">\n    {\n      \"@context\": \"https://schema.org\",\n      \"@type\": \"Article\",\n      \"headline\": \"When a Client Asks \\u201CHow Was This Made?\\u201D: What Solo Consultants Who Work With AI Should Hand Over\",\n      \"description\": \"A useful AI handover explains where AI contributed, which inputs and tools shaped the work, and what you reviewed or changed. It also records uncertainty, intended use, client instructions, and what the next person needs to continue.\",\n      \"datePublished\": \"2026-11-01\",\n      \"image\": \"http:\\/\\/localhost:8787\\/articles\\/ai-handover\\/media\\/hero.jpg\",\n      \"url\": \"http:\\/\\/localhost:8787\\/en\\/blog\\/ai-handover\",\n      \"inLanguage\": \"en\",\n      \"author\": { \"@type\": \"Organization\", \"name\": \"Qilinfish Studio\" },\n      \"publisher\": { \"@type\": \"Organization\", \"name\": \"Qilinfish Studio\" }\n    }\n    <\/script>\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\"     class=\"is-active\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/solo-trust\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/ai-handover\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"content/articles/ai-handover/media/hero.mp4\" poster=\"content/articles/ai-handover/media/hero.jpg\"\n               data-sv-play muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        \n        <span class=\"ab-ai\">Illustration · AI generated<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/en/blog\">← All articles<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-11-01\">2026-11-01<\/time><\/div>\n            <h1 class=\"ab-hero__title\">When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over<\/h1>\n            <p class=\"st-lede\">When you use AI to do client work, a clear handover helps explain how the result came together. Here is what to record, what to check, and where the limits of the record belong.<\/p>\n        <\/div>\n    <\/header>\n    \n    <article class=\"bl-post\" data-ev-marks=\"Sources for this passage\">\n        \n<template data-ev-src=\"E1\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>American Bar Association, Standing Committee on Ethics and Professional Responsibility.<\/b><time>2024-07-29.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Of course, lawyers must disclose their GAI practices if asked by a client how they conducted their work, or whether GAI technologies were employed in doing so, or if the client expressly requires disclosure under the terms of the engagement agreement or the client’s outside counsel guidelines.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The opinion addresses lawyers and interprets the ABA Model Rules of Professional Conduct. It says disclosure may be unnecessary in some circumstances, while disclosure or consultation may be required depending on the facts, client requests, engagement terms, or other Model Rule duties. This is not a general disclosure rule for independent consultants.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.americanbar.org/content/dam/aba/administrative/professional_responsibility/ethics-opinions/aba-formal-opinion-512.pdf\" rel=\"noopener\" target=\"_blank\">https://www.americanbar.org/content/dam/aba/administrative/professional_responsibility/ethics-opinions/aba-formal-opinion-512.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E2\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>UK Government.<\/b><time>Updated 2025-12-18; the checked page does not state the original publication date.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“give appropriate disclosure when AI has been used to produce an output – this concerns both internal and external uses of AI”; “recording how much of the process is automated and how much is controlled by people”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The framework is for government and other public-sector organisations. It recommends appropriate disclosure for AI-produced outputs. The recording recommendation applies where a system includes automated processing, as part of appropriate human oversight. This guidance does not establish a universal private-consultant requirement.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.gov.uk/government/publications/data-ethics-framework/data-and-ai-ethics-framework\" rel=\"noopener\" target=\"_blank\">https://www.gov.uk/government/publications/data-ethics-framework/data-and-ai-ethics-framework<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E3\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>National Institute of Standards and Technology, U.S. Department of Commerce.<\/b><time>2024-07.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Provenance metadata can include information about GAI model developers or creators of GAI content, date/time of creation, location, modifications, and sources.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The profile is cross-sectoral and accompanies the AI Risk Management Framework, which is intended for voluntary use by organisations. The passage describes metadata that may be included; it does not guarantee that the metadata will identify or establish each listed detail. The profile does not impose a freelancer-specific client-handover record.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E4\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>U.S. Copyright Office.<\/b><time>Published and effective 2023-03-16.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“applicants have a duty to disclose the inclusion of AI-generated content in a work submitted for registration and to provide a brief explanation of the human author’s contributions to the work.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">This duty applies to applicants submitting works for U.S. copyright registration. The guidance concerns the registration application and does not establish a general AI-disclosure requirement for client handovers.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.copyright.gov/ai/ai_policy_guidance.pdf\" rel=\"noopener\" target=\"_blank\">https://www.copyright.gov/ai/ai_policy_guidance.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E5\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>National Institute of Standards and Technology (NIST).<\/b><time>July 2024.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Provenance metadata can include information about GAI model developers or creators of GAI content, date/time of creation, location, tion class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>OECD.AI, Organisation for Economic Co-operation and Development (OECD).<\/b><time>No publication or update date displayed on the opened page.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“where feasible and useful, to provide plain and easy-to-understand information on the sources of data/input, factors, processes and/or logic that led to the prediction, content, recommendation or decision”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">This is a principle about transparency and responsible disclosure by AI actors. The page qualifies the information by context, feasibility, usefulness, and the state of the art; it is not a prescribed handover template.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://oecd.ai/en/dashboards/ai-principles/P7\" rel=\"noopener\" target=\"_blank\">https://oecd.ai/en/dashboards/ai-principles/P7<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E8\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>OECD.AI, Organisation for Economic Co-operation and Development (OECD).<\/b><time>No publication or update date displayed on the opened page.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“AI actors should ensure traceability, including in relation to datasets, processes and decisions made during the AI system lifecycle, to enable analysis of the AI system’s outputs and responses to inquiry, appropriate to the context and consistent with the state of the art.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The principle applies to AI actors and concerns traceability across the AI system lifecycle. It explicitly makes the appropriate degree context- and state-of-the-art-dependent; it does not specify a particular consultant handover record.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://oecd.ai/en/dashboards/ai-principles/P9\" rel=\"noopener\" target=\"_blank\">https://oecd.ai/en/dashboards/ai-principles/P9<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E9\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Coalition for Content Provenance and Authenticity (C2PA).<\/b><time>Version 2.3; publication date not stated on the page.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Content Credentials, also known as a C2PA Manifest, contain one or more assertions, which are statements about the asset, such as its origin (i.e., when and where it was created), modifications (i.e., what happened using what tools) and use of AI (i.e., how it was authored).”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The explainer concerns digital assets such as images, video, audio, and documents. It confirms that credentials can record ingredients and their provenance when assets are assembled from multiple sources. It also states that provenance alone cannot establish whether content is true, accurate, or factual, and provenance may be incomplete.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html\" rel=\"noopener\" target=\"_blank\">https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E10\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>United States Copyright Office.<\/b><time>January 2025.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“it analyzes how the law may apply to various types of human contributions to AI-generated outputs: prompting, the inclusion of human-authored expressive inputs, and the modification or arrangement of AI-generated outputs.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The report addresses copyrightability of works created using generative AI under U.S. copyright law. It distinguishes these types of human contribution; it does not establish general rules for documenting or handing over AI-assisted work.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf\" rel=\"noopener\" target=\"_blank\">https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E11\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>National Institute of Standards and Technology (NIST).<\/b><time>July 2024.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Review and verify sources and citations in GAI system outputs during pre-deployment risk measurement and ongoing monitoring activities.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The profile also suggests methods to trace the origin and modifications of digital content. It is a cross-sectoral profile for organizations managing generative AI risks, and NIST describes the AI Risk Management Framework as intended for voluntary use. These are suggested actions, not a claim that every organization must take them.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E12\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Stanford Law School hosts the paper; the authors are affiliated with Stanford University and Yale University.<\/b><time>2024-05-30 (arXiv submission; the PDF labels the manuscript “Preprint. Under review.”).<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Second, we manually construct a preregistered dataset of over 200 legal queries for identifying and understanding vulnerabilities in legal AI tools. We run these queries on LexisNexis, Thomson Reuters, and GPT-4 and manually review their outputs for accuracy and fidelity to authority.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The “over 200” figure describes legal queries in the researchers’ preregistered dataset, not people or all legal queries. The tested systems were LexisNexis, Thomson Reuters, and GPT-4. The findings concern those tools and queries.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://law.stanford.edu/wp-content/uploads/2024/05/Legal_RAG_Hallucinations.pdf\" rel=\"noopener\" target=\"_blank\">https://law.stanford.edu/wp-content/uploads/2024/05/Legal_RAG_Hallucinations.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E13\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Coalition for Content Provenance and Authenticity (C2PA).<\/b><time>Not stated; version 2.3.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Provenance information can help establish the truth about the origin, history and authenticity of digital content, by providing evidence for its creation, discovery, ownership and movement over time; but provenance information alone cannot tell you whether the digital content is true, accurate or factual.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">Content Credentials can record asset provenance, including origin and modifications. A credential-enabled application can verify the associated asset and manifest, including whether the asset has changed
