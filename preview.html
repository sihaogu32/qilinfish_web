<script id="pages" type="application/json">{"/about": {"title": "關於我們 — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>關於我們 — 麒麟魚 Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/about\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/about\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\"    class=\"is-active\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\">文章<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/about\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/about\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- opening film ---- -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"backend/src/main/resources/static/media/about_crystal.mp4\"\n               poster=\"backend/src/main/resources/static/media/about_crystal.jpg\"\n               autoplay muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\">ABOUT // who we are<\/div>\n            <h1 class=\"ab-hero__title\" data-typewriter>美感是『普適模式』被『主觀經驗』解構後的殘餘。<\/h1>\n        <\/div>\n    <\/header>\n\n    <!-- ---- what we do ---- -->\n    <section class=\"ab-section\" data-reveal>\n        <div class=\"qf-eyebrow\">WHAT<\/div>\n        \n        <h2 class=\"ab-h2\" data-typewriter><span style=\"display:inline-block\"><span style=\"display:inline-block\">我們幫使用 AI<\/span> <span style=\"display:inline-block\">且要為此負責的人，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">在交出 AI 的產物之前，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">抓出監督盲區的未爆彈，<\/span><\/span><span style=\"display:inline-block\"><span style=\"display:inline-block\">而且不用<\/span><span style=\"display:inline-block\">每一次每一條<\/span><span style=\"display:inline-block\">都親自回到<\/span><span style=\"display:inline-block\">原始出處核對。<\/span><\/span><\/h2>\n    <\/section>\n\n    <!-- ---- why we do this ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WHY<\/div>\n        <h2 class=\"ab-h2\">為什麼做這件事<\/h2>\n        <div class=\"ab-story\">\n            <p>我們遇過系統遷移的顧問案，也接手過規模很大、交接卻不齊全的舊系統。傳統做法是靠人一項一項讀、一項一項對，曠日費時，對人員的經驗和系統的條件要求都很高。<\/p>\n            <p>現在，很多這類工作都期待導入 AI，或者被要求導入 AI。可是傳統做法有嚴謹的流程、有專業的人，仍然會出錯；換成一個本身就不穩定的 AI 工具，風險只會更大。我們自己每天用 AI 代理寫程式，也常常遇到它回報「做完了」，打開一看，有一部分沒做，或者做的跟它說的不一樣。<\/p>\n            <p>同時，要求監管 AI 的聲音越來越多。主管、客戶、稽核都會問：「這是怎麼來的？」<\/p>\n            <p>所以我們在做一個工具，讓 AI 的結果可以被檢查，人要監督也比較省力，出了事也查得到根據。<\/p>\n            <p>我們還不知道其他行業怎麼處理這件事。律師、顧問、客服遇到的情況，可能跟我們很不一樣。這就是我們做問卷的原因。<\/p>\n        <\/div>\n    <\/section>\n\n    <!-- ---- how we think ---- -->\n    <section class=\"ab-section ab-section--flush\" data-reveal>\n        <div class=\"qf-eyebrow\">WAY // 工程觀點<\/div>\n        <h2 class=\"ab-h2\">我們怎麼想事情<\/h2>\n        <ol class=\"ab-way\">\n            <li>\n                <span class=\"n\">01<\/span>\n                <span>工程不是堆疊技術，是把複雜性收斂到使用者看不見的地方。<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">02<\/span>\n                <span>每一行程式碼都該為一個明確的決策服務。<\/span>\n            <\/li>\n            <li>\n                <span class=\"n\">03<\/span>\n                <span>好的系統不只能跑，還能被下一個人讀懂、改動、擴展。<\/span>\n            <\/li>\n        <\/ol>\n    <\/section>\n\n    <!-- ---- next step ---- -->\n    <section class=\"ab-section ab-section--flush ab-next\" data-reveal>\n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey/verify\">說說您那一次 <span class=\"arr\">→<\/span><\/a>\n        <a class=\"ab-also\" href=\"#/contact\">也接 Web 開發與專案設計 → 聯絡我們<\/a>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/blog": {"title": "文章 — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>文章 — 麒麟魚 Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/blog\">\n    <link rel=\"alternat m\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\"     class=\"is-active\">文章<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/shadow-ai\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/shadow-ai-en\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        \n        <img class=\"ab-hero__video\" src=\"content/articles/shadow-ai/media/hero.jpg\" alt=\"\" aria-hidden=\"true\">\n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/blog\">← 所有文章<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-10-26\">2026-10-26<\/time><\/div>\n            <h1 class=\"ab-hero__title\">您的公司知道員工在用哪些 AI 嗎？<\/h1>\n            <p class=\"st-lede\">將近一半用 AI 的員工承認用法違反公司規定。這篇整理國際調查、真實事件、各地規範，以及台灣的現況。<\/p>\n        <\/div>\n    <\/header>\n    \n    <article class=\"bl-post\">\n        \n\n\n        \n        <div class=\"bl-prose\">\n\n            <h2 id=\"what\">什麼是影子 AI<\/h2>\n            <p>影子 AI（shadow AI）指員工沒有經過公司核准，自己找 AI 工具來處理工作。台灣的法律資料庫 Lawsnote 這樣定義：「影子 AI，是指員工或組織成員在未經核准、缺乏管理的情況下，自行使用生成式 AI 工具處理工作。」<\/p>\n            <p>同一篇文章舉了幾個例子：<\/p>\n            <ul>\n                <li>用個人帳號，把客戶資料貼進免費版 AI。<\/li>\n                <li>沒有經過核准，就用瀏覽器外掛摘要文件。<\/li>\n                <li>助理自己用 AI 搜尋判決，再把結果交給律師。<\/li>\n                <li>部門私下訂閱 AI 工具，沒有經過資安或法遵審查。<\/li>\n            <\/ul>\n            <p>問題不在 AI 本身，而在公司不知道：用了哪個工具、輸入了什麼、產出用在哪裡。出了事的時候，也就很難說清楚發生了什麼。<\/p>\n\n            <h2 id=\"how-common\">有多普遍<\/h2>\n            <p>KPMG 與墨爾本大學在 2024 年底到 2025 年初，調查了 47 個國家的 48,340 人。用 AI 工作的員工裡，將近一半承認用法違反公司的規定。用得最多的是免費的公開工具（70%），公司提供的工具只有 42%。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.1 · 受訪員工自己說的<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>避免讓人知道自己用了 AI<\/span><b>61<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:61%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>不確定公司准不准，就先用了<\/span><b>56<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:56%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>把公司資料上傳到公開的 AI 工具<\/span><b>48<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>用法違反公司的規定<\/span><b>44<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:44%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">KPMG × 墨爾本大學《Trust, attitudes and use of AI》2025 · 47 國 48,340 人 · 台灣不在樣本內 · 比例為回答「很少」以上（報告 Figure 44：100% 減「從不」）<\/span>\n            <\/figure>\n\n            <p>這和管理者的感受一致。國際資訊治理組織 ISACA 在 2025 年問了 3,029 位資安、稽核、治理領域的專業人員，81% 認為公司裡的員工不管准不准都在用 AI，但只有 28% 的組織有正式而完整的 AI 政策。到了 2026 年，同一份調查的這個比例升到 38%。微軟與 LinkedIn 2024 年調查 31 個國家的 31,000 人，發現 78% 的 AI 使用者是自己帶 AI 工具上班。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.2 · 員工在用，規則還沒跟上<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>認為員工不管准不准都在用 AI<\/span><b>81<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:81%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>組織有正式而完整的 AI 政策<\/span><b>28<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:28%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">ISACA 2025 AI Pulse Poll · 3,029 位數位信任專業人員 · 2025-06<\/span>\n            <\/figure>\n\n            <h2 id=\"incidents\">出過的事<\/h2>\n            <p>IBM 每年統計資料外洩的成本。2025 年的報告分析了 600 家發生外洩的組織，每 5 家就有 1 家的外洩是影子 AI 造成的。影子 AI 用得多的組織，每次外洩的成本平均多出 67 萬美元。這類外洩洩漏個人資料與智慧財產的比例，也都比平均高。這 600 家組織裡，只有 37% 有管理 AI 或偵測影子 AI 的政策。<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.3 · 外洩事件裡洩漏了什麼<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>個人資料：影子 AI 造成的外洩<\/span><b>65<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:65%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>個人資料：全體平均<\/span><b>53<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:53%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>智慧財產：影子 AI 造成的外洩<\/span><b>40<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:40%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>智慧財產：全體平均<\/span><b>33<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:33%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">IBM Cost of a Data Breach Report 2025 · 600 家發生外洩的組織 · 2024-03 至 2025-02<\/span>\n            <\/figure>\n\n            <h3>澳洲：水災災民的資料進了 ChatGPT<\/h3>\n            <p>2025 年 3 月 12 日到 15 日，澳洲新南威爾斯州重建署的一名前臨時員工，把一份 Excel 試算表上傳到 ChatGPT。檔案有 10 欄、超過 12,000 列，內容是北河地區水災房屋計畫申請人的資料：姓名、聯絡方式、住址、出生日期、敏感的健康資訊，還有少量財務相關的註記。<\/p>\n            <p>重建署說，這個工具「沒有經過授權」。事件在 2025 年 10 月 6 日公開，當時說最多可能影響 3,000 人。2026 年 3 月更新的說明確定是 2,031 人。之後重建署加裝了控管，擋住把個人資料上傳到 AI 工具，也修改了內部規定與訓練。<\/p>\n\n            <h3>AI 助理的外掛，也可能出問題<\/h3>\n            <p>影子 AI 不只是聊天視窗。現在的 AI 助理可以裝外掛，替人寄信、讀檔案、操作系統。2025 年 9 月，開源套件庫裡一個讓 AI 助理寄信的外掛 <code>postmark-mcp<\/code> 被列為惡意套件：從 1.0.16 版開始，它會用密件副本把經手的信件偷偷寄出去。如果是員工自己裝的外掛，公司就不會知道它在那裡。<\/p>\n\n            <h2 id=\"law\">法規怎麼說<\/h2>\n            <p>我們沒有找到直接寫「影子 AI」的法律。但已經有幾份規範，要求組織掌握自己的人怎麼用 AI。<\/p>\n\n            <h3>歐盟 AI 法：員工用 ChatGPT 也算<\/h3>\n            <p>歐盟《人工智慧法》第 4 條從 2025 年 2 月 2 日開始適用，要求提供或使用 AI 系統的組織採取措施，讓員工具備足夠的 AI 素養。歐盟執委會的問答直接回答了一個問題：員工用 ChatGPT 寫廣告文案、翻譯文件，公司也要符合這一條嗎？答案是「要」，應該讓員工知道特定的風險，例如 AI 會一本正經地編造內容。這一條的修正在 2026 年 7 月中生效後，從「確保足夠的程度」改成「支持員工培養 AI 素養」，不再要求保證達到某個程度，但組織仍然要採取措施。<\/p>\n\n            <h3>美國 NIST：先把清單列出來<\/h3>\n            <p>美國國家標準與技術研究院（NIST）2024 年 7 月發布的生成式 AI 風險管理指引，建議組織盤點所有能接觸到組織內容的第三方，並且建立核准使用的生成式 AI 工具清單。這是自願採用的指引，不是法律。<\/p>\n\n            <h3>新加坡金管局：第一次在監理指引裡點名<\/h3>\n            <p>新加坡金融管理局 2026 年 10 月 7 日發布 AI 風險管理指引，2027 年 10 月 7 日生效。指引直接把「影子 AI」列為風險，要求新加坡的金融機構一致地找出各部門在哪裡用了 AI、建立 AI 使用清單。對於找不出來的使用，也要評估風險並採取措施。指引舉的例子包括：告訴員工哪些用法可以、哪些不行，例如不得把機密或客戶資料輸入公開的 AI 工具。<\/p>\n\n            <h2 id=\"taiwan\">台灣現況<\/h2>\n            <p>我們沒有找到台灣本地專門調查「員工未經核准使用 AI」的數字。最接近的有兩份。微軟 2024 年的調查指出，台灣 84% 的知識工作者在工作上使用生成式 AI；AI 使用者中將近八成自己帶 AI 工具上班，比全球還高。趨勢科技 2026 年 3 月發布的調查訪問了台灣 200 位企業的業務與 IT 決策者，74% 曾經在有安全疑慮的情況下仍被迫批准導入 AI，高於全球的 67%。<\/p>\n\n            <h3>公部門：先禁、再立法<\/h3>\n            <p>2023 年 8 月 31 日的行政院院會議案中，國科會提出使用生成式 AI 的參考指引草案，要求各機關負責任地使用，並注意安全、隱私、資料治理與問責。2025 年 2 月 3 日，行政院宣布公務機關原則上全面禁用 DeepSeek 的 AI 服務。2025 年 12 月 1 日施行的新版《資通安全管理法》第 11 條規定，公務機關不得下載、安裝或使用危害國家資通安全的產品。2026 年 1 月 14 日公布的《人工智慧基本法》第 19 條也要求政府訂定使用規範或內控管理機制。<\/p>\n\n            <h3>金融業：資料不能隨便給 AI<\/h3>\n            <p>金管會 2024 年 6 月發布的《金融業運用人工智慧(AI)指引》屬於行政指導。指引寫明，在沒有適當管控的情況下，金融機構人員「不得向生成式 AI 提供未經客戶同意提供之資訊」，也建議金融機構建立並維護 AI 模型清單。金管會在 2023 年 4 月的問卷發現，有 95 家金融機構及周邊單位已經對員工使用生成式 AI 進行管制，例如用防火牆擋住內網連到 ChatGPT。<\/p>\n\n            <h3>法院：不要用 AI 寫上訴狀<\/h3>\n            <p>2026 年 7 月 24 日，桃園地方法院在一件民事判決（115 年度訴字第 867 號）裡提醒當事人：拿到判決後，請找一位「活生生的、有血有肉有執照的律師」問清楚。「不要問AI，不要用AI寫上訴狀，更不要以為人家看不出是AI寫的。」<\/p>\n\n            <h3>出事之後，要說得出發生了什麼<\/h3>\n            <p>《個人資料保護法》在 2025 年 11 月 11 日修正，施行日期由行政院另訂。修正後的第 12 條要求，個人資料外洩時要通知當事人、立即應變，並且記載相關事實、影響與採取的措施，保存紀錄以備主管機關查驗；符合一定範圍時，還要通報主管機關。如果資料是經過公司不知道的 AI 工具流出去，這些事就很難說清楚。<\/p>\n\n            <div class=\"pd-stage bl-invite\">\n                <p>您的公司有沒有發生過「事後才知道有人用了 AI」的事？我們正在整理實際的經驗，想聽聽您遇過的情況。<\/p>\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/survey/verify\">填寫問卷 <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n\n            <h2 id=\"refs\">參考資料<\/h2>\n            <ol class=\"bl-refs\">\n                <li><span class=\"pub\">Lawsnote<\/span><span class=\"d\">2026-07-21<\/span><a href=\"https://blog.lawsnote.com/2026/07/ai-%e6%99%82%e4%bb%a3%e7%9a%84%e5%88%a4%e6%b1%ba%e6%aa%a2%e7%b4%a2%ef%bd%9c%e5%be%8b%e5%b8%ab%e5%bf%85%e7%9c%8b%e7%9a%84%e5%88%a4%e6%b1%ba%e6%90%9c%e5%b0%8b%e6%9f%a5%e8%ad%89%e6%b5%81%e7%a8%8b/\" rel=\"noopener\" target=\"_blank\">AI 時代的判決檢索｜律師必看的判決搜尋查證流程與影子 AI 風險<\/a><\/li>\n                <li><span class=\"pub\">KPMG × The University of Melbourne<\/span><span class=\"d\">2025-04<\/span><a href=\"https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI: A global study 2025<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2025-06-25<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2025/digital-trust-pros-say-increased-ai-skills-and-knowledge-needed-to-advance-their-career\" rel=\"noopener\" target=\"_blank\">2025 AI Pulse Poll 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2026-05-05<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2026/ai-use-accelerates-while-governance-and-roi-lag-says-new-isaca-research\" rel=\"noopener\" target=\"_blank\">2026 AI Pulse Poll 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">Microsoft<\/span><span class=\"d\">2024-05-08<\/span><a href=\"https://news.microsoft.com/source/2024/05/08/microsoft-and-linkedin-release-the-2024-work-trend-index-on-the-state-of-ai-at-work/\" rel=\"noopener\" target=\"_blank\">Microsoft and LinkedIn release the 2024 Work Trend Index<\/a><\/li>\n                <li><span class=\"pub\">IBM<\/span><span class=\"d\">2025-07-30<\/span><a href=\"https://newsroom.ibm.com/2025-07-30-ibm-report-13-of-organizations-reported-breaches-of-ai-models-or-applications,-97-of-which-reported-lacking-proper-ai-access-controls\" rel=\"noopener\" target=\"_blank\">Cost of a Data Breach Report 2025 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">2025-10-06<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/media-releases/northern-rivers-resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Northern Rivers Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">2026-03-26 更新<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">OSV（開源漏洞資料庫）<\/span><span class=\"d\">2025-09-26<\/span><a href=\"https://osv.dev/vulnerability/MAL-2025-47604\" rel=\"noopener\" target=\"_blank\">MAL-2025-47604：postmark-mcp<\/a><\/li>\n                <li><span class=\"pub\">European Commission<\/span><span class=\"d\">2026-10-20 更新<\/span><a href=\"https://digital-strategy.ec.europa.eu/en/faqs/ai-literacy-questions-answers\" rel=\"noopener\" target=\"_blank\">AI Literacy – Questions &amp; Answers<\/a><\/li>\n                <li><span class=\"pub\">European Commission AI Act Service Desk<\/span><span class=\"d\">2026-07-27 合併版<\/span><a href=\"https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4\" rel=\"noopener\" target=\"_blank\">AI Act Article 4: AI literacy<\/a><\/li>\n                <li><span class=\"pub\">NIST<\/span><span class=\"d\">2024-07<\/span><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">NIST AI 600-1：Generative Artificial Intelligence Profile<\/a><\/li>\n                <li><span class=\"pub\">Monetary Authority of Singapore<\/span><span class=\"d\">2026-10-07<\/span><a href=\"https://www.mas.gov.sg/news/media-releases/2026/mas-sets-out-supervisory-expectations-on-responsible-ai-adoption-by-financial-institutions\" rel=\"noopener\" target=\"_blank\">Guidelines on AI Risk Management 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">Monetary Authority of Singapore<\/span><span class=\"d\">2026-10-07<\/span><a href=\"https://www.mas.gov.sg/-/media/mas-media-library/regulation/guidelines/bd/guidelines-on-artificial-intelligence-risk-management-for-financial-institutions/guidelines-on-artificial-intelligence-risk-management.pdf\" rel=\"noopener\" target=\"_blank\">Guidelines on Artificial Intelligence Risk Management（指引本文 PDF）<\/a><\/li>\n                <li><span class=\"pub\">台灣微軟<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://news.microsoft.com/zh-tw/ms-wti-ai/\" rel=\"noopener\" target=\"_blank\">2024 年工作趨勢指數<\/a><\/li>\n                <li><span class=\"pub\">趨勢科技<\/span><span class=\"d\">2026-03-26<\/span><a href=\"https://www.trendmicro.com/zh_tw/about/newsroom/press-releases/2026/2026-03-26.html\" rel=\"noopener\" target=\"_blank\">新聞稿<\/a><\/li>\n                <li><span class=\"pub\">行政院<\/span><span class=\"d\">2023-08-31<\/span><a href=\"https://www.ey.gov.tw/Page/448DE008087A1971/40c1a925-121d-4b6b-8f40-7e9e1a5401f2\" rel=\"noopener\" target=\"_blank\">使用生成式 AI 參考指引<\/a><\/li>\n                <li><span class=\"pub\">行政院<\/span><span class=\"d\">2025-02-03<\/span><a href=\"https://www.ey.gov.tw/Page/9277F759E41CCD91/3ce9fe8f-2f5f-4d1d-8176-6fa4cf622b82\" rel=\"noopener\" target=\"_blank\">卓揆：公務機關全面禁用 Deepseek AI 服務<\/a><\/li>\n                <li><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">2025-12-01 施行<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=A0030297&amp;flno=11\" rel=\"noopener\" target=\"_blank\">資通安全管理法 第 11 條<\/a><\/li>\n                <li><span class=\"pub\">總統府公報 第 7837 號<\/span><span class=\"d\">2026-01-14<\/span><a href=\"https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7\" rel=\"noopener\" target=\"_blank\">人工智慧基本法<\/a><\/li>\n                <li><span class=\"pub\">金融監督管理委員會<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">金融業運用人工智慧(AI)指引 新聞稿<\/a><\/li>\n                <li><span class=\"pub\">金融監督管理委員會<\/span><span class=\"d\">2024-06-20<\/span><a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">金融業運用人工智慧(AI)指引（指引本文 PDF）<\/a><\/li>\n                <li><span class=\"pub\">司法院裁判書查詢<\/span><span class=\"d\">2026-07-24<\/span><a href=\"https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&amp;id=TYDV,115,%E8%A8%B4,867,20260724,1\" rel=\"noopener\" target=\"_blank\">臺灣桃園地方法院 115 年度訴字第 867 號民事判決<\/a><\/li>\n                <li><span class=\"pub\">全國法規資料庫<\/span><span class=\"d\">2025-11-11 修正<\/span><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021\" rel=\"noopener\" target=\"_blank\">個人資料保護法<\/a><\/li>\n            <\/ol>\n        <\/div>\n\n        \n        \n    <\/article>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/blog/solo-trust": {"title": "客戶問「這是怎麼來的？」，您拿得出什麼？ — 麒麟魚 Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>客戶問「這是怎麼來的？」，您拿得出什麼？ — 麒麟魚 Qilinfish Studio<\/title>\n    <meta name=\"description\" content=\"多數受訪者希望知道產品與服務是否使用 AI。研究顯示，主動揭露使用 AI 可能降低信任，悄悄使用後被發現的信任下降更多。交付時可說明 AI 用在哪一步、誰複核、如何驗證，以及由誰負責。\">\n    <link rel=\"canonical\" href=\"http://localhost:8787/blog/solo-trust\">\n    \n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"http://localhost:8787/blog/solo-trust\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"http://localhost:8787/en/blog/ai-handover\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:title\" content=\"客戶問「這是怎麼來的？」，您拿得出什麼？\">\n    <meta property=\"og:description\" content=\"多數受訪者希望知道產品與服務是否使用 AI。研究顯示，主動揭露使用 AI 可能降低信任，悄悄使用後被發現的信任下降更多。交付時可說明 AI 用在哪一步、誰複核、如何驗證，以及由誰負責。\">\n    <meta property=\"og:url\" content=\"http://localhost:8787/blog/solo-trust\">\n    <meta property=\"og:image\" content=\"http://localhost:8787/articles/solo-trust/media/hero.jpg\">\n    <script type=\"application/ld+json\">\n    {\n      \"@context\": \"https://schema.org\",\n      \"@type\": \"Article\",\n      \"headline\": \"\\u5BA2\\u6236\\u554F\\u300C\\u9019\\u662F\\u600E\\u9EBC\\u4F86\\u7684\\uFF1F\\u300D\\uFF0C\\u60A8\\u62FF\\u5F97\\u51FA\\u4EC0\\u9EBC\\uFF1F\",\n      \"description\": \"\\u591A\\u6578\\u53D7\\u8A2A\\u8005\\u5E0C\\u671B\\u77E5\\u9053\\u7522\\u54C1\\u8207\\u670D\\u52D9\\u662F\\u5426\\u4F7F\\u7528 AI\\u3002\\u7814\\u7A76\\u986F\\u793A\\uFF0C\\u4E3B\\u52D5\\u63ED\\u9732\\u4F7F\\u7528 AI \\u53EF\\u80FD\\u964D\\u4F4E\\u4FE1\\u4EFB\\uFF0C\\u6084\\u6084\\u4F7F\\u7528\\u5F8C\\u88AB\\u767C\\u73FE\\u7684\\u4FE1\\u4EFB\\u4E0B\\u964D\\u66F4\\u591A\\u3002\\u4EA4\\u4ED8\\u6642\\u53EF\\u8AAA\\u660E AI \\u7528\\u5728\\u54EA\\u4E00\\u6B65\\u3001\\u8AB0\\u8907\\u6838\\u3001\\u5982\\u4F55\\u9A57\\u8B49\\uFF0C\\u4EE5\\u53CA\\u7531\\u8AB0\\u8CA0\\u8CAC\\u3002\",\n      \"datePublished\": \"2026-10-28\",\n      \"image\": \"http:\\/\\/localhost:8787\\/articles\\/solo-trust\\/media\\/hero.jpg\",\n      \"url\": \"http:\\/\\/localhost:8787\\/blog\\/solo-trust\",\n      \"inLanguage\": \"zh-Hant-TW\",\n      \"author\": { \"@type\": \"Organization\", \"name\": \"\\u9E92\\u9E9F\\u9B5A Qilinfish Studio\" },\n      \"publisher\": { \"@type\": \"Organization\", \"name\": \"\\u9E92\\u9E9F\\u9B5A Qilinfish Studio\" }\n    }\n    <\/script>\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/about\">關於我們<\/a>\n        <a href=\"#/products\">產品方案<\/a>\n        <a href=\"#/blog\"     class=\"is-active\">文章<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/solo-trust\" hreflang=\"zh-Hant-TW\" class=\"is-active\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/ai-handover\" hreflang=\"en\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        <video class=\"ab-hero__video\" src=\"content/articles/solo-trust/media/hero.mp4\" poster=\"content/articles/solo-trust/media/hero.jpg\"\n               data-sv-play muted loop playsinline preload=\"metadata\" aria-hidden=\"true\"><\/video>\n        \n        <span class=\"ab-ai\">示意畫面 · AI 生成<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/blog\">← 所有文章<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-10-28\">2026-10-28<\/time><\/div>\n            <h1 class=\"ab-hero__title\">客戶問「這是怎麼來的？」，您拿得出什麼？<\/h1>\n            <p class=\"st-lede\">您一個人接案，用 AI 幫客戶做事。客戶想知道您有沒有用 AI，也想知道出了錯誰負責。這篇整理調查、事件與各地的指引，看看交付時要附上什麼。<\/p>\n        <\/div>\n    <\/header>\n    \n    <article class=\"bl-post\" data-ev-marks=\"這段話的出處\">\n        \n<template data-ev-src=\"E6\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>The University of Melbourne × KPMG International<\/b><span>Trust, attitudes and use of AI: A global study 2025<\/span><time>2025-04<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Four out of five (83%) report they would be more willing to trust an AI system when such assurance mechanisms are in place.&quot;<\/p><p class=\"ev-tr\">五分之四（83%）的人說，有這類保證機制時，他們會更願意信任 AI 系統。<\/p><p class=\"ev-line\">&quot;These mechanisms range from monitoring system reliability to human oversight and accountability, responsible AI policies and training, adhering to international AI standards, and independent third-party AI assurance systems (see Figure 29).&quot;<\/p><p class=\"ev-tr\">這些機制從監測系統可靠度、人的監督與問責、負責任 AI 政策與訓練、遵循國際 AI 標準，到獨立第三方 AI 保證系統。<\/p><p class=\"ev-line\">圖 29 題目：&quot;I would be more willing to trust an AI system (specific application) if...&quot;；選項含 &quot;It allows for human intervention to correct, override, or challenge recommendations and output&quot; 與 &quot;It is clear who is accountable if something goes wrong with the system&quot;<\/p><p class=\"ev-tr\">「如果……我會更願意信任這個 AI 系統」；選項含「允許人介入修正、推翻或質疑建議與產出」、「出問題時清楚由誰負責」。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">48,340 人，47 個國家與地區；線上調查，2024-11 至 2025-01 中旬。母體是各國一般成人，不是客戶或採購者。受訪者自述，不是實際行為。台灣不在樣本內（註 9：中國樣本只含中國大陸，不含港澳台）。83% 是「保證機制整體」的數字，不是單一機制。圖 29 的單項百分比沒有逐字核對，不引用。台灣不在樣本內。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf\" rel=\"noopener\" target=\"_blank\">https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E9\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>KPMG International × The University of Melbourne<\/b><span>The age of Intelligence: Empowering human-AI collaboration for a trusted future（摘要 PDF 版權頁標題）<\/span><time>2025-04<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;61 percent avoid revealing when they have used AI tools in their work&quot;<\/p><p class=\"ev-tr\">61% 會避免透露自己在工作中用了 AI 工具。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">員工子樣本 n=32,352；員工中 77% 受僱於組織、16% 自僱、7% 是企業主。受訪者自述。57%（報告）與 61%（摘要，見 E9）是不同題目或合併方式，不可混用。台灣不在樣本內。與 57% 不可混用。台灣不在樣本內。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2025/trust-attitudes-artificial-intelligence-executive-summary.pdf\" rel=\"noopener\" target=\"_blank\">https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2025/trust-attitudes-artificial-intelligence-executive-summary.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E10\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ipsos<\/b><span>Ipsos AI Monitor 2025<\/span><time>2025-06-06<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Seventy-nine percent agree (40% strongly agree) that companies using AI should have to disclose that use.&quot;<\/p><p class=\"ev-tr\">79% 同意（40% 非常同意）用 AI 的公司應該要揭露這件事。<\/p><p class=\"ev-line\">報告第 22 頁題目：&quot;How much do you agree or disagree with the following? Products and services using artificial intelligence should have to disclose that use&quot;<\/p><p class=\"ev-tr\">你多同意下列說法？用人工智慧的產品與服務應該要揭露這件事。<\/p><p class=\"ev-line\">同頁：&quot;30-country average 79% Indonesia 91% … Japan 66%&quot;；不同意欄 30 國平均 7%。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">&quot;Base: 23,216 online adults under age 75 across 30 countries, interviewed March 21 – April 4, 2025&quot;。部分國家樣本比一般人口更都市、更高學歷或更富裕。30 國平均未依人口加權，不代表總體結果。題目是「產品與服務」，不是專業顧問服務。台灣不在 30 國內。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞頁 <a href=\"https://www.ipsos.com/en-us/conflicting-global-perceptions-around-ai-present-mixed-signals-brands\" rel=\"noopener\" target=\"_blank\">https://www.ipsos.com/en-us/conflicting-gl <a href=\"https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf\" rel=\"noopener\" target=\"_blank\">https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf<\/a> ；說明頁 <a href=\"https://www.calbar.ca.gov/legal-professionals/ethics-compliance-practice-resources/ethics/ethics-technology-resources\" rel=\"noopener\" target=\"_blank\">https://www.calbar.ca.gov/legal-professionals/ethics-compliance-practice-resources/ethics/ethics-technology-resources<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E31\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>The State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)<\/b><span>Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law<\/span><time>原版 2023-11-16；2026 版由理事會 2026-05-14 核准（PDF 本身沒有標日期）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;A lawyer must consider disclosure to their client that they intend to use AI in the representation, including how the technology will be used, and the benefits and risks of such use. For example, disclosure may be appropriate where AI use materially affects decision-making processes.&quot;<\/p><p class=\"ev-tr\">律師必須考慮向客戶揭露打算在代理中使用 AI，包括技術會怎麼用及其利益與風險。例如 AI 的使用實質影響決策過程時，揭露可能是適當的。<\/p><p class=\"ev-line\">&quot;A lawyer must also follow any applicable client instructions or guidelines that may restrict or limit the use of AI in connection with the representation of the client.&quot;<\/p><p class=\"ev-tr\">律師也必須遵守客戶限制使用 AI 的任何指示或準則。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">職業倫理意見（州律師公會委員會的實務指引，解釋既有的 California Rules of Professional Conduct）；說明頁沒有寫是否有拘束力。適用對象：加州執業律師。台灣不適用。&quot;must consider disclosure&quot; 是「必須考慮揭露」，不是「必須揭露」。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">PDF <a href=\"https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf\" rel=\"noopener\" target=\"_blank\">https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf<\/a> ；說明頁 <a href=\"https://www.calbar.ca.gov/legal-professionals/ethics-compliance-practice-resources/ethics/ethics-technology-resources\" rel=\"noopener\" target=\"_blank\">https://www.calbar.ca.gov/legal-professionals/ethics-compliance-practice-resources/ethics/ethics-technology-resources<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E34\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ministry of Law, Singapore<\/b><span>Guide for Using Generative Artificial Intelligence in the Legal Sector<\/span><time>2026-03-06（說明頁頁尾 &quot;Last Updated 27 Oct 2026&quot; 是網頁更新日）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 4 段：&quot;This Guide is non-binding.&quot;<\/p><p class=\"ev-tr\">本指南不具拘束力。<\/p><p class=\"ev-line\">第 14 段：&quot;Professionals and organisations are ultimately responsible for the quality and integrity of their work product, and for compliance with applicable professional and ethical duties.&quot;<\/p><p class=\"ev-tr\">專業人員與組織對工作成果的品質與完整性，以及遵守相關專業與倫理義務，負最終責任。<\/p><p class=\"ev-line\">3.1 (b)：&quot;Regardless of whether GenAI is used, legal professionals remain ultimately accountable for all work product as part of their professional duties owed to clients or business units they serve.&quot;；&quot;The use of GenAI tools does not delegate or diminish these obligations.&quot;<\/p><p class=\"ev-tr\">無論是否使用 GenAI，法律專業人員都對所有工作成果負最終責任，這是對所服務客戶或業務單位的專業義務。使用 GenAI 工具不會轉移或減輕這些義務。<\/p><p class=\"ev-line\">3.1 (c)：&quot;Before using any GenAI-generated output in legal work, legal professionals must ensure that the output is correct, factually accurate, and fit for purpose.&quot;<\/p><p class=\"ev-tr\">在法律工作中使用任何 GenAI 產出前，法律專業人員必須確保產出正確、事實準確、符合用途。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（原文自稱 non-binding）；所引的 Legal Profession (Professional Conduct) Rules 2015 第 5、6 條（誠實能力勤勉、保密）有拘束力，指南本身沒有。適用地：新加坡。適用對象含執業律師、企業法務、替代法律服務提供者等。只有 3.1(c) 用 &quot;must&quot;。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">說明頁 <a href=\"https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/<\/a> ；PDF <a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E36\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ministry of Law, Singapore<\/b><span>Guide for Using Generative Artificial Intelligence in the Legal Sector<\/span><time>2026-03-06（說明頁頁尾 &quot;Last Updated 27 Oct 2026&quot; 是網頁更新日）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;the Supreme Court&#39;s Guide on the Use of GenAI by Court Users requires all court users, including legal professionals, to be prepared to identify GenAI use in court documents and explain how the output was verified, if asked.&quot;<\/p><p class=\"ev-tr\">最高法院的法院使用者 GenAI 指南要求所有法院使用者，包括法律專業人員，準備好在被問到時指出法院文件中哪裡用了 GenAI，並說明產出如何驗證。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（原文自稱 non-binding）；所引的 Legal Profession (Professional Conduct) Rules 2015 第 5、6 條（誠實能力勤勉、保密）有拘束力，指南本身沒有。適用地：新加坡。適用對象含執業律師、企業法務、替代法律服務提供者等。只有 3.1(c) 用 &quot;must&quot;。這是律政部指南轉述最高法院指南；最高法院指南原文未在查核檔中打開。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">說明頁 <a href=\"https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/<\/a> ；PDF <a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E37\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ministry of Law, Singapore<\/b><span>Guide for Using Generative Artificial Intelligence in the Legal Sector<\/span><time>2026-03-06（說明頁頁尾 &quot;Last Updated 27 Oct 2026&quot; 是網頁更新日）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">(b)：&quot;explain how GenAI is used in their provision of legal service. For example, which tools are used, at what stage of the legal workflow, by whom, and how the output is verified.&quot;<\/p><p class=\"ev-tr\">說明提供法律服務時怎麼用 GenAI，例如用哪些工具、在工作流程的哪個階段、由誰用、產出怎麼驗證。<\/p><p class=\"ev-line\">(c)：&quot;Clarify that while GenAI tools may be used, legal professionals retain full responsibility for the work product;&quot;<\/p><p class=\"ev-tr\">說明雖然可能使用 GenAI 工具，法律專業人員對工作成果保有全部責任。<\/p><p class=\"ev-line\">(f)：&quot;Offer clients the option to opt out of GenAI being applied in connection with their matters&quot;<\/p><p class=\"ev-tr\">提供客戶選擇其案件不使用 GenAI。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（原文自稱 non-binding）；所引的 Legal Profession (Professional Conduct) Rules 2015 第 5、6 條（誠實能力勤勉、保密）有拘束力，指南本身沒有。適用地：新加坡。適用對象含執業律師、企業法務、替代法律服務提供者等。只有 3.1(c) 用 &quot;must&quot;。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">說明頁 <a href=\"https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/<\/a> ；PDF <a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E39\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Ministry of Law, Singapore<\/b><span>Guide for Using Generative Artificial Intelligence in the Legal Sector<\/span><time>2026-03-06（說明頁頁尾 &quot;Last Updated 27 Oct 2026&quot; 是網頁更新日）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;The Firm exercises oversight to ensure that all outputs are reviewed by qualified professionals and that no client-sensitive information is disclosed to external AI systems without the requisite safeguards and your prior consent.&quot;<\/p><p class=\"ev-tr\">本所進行監督，確保所有產出都經合格專業人員審閱，且未具備必要防護與您事先同意，不會把客戶敏感資訊揭露給外部 AI 系統。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（原文自稱 non-binding）；所引的 Legal Profession (Professional Conduct) Rules 2015 第 5、6 條（誠實能力勤勉、保密）有拘束力，指南本身沒有。適用地：新加坡。適用對象含執業律師、企業法務、替代法律服務提供者等。只有 3.1(c) 用 &quot;must&quot;。範例條款，不是強制條款。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">說明頁 <a href=\"https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/launch-of-guide-for-using-generative-artificial-intelligence-in-the-legal-sector/<\/a> ；PDF <a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E40\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>中華民國律師公會全國聯合會<\/b><span>律師倫理規範(全文含對照表)；附件「115.04.18律師倫理規範全文及修正對照表.pdf」<\/span><time>頁面日期 2025-06-26；頁尾「更新日期：2026/10/28」；附件沿革最後一筆 2026-04-18<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">附件 PDF 沿革最後一筆：「115 年 4 月 18 日第 3 屆第 2 次會員代表大會增訂第 53 條之 1」。<\/p><p class=\"ev-line\">查核員從附件 PDF 抽出全文，搜尋「人工智慧」「生成式」「AI」，0 筆。律師倫理規範頁本身也沒有這些字樣。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">律師倫理規範是全聯會訂定的自律規範（台灣執業律師）。依查核修正：寫成「2026-04-18 修正後的律師倫理規範全文，沒有出現『人工智慧』『生成式』『AI』字樣」。「全聯會或台北律師公會沒有正式發布律師使用生成式 AI 的指引」只能寫成「我們沒有找到」，不能寫成「沒有」（全聯會站內搜尋讀不到結果；台北律師公會網站未查）。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.twba.org.tw/regulation/morale/65bfe5e5-1a32-47db-b2b2-3783369c8e60\" rel=\"noopener\" target=\"_blank\">https://www.twba.org.tw/regulation/morale/65bfe5e5-1a32-47db-b2b2-3783369c8e60<\/a> ；附件 <a href=\"https://www.twba.org.tw/upload/content/20260504/4f4e310aedce491898db654d751d8ace/4f4e310aedce491898db654d751d8ace.pdf\" rel=\"noopener\" target=\"_blank\">https://www.twba.org.tw/upload/content/20260504/4f4e310aedce491898db654d751d8ace/4f4e310aedce491898db654d751d8ace.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E41\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>中華民國律師公會全國聯合會<\/b><span>〈公告〉本會已通過「勞動法律」、「人工智慧（AI）與法律」兩個專業領域進修科目課綱，請參閱附件或律師學院最新公告。<\/span><time>2024-10-25<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">公告標題：「〈公告〉本會已通過「勞動法律」、「人工智慧（AI）與法律」兩個專業領域進修科目課綱，請參閱附件或律師學院最新公告。」<\/p><p class=\"ev-line\">附件檔名：「20241024AI委員會_人工智慧（AI）與法律專業課程課綱.pdf」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">進修課綱是研習課程，不是行為規範。檔名有「AI委員會」字樣，但不能據此確認委員會的正式名稱。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.twba.org.tw/news/ab9dce85-2a8b-472d-8146-ce3f4b3fb295\" rel=\"noopener\" target=\"_blank\">https://www.twba.org.tw/news/ab9dce85-2a8b-472d-8146-ce3f4b3fb295<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E43\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>金融監督管理委員會<\/b><span>金融業運用人工智慧(AI)指引<\/span><time>2024-06-20；到 2026-10-26 查不到修訂<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第三章：「(三)金融機構運用 AI 系統面對客戶時，宜告知客戶，並尊重其選擇是 否使用 AI 服務之權利及提醒是否有替代方案，以維護客戶權益。」<\/p><p class=\"ev-line\">第三章「四、尊重客戶選擇的權利及替代方案」：「(一)金融機構如運用 AI 系統向客戶提供金融服務，宜注意以下事項： 1.告知金融消費者該金融服務係由 AI 系統所提供。 2.提供資訊以便金融消費者瞭解，在正常使用過程中，AI 系統之功 能為何及由 AI 協助做出之決策可能會如何影響他們。 3.提醒金融消費者是否存在 AI 系統以外之替代方案，以讓其自行 決定是否選擇使用 AI 系統所提供之服務。」<\/p><p class=\"ev-line\">新聞稿：「本指引主要提供金融業者於導入及使用AI 時可注意的事項，是屬於行政指導性質。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">行政指導。適用對象：金融機構，以及受託的第三方業者那一側。多數用字是「宜」（建議）。不直接適用於非金融業的獨立顧問。適用地：台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞稿 <a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News<\/a> ；指引 PDF <a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E44\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>金融監督管理委員會<\/b><span>金融業運用人工智慧(AI)指引<\/span><time>2024-06-20；到 2026-10-26 查不到修訂<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第五章（「系統部署及監控」階段）：「1.金融機構使用 AI 與消費者直接互動前，宜主動告知該互動或服 務係利用 AI 系統自動完成。 2.金融機構宜依據客戶所提出之需求，視情況提供適當之說明及解 釋，尤其對於可能受到系統性不利差別待遇之客戶，金融機構可 評估以簡單易懂之方式，說明 AI 系統產出之預測、建議或其決 策基礎之邏輯，惟仍宜注意資訊過度揭露所衍生之風險。」<\/p><p class=\"ev-line\">第五章：「(四)金融機構運用 AI 系統時，宜主動向利害關係人揭露相關資訊，如 利害關係人要求進一步說明，宜適當說明所使用之資料、資料如 何影響決策，及決策對利害關係人之影響等，以提升民眾信任度。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">行政指導。適用對象：金融機構，以及受託的第三方業者那一側。多數用字是「宜」（建議）。不直接適用於非金融業的獨立顧問。適用地：台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞稿 <a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News<\/a> ；指引 PDF <a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E45\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>金融監督管理委員會<\/b><span>金融業運用人工智慧(AI)指引<\/span><time>2024-06-20；到 2026-10-26 查不到修訂<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">總則（第一章之前）：「(五)金融機構宜要求第三方業者留存執行受託辦理事項之書面或數 位作業紀錄，俾利後續追蹤、驗證及管理。」<\/p><p class=\"ev-line\">資安段落（「模型建立及驗證」階段）：「(3)針對模型、資料及提示留下相關書面或數位紀錄。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">行政指導。適用對象：金融機構，以及受託的第三方業者那一側。多數用字是「宜」（建議）。不直接適用於非金融業的獨立顧問。適用地：台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞稿 <a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News<\/a> ；指引 PDF <a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E46\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>金融監督管理委員會<\/b><span>金融業運用人工智慧(AI)指引<\/span><time>2024-06-20；到 2026-10-26 查不到修訂<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">核心原則一：「金融機構應對其使用之 AI 系統承擔相應之內、外部責任。」<\/p><p class=\"ev-line\">附錄原則二：「3.生成式 AI 產出之資訊，仍需由金融機構人員就其風險進 行客觀且專業的管控」<\/p><p class=\"ev-line\">核心原則五：「(二)金融機構使用 AI 與消費者直接互動時，應適當揭露。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">行政指導。適用對象：金融機構，以及受託的第三方業者那一側。多數用字是「宜」（建議）。不直接適用於非金融業的獨立顧問。適用地：台灣。核心原則用「應」。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">新聞稿 <a href=\"https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202406200001&amp;dtable=News<\/a> ；指引 PDF <a href=\"https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc\" rel=\"noopener\" target=\"_blank\">https://www.fsc.gov.tw/uploaddowndoc?file=news/202406201527520.pdf&amp;filedisplay=%E9%99%84%E4%BB%B6_%E9%87%91%E8%9E%8D%E6%A5%AD%E9%81%8B%E7%94%A8AI%E6%8C%87%E5%BC%95.pdf&amp;flag=doc<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E48\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>總統府（總統府公報第 7837 號）<\/b><span>人工智慧基本法<\/span><time>公布 2026-01-14；施行 2026-01-14（第 20 條）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">公報：「總統令中華民國115年1月14日華總一義字第11500001671號茲制定人工智慧基本法，公布之。」<\/p><p class=\"ev-line\">第 4 條序文：「政府推動人工智慧之研發與應用，應在兼顧社會公益、數位平權、促進創新研發與強化國家競爭力之前提下，發展良善治理與基礎建設，並遵循下列原則：」<\/p><p class=\"ev-line\">第 4 條第 5 款：「五、透明與可解釋：人工智慧之產出應做適當資訊揭露或標記，以利評估可能風險，並瞭解對相關權益之影響，進而提升人工智慧可信任度。」<\/p><p class=\"ev-line\">第 4 條第 7 款：「七、問責：應確保承擔相應之責任，包含內部治理責任及外部社會責任。」<\/p><p class=\"ev-line\">第 20 條：「本法自公布之日起施行。」<\/p><p class=\"ev-line\">罰則：本法全文（第 1 條至第 20 條）搜尋「罰」字，0 筆。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">法律（基本法，原則性規定）。第 4 條的主詞是「政府推動人工智慧之研發與應用」，是政府施政原則，不是對個別業者的具體義務。適用地：台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7\" rel=\"noopener\" target=\"_blank\">https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E49\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>總統府（總統府公報第 7837 號）<\/b><span>人工智慧基本法<\/span><time>公布 2026-01-14；施行 2026-01-14（第 20 條）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 16 條第 2 項：「各目的事業主管機關應視人工智慧應用風險管理之需要，循前項風險分類框架，訂定以風險為基礎之管理規範，並應協助相關產業自行訂定產業指引及行為規範。」<\/p><p class=\"ev-line\">第 18 條第 1 項（節錄）：「……應自本法施行後二年內，完成法規之制（訂）定、修正或廢止，及行政措施之改進。」<\/p><p class=\"ev-line\">第 19 條：「政府使用人工智慧執行業務或提供服務，應進行風險評估，規劃風險因應措施。政府應依使用人工智慧之業務性質，訂定使用規範或內控管理機制。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">法律（基本法，原則性規定）。第 4 條的主詞是「政府推動人工智慧之研發與應用」，是政府施政原則，不是對個別業者的具體義務。適用地：台灣。對民間的管理規範要等各目的事業主管機關依第 16 條訂定。「施行後二年內」約為 2028-01-14，是推算，原文沒有寫日期。各業別管理規範到 2026-10-28 的狀態未查。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7\" rel=\"noopener\" target=\"_blank\">https://www.president.gov.tw/File/Doc/d961e5b2-f8c4-424b-8993-4a52702ae8c7<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E50\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>法務部全國法規資料庫<\/b><span>個人資料保護法<\/span><time>修正公布 2025-11-11；施行日「由行政院定之」，到 2026-10-28 仍未定<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">「※本法規部分或全部條文尚未生效，最後生效日期：未定」<\/p><p class=\"ev-line\">「一百十四年十一月十一日修正第 1-1、12、18、21、22～26、41、47～49、52、53、55 條條文」；「施行日期，由行政院定之。」<\/p><p class=\"ev-line\">第 12 條第 1 項：「公務機關或非公務機關知悉所保有之個人資料被竊取、竄改、毀損、滅失或洩漏時，應通知當事人。」<\/p><p class=\"ev-line\">第 12 條第 3 項：「第一項情形，公務機關或非公務機關應採取即時有效之應變措施，防止事故之擴大，及記載相關事實、影響、已採取之因應措施，並保存相關紀錄，以備主管機關查驗。」<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">法律。修正條文已公布、尚未施行；公布日 2025-11-11，施行日未定，要分開寫。條文沒有提到 AI；把客戶個資貼進 AI 服務是否構成「洩漏」，條文沒有寫。適用地：台灣。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021\" rel=\"noopener\" target=\"_blank\">https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021<\/a> ；沿革 <a href=\"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=I0050021\" rel=\"noopener\" target=\"_blank\">https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=I0050021<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E52\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Australian Greens（澳洲綠黨）媒體稿；內容歸給參議員 Barbara Pocock 與 Penny Allman-Payne<\/b><span>Greens slam Deloitte&#39;s unethical behaviour and measly refund over AI report bungle<\/span><time>2025-10-09<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;During questioning from Senator Barbara Pocock at a Senate estimates hearing last night, the Finance Department revealed that Deloitte had refunded just $97,587 (less than a quarter) of the $440,000 contract.&quot;<\/p><p class=\"ev-tr\">昨晚參議院預算聽證會上，Barbara Pocock 參議員質詢時，財政部揭露 Deloitte 只退了 97,587 澳元，不到 44 萬澳元合約的四分之一。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：澳洲。幣別依澳洲政黨稿推定為澳元；是否含 GST 沒寫。這是綠黨的轉述，不是議事錄或財政部聲明；Hansard 沒打開。聽證推定是 2025-10-08。A$440,000 是新聞稿寫的合約金額，AusTender 合約公告沒找到。文章使用時要寫成「據澳洲綠黨新聞稿，財政部在聽證會上表示……」。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report\" rel=\"noopener\" target=\"_blank\">https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E53\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Australian Greens（澳洲綠黨）媒體稿；內容歸給參議員 Barbara Pocock 與 Penny Allman-Payne<\/b><span>Greens slam Deloitte&#39;s unethical behaviour and measly refund over AI report bungle<\/span><time>2025-10-09<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Finance admitted that it had discovered Deloitte&#39;s errors through media reporting&quot;<\/p><p class=\"ev-tr\">財政部承認，它是從媒體報導發現 Deloitte 的錯誤。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：澳洲。幣別依澳洲政黨稿推定為澳元；是否含 GST 沒寫。這是綠黨的轉述，不是議事錄或財政部聲明；Hansard 沒打開。聽證推定是 2025-10-08。A$440,000 是新聞稿寫的合約金額，AusTender 合約公告沒找到。文章使用時要寫成「據澳洲綠黨新聞稿，財政部在聽證會上表示……」。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report\" rel=\"noopener\" target=\"_blank\">https://greens.org.au/news/media-release/greens-slam-deloittes-unethical-behaviour-and-measly-refund-over-ai-report<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E55\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Government of Newfoundland and Labrador，Office of the Chief Information Officer（OCIO）<\/b><span>AI policy 頁（Responsible Use of Artificial Intelligence Technology 政策；頁面標題未逐字確認，以網址為準）<\/span><time>Original Issue Date 2025-04-17；Date Last Reviewed 2025-04-17；Version 1.0<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">第 2.0 節：&quot;This policy applies to all government departments and (hereafter also referred to as &quot;Government&quot;) including all employees, contractors, consultants, partners, students, volunteers, vendors, agents, third parties and other persons working on behalf of the Government of Newfoundland and Labrador&#39;s departments&quot;<\/p><p class=\"ev-tr\">本政策適用所有政府部門，包括為 NL 省政府各部門工作的所有員工、承包商、顧問、合作夥伴、學生、志工、廠商、代理人、第三方及其他人員。<\/p><p class=\"ev-line\">第 5.0 節：&quot;Individuals are responsible for:&quot; &quot;The accuracy of the information produced or the decision proposed by AI technology.&quot;<\/p><p class=\"ev-tr\">個人須負責：AI 技術產出的資訊、或提出的決策的正確性。<\/p><p class=\"ev-line\">第 4.0 節第 5 項陳述：核准的 AI 技術產出的資訊 &quot;must be validated by an individual for accuracy before use&quot;<\/p><p class=\"ev-tr\">使用前必須由人驗證正確性。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：加拿大，NL 省。頁面沒有提到採購或合約條款。這份政策對 Deloitte 合約有沒有約束力，沒有找到任何說法。依查核修正：引用適用對象時不要在 &quot;vendors&quot; 後加句點；「必須驗證」在第 4.0 節第 5 項陳述，「責任」在第 5.0 節；不要拿「合約簽於 2023 年」做比較。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.gov.nl.ca/exec/ocio/ai-policy/\" rel=\"noopener\" target=\"_blank\">https://www.gov.nl.ca/exec/ocio/ai-policy/<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E56\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Chicago Sun-Times（Chicago Public Media），Press Room；署名 Melissa Bell<\/b><span>Chicago Sun-Times response to May 18 special section<\/span><time>2025-05-20<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;To our great disappointment, that list was created through the use of an AI tool and recommended books that do not exist.&quot;<\/p><p class=\"ev-tr\">令我們非常失望的是，那份書單是用 AI 工具做出來的，推薦了不存在的書。<\/p><p class=\"ev-line\">&quot;It was inserted into our paper without review from our editorial team&quot;<\/p><p class=\"ev-tr\">它沒經我們編輯部審閱就放進報紙。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：美國。特刊名 &quot;Heat Index: Your Guide to the Best of Summer&quot;，2025-05-18 刊出。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://chicago.suntimes.com/press-room/2025/05/20/chicago-sun-times-response-to-may-18-special-section\" rel=\"noopener\" target=\"_blank\">https://chicago.suntimes.com/press-room/2025/05/20/chicago-sun-times-response-to-may-18-special-section<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E57\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Chicago Sun-Times（Chicago Public Media），Press Room；署名 Melissa Bell<\/b><span>Chicago Sun-Times response to May 18 special section<\/span><time>2025-05-20<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;King Features worked with a freelancer who used an AI agent to help build out this special section.&quot;<\/p><p class=\"ev-tr\">King Features 與一名自由撰稿人合作，此人用 AI 代理協助做出這份特刊。<\/p><p class=\"ev-line\">King Features（太陽報轉述）：&quot;a strict policy with our staff, cartoonists, columnists, and freelance writers against the use of AI to create content&quot;<\/p><p class=\"ev-tr\">我們對員工、漫畫家、專欄作家與自由撰稿人有嚴格政策，禁止用 AI 產出內容。<\/p><p class=\"ev-line\">King Features：&quot;We are terminating our relationship with this individual.&quot;<\/p><p class=\"ev-tr\">我們正在終止與此人的合作關係。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：美 nds<\/span><time>2025-05-29（依網址，頁面本身沒有明確發布日）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;The newsroom fact-checked all 10 stories with named sources&quot;；&quot;each of the articles had multiple errors&quot;<\/p><p class=\"ev-tr\">編輯部查核了全部 10 篇有具名來源的文章；每篇都有多處錯誤。<\/p><p class=\"ev-line\">&quot;Some included phony sources and quotes.&quot;<\/p><p class=\"ev-tr\">有些含假的消息來源與引言。<\/p><p class=\"ev-line\">書單 &quot;recommended 15 book titles with reviews, though 10 of the titles were fake while the authors were real.&quot;<\/p><p class=\"ev-tr\">推薦 15 本書並附書評，其中 10 本書名是假的，作者是真的。<\/p><p class=\"ev-line\">&quot;Hearst did not respond to multiple requests for comment&quot;<\/p><p class=\"ev-tr\">Hearst 沒回應多次置評請求。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：美國。被引述的個人或機構的原話已刪除（見刪除清單 R3-10）；若只要說「被引述的人出面否認」，依查核檔可改寫為「太陽報查核報導說，部分被引述的人或機構表示沒說過那些話或查無此人」，並標出處為太陽報查核報導。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://chicago.suntimes.com/news/2025/05/29/special-section-king-fake-book-list-errors-sun-times-review\" rel=\"noopener\" target=\"_blank\">https://chicago.suntimes.com/news/2025/05/29/special-section-king-fake-book-list-errors-sun-times-review<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E60\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Chicago Sun-Times（作者 Melissa Bell，Chicago Public Media 執行長）<\/b><span>Lessons (and an apology) from the Sun-Times CEO on that AI-generated book list<\/span><time>2025-05-29（依網址）<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;I didn&#39;t deeply investigate the editions and quickly approved the team to continue the practice in place.&quot;<\/p><p class=\"ev-tr\">我沒有深入查這些特刊，很快就核准團隊沿用既有做法。<\/p><p class=\"ev-line\">&quot;The section was licensed from the third-party content provider King Features, a division of Hearst.&quot;<\/p><p class=\"ev-tr\">這份特刊是向第三方內容供應商 King Features（Hearst 旗下）授權取得。<\/p><p class=\"ev-line\">&quot;it&#39;s likely that the team did not conduct a thorough fact-checking or copy editing process&quot;<\/p><p class=\"ev-tr\">King 的團隊「很可能」沒做徹底的事實查核或文字校對。<\/p><p class=\"ev-line\">&quot;I am sorry for our mistakes that brought us to this point&quot;<\/p><p class=\"ev-tr\">我為我們走到這一步的錯誤道歉。<\/p><p class=\"ev-line\">第三方內容 &quot;is reviewed by our new Standards team with editors from our newsrooms&quot;<\/p><p class=\"ev-tr\">由我們新成立、成員為各編輯部編輯的 Standards 團隊審閱。<\/p><p class=\"ev-line\">&quot;We don&#39;t plan to use other editorial special sections from King Features&quot;<\/p><p class=\"ev-tr\">我們不打算再用 King Features 的其他編輯特刊。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">國家：美國。道歉文的 WebFetch 回覆有截斷，只列逐字給出的部分。依查核修正：&quot;it&#39;s likely that&quot; 要保留，這是 Bell 的推測，不是確定的事實；&quot;editions&quot; 後沒有逗號。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://chicago.suntimes.com/opinion/2025/05/29/lessons-apology-from-sun-times-ceo-ai-generated-book-list\" rel=\"noopener\" target=\"_blank\">https://chicago.suntimes.com/opinion/2025/05/29/lessons-apology-from-sun-times-ceo-ai-generated-book-list<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E61\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>美國國家標準暨技術研究院（NIST）<\/b><span>NIST AI 100-1, Artificial Intelligence Risk Management Framework (AI RMF 1.0)<\/span><time>2023-01<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Trustworthy AI depends upon accountability. Accountability presupposes transparency.&quot;<\/p><p class=\"ev-tr\">可信的 AI 取決於問責。問責以透明為前提。<\/p><p class=\"ev-line\">&quot;This characteristic&#39;s scope spans from design decisions and training data to model training, the structure of the model, its intended use cases, and how and when deployment, post-deployment, or end user decisions were made and by whom.&quot;<\/p><p class=\"ev-tr\">這項特性的範圍，從設計決策、訓練資料，到模型訓練、模型結構、預定用途，以及部署、部署後或終端使用者的決策怎麼做、何時做、由誰做。<\/p><p class=\"ev-line\">&quot;Transparency is often necessary for actionable redress related to AI system outputs that are incorrect or otherwise lead to negative impacts.&quot;<\/p><p class=\"ev-tr\">AI 系統輸出錯誤或造成負面影響時，要能實際救濟，往往需要透明。<\/p><p class=\"ev-line\">&quot;A transparent system is not necessarily an accurate, privacy-enhanced, secure, or fair system.&quot;<\/p><p class=\"ev-tr\">透明的系統不一定是準確、保護隱私、安全或公平的系統。<\/p><p class=\"ev-line\">&quot;The Framework is intended to be voluntary, rights-preserving, non-sector-specific, and use-case agnostic&quot;<\/p><p class=\"ev-tr\">框架預定為自願採用、維護權利、不分產業、不限用途。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（美國聯邦機構發布，沒有罰則）。對象：設計、開發、部署或使用 AI 系統的組織。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E62\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>NIST<\/b><span>NIST AI 600-1, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile<\/span><time>2024-07<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">MS-1.1-001：&quot;Employ methods to trace the origin and modifications of digital content.&quot;（風險欄：&quot;Information Integrity&quot;）<\/p><p class=\"ev-tr\">採用方法追蹤數位內容的來源與修改。<\/p><p class=\"ev-line\">MS-2.5-003：&quot;Review and verify sources and citations in GAI system outputs during pre-deployment risk measurement and ongoing monitoring activities.&quot;（風險欄：&quot;Confabulation&quot;）<\/p><p class=\"ev-tr\">在部署前的風險量測與持續監測中，複核並查證生成式 AI 輸出裡的來源與引用。<\/p><p class=\"ev-line\">MS-2.2-002（節錄）：&quot;Document how content provenance data is tracked and how that data interacts with privacy and security.&quot;<\/p><p class=\"ev-tr\">記錄內容來源資料怎麼追蹤，以及它和隱私、資安的關係。<\/p><p class=\"ev-line\">A.1.2：&quot;Organizations&#39; use of GAI systems may also warrant additional human review, tracking and documentation, and greater management oversight.&quot;<\/p><p class=\"ev-tr\">組織使用生成式 AI，也可能需要額外的人工複核、追蹤與文件化，以及更多管理監督。<\/p><p class=\"ev-line\">第 1 節：&quot;pursuant to President Biden&#39;s Executive Order (EO) 14110 on Safe, Secure, and Trustworthy Artificial Intelligence.&quot;；&quot;The AI RMF was released in January 2023, and is intended for voluntary use&quot;<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引。表格欄名是 &quot;Suggested Action&quot;（建議動作），不是強制要求。EO 14110 後來的存廢狀態沒有查，不寫。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E63\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>NIST<\/b><span>NIST AI 600-1, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile<\/span><time>2024-07<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;Provenance metadata can include information about GAI model developers or creators of GAI content, date/time of creation, location, modifications, and sources.&quot;<\/p><p class=\"ev-tr\">來源中繼資料可以包括：模型開發者或內容創作者、建立日期時間、地點、修改紀錄與來源。<\/p><p class=\"ev-line\">&quot;When combined with other organizational accountability mechanisms, digital content transparency approaches can enable processes to trace negative outcomes back to their source, improve information integrity, and uphold public trust.&quot;<\/p><p class=\"ev-tr\">與組織的其他問責機制結合時，數位內容透明做法可以讓負面結果追回源頭、改善資訊完整性、維持公眾信任。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引。表格欄名是 &quot;Suggested Action&quot;（建議動作），不是強制要求。EO 14110 後來的存廢狀態沒有查，不寫。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E64\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>NIST<\/b><span>NIST AI 600-1, Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile<\/span><time>2024-07<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;High-integrity information can be trusted; &quot;distinguishes fact from fiction, opinion, and inference; acknowledges uncertainties; and is transparent about its level of vetting. This information can be linked to the original source(s) with appropriate evidence. High-integrity information is also accurate and reliable, can be verified and authenticated, has a clear chain of custody, and creates reasonable expectations about when its validity may expire.&quot;&quot;<\/p><p class=\"ev-tr\">高完整性的資訊可以被信任：分清事實與虛構、意見、推論；承認不確定；公開說明經過多少查核。能用適當證據連回原始來源。也準確可靠、能被查證與驗證真偽、有清楚的保管鏈，並讓人合理預期它何時可能失效。<\/p><p class=\"ev-line\">註 11：&quot;This definition of information integrity is derived from the 2022 White House Roadmap for Researchers on Priorities Related to Information Integrity Research and Development.&quot;<\/p><p class=\"ev-tr\">這個定義出自 2022 年白宮〈資訊完整性研發優先事項研究者路線圖〉。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引中的描述性定義，不是義務；定義是 NIST 引用白宮 2022 年路線圖，不是 NIST 自創。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E68\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>經濟合作暨發展組織（OECD）<\/b><span>OECD AI Principles（屬 OECD Recommendation on Artificial Intelligence）<\/span><time>2019 年通過，2024-05 更新<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">總頁：&quot;The OECD AI Principles were initially adopted in 2019 and updated in May 2024.&quot;；&quot;The OECD Recommendation on AI is the first intergovernmental standard on AI. Today, there are 47 adherents to the Principles.&quot;<\/p><p class=\"ev-tr\">原則 2019 年首次通過、2024 年 5 月更新；OECD AI 建議是第一個政府間 AI 標準，目前有 47 個遵循方。<\/p><p class=\"ev-line\">1.3：&quot;AI Actors should commit to transparency and responsible disclosure regarding AI systems. To this end, they should provide meaningful information, appropriate to the context, and consistent with the state of art: ... where feasible and useful, to provide plain and easy-to-understand information on the sources of data/input, factors, processes and/or logic that led to the prediction, content, recommendation or decision, to enable those affected by an AI system to understand the output, and, to provide information that enable those adversely affected by an AI system to challenge its output.&quot;<\/p><p class=\"ev-tr\">AI 行為者應承諾透明與負責任的揭露。為此，應依情境與當前技術提供有意義的資訊：……在可行且有用時，用淺白易懂的資訊說明資料／輸入來源，以及導致預測、內容、建議或決定的因素、過程和／或邏輯，讓受影響的人能理解輸出；並提供資訊，讓受不利影響的人能質疑輸出。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引性質的政府間建議，對遵循方是政策承諾，不是對企業直接適用的法律；頁面沒有寫是否具法律拘束力。原文附 &quot;where feasible and useful&quot;、&quot;appropriate to the context&quot; 等限定語。台灣與 OECD 的關係沒有查核，不寫。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\">1.3 <a href=\"https://oecd.ai/en/dashboards/ai-principles/P7\" rel=\"noopener\" target=\"_blank\">https://oecd.ai/en/dashboards/ai-principles/P7<\/a> ；總頁 <a href=\"https://oecd.ai/en/ai-principles\" rel=\"noopener\" target=\"_blank\">https://oecd.ai/en/ai-principles<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E69\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>經濟合作暨發展組織（OECD）<\/b><span>OECD AI Principles（屬 OECD Recommendation on Artificial Intelligence）<\/span><time>2019 年通過，2024-05 更新<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;To this end, AI actors should ensure traceability, including in relation to datasets, processes and decisions made&quot; / &quot;during the AI system lifecycle, to enable analysis of the AI system&#39;s outputs and responses to inquiry,&quot; / &quot;appropriate to the context and consistent with the state of the art.&quot;<\/p><p class=\"ev-tr\">為此，AI 行為者應確保可追溯性，包括 AI 系統生命週期中的資料集、過程與決定，以便分析輸出並回應詢問；程度要符合情境與當前技術。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引性質的政府間建議，對遵循方是政策承諾，不是對企業直接適用的法律；頁面沒有寫是否具法律拘束力。原文附 &quot;where feasible and useful&quot;、&quot;appropriate to the context&quot; 等限定語。台灣與 OECD 的關係沒有查核，不寫。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://oecd.ai/en/dashboards/ai-principles/P9\" rel=\"noopener\" target=\"_blank\">https://oecd.ai/en/dashboards/ai-principles/P9<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E70\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Coalition for Content Provenance and Authenticity（C2PA）<\/b><span>C2PA and Content Credentials Explainer<\/span><time>頁面沒有標發布日期；版本 2.3；頁尾 &quot;Copyright © 2026&quot;<\/time><\/div>\n    <div class=\"ev-k\">原文引句<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">&quot;the C2PA specifications are designed to enable global, opt-in, adoption of digital provenance techniques&quot;<\/p><p class=\"ev-tr\">C2PA 規格的設計目的，是讓全球以自願加入的方式採用數位來源技術。<\/p><p class=\"ev-line\">&quot;It is not a cure-all for misinformation, but instead seeks to mitigate against its threats in the digital domain. It complements media literacy, fact-checking, and digital forensics approaches such as deep-fake detection by providing an infrastructure to record all of that information in a tamper-evident structure, representing the provenance of any asset.&quot;<\/p><p class=\"ev-tr\">它不是錯誤資訊的萬靈丹，而是降低數位領域的威脅。它補足媒體素養、事實查核與深偽偵測等做法：提供基礎設施，把資訊記在被改動就看得出來的結構裡，代表任何素材的來源。<\/p><p class=\"ev-line\">&quot;Provenance information can help establish the truth about the origin, history and authenticity of digital content, by providing evidence for its creation, discovery, ownership and movement over time; but provenance information alone cannot tell you whether the digital content is true, accurate or factual.&quot;<\/p><p class=\"ev-tr\">來源資訊可以幫助確認數位內容的來源、歷史與真實性；但光靠來源資訊，不能告訴你內容是否真實、正確或符合事實。<\/p><p class=\"ev-line\">&quot;Content Credentials provides a way to establish provenance of content. There are no value judgments about whether the provenance data is good or bad.&quot;<\/p><p class=\"ev-tr\">內容憑證提供確立內容來源的方法，不對來源資料的好壞做價值判斷。<\/p><p class=\"ev-line\">&quot;it uses established cryptographic techniques like cryptographic hashing, Merkle trees and digital signatures to provide tamper-evident Content Credentials.&quot;<\/p><p class=\"ev-tr\">它用密碼雜湊、Merkle 樹與數位簽章等既有密碼技術，提供被改動就看得出來的內容憑證。<\/p><\/div>\n    <div class=\"ev-k\">限定條件<\/div>\n    <p class=\"ev-qual\">自願指引（產業聯盟技術規格，opt-in，不是法律）。用於純文字顧問報告的程度，沒有查。<\/p>\n    <div class=\"ev-k\">原始網址<\/div>\n    <p class=\"ev-url\"><a href=\"https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html\" rel=\"noopener\" target=\"_blank\">https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html<\/a> （2.2 版同段文字相同：<a href=\"https://spec.c2pa.org/specifications/specifications/2.2/explainer/Explainer.html\" rel=\"noopener\" target=\"_blank\">https://spec.c2pa.org/specifications/specifications/2.2/explainer/Explainer.html<\/a> ）<\/p>\n<\/section><\/template><template data-ev-src=\"E71\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Varun Magesh、Faiz Surani、Matthew Dahl、Mirac Suzgun、Christopher D. Manning、Daniel E. Ho（arXiv 預印本；通訊作者 deho@stanford.edu）<\/b><span
