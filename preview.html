lass=\"ev-item__src\"><b>The Twelve-Factor App.<\/b><time>Date not stated; accessed 2026-11-01.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“strict separation of config from code”; “The twelve-factor app stores config in environment variables”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">This is the Twelve-Factor App’s prescription for application config that varies between deploys. The page explicitly excludes internal application configuration that does not vary between deploys from its definition of config.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://www.12factor.net/config\" rel=\"noopener\" target=\"_blank\">https://www.12factor.net/config<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E22\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>National Institute of Standards and Technology (NIST).<\/b><time>Publication date not stated in the opened PDF; accessed 2026-11-01.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Proper documentation storage and access procedures allow for quick retrieval of critical information during a negative incident.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The Playbook’s suggested documentation-policy topics include scope and uses, assumptions and limitations, testing and validation results, upstream and downstream dependencies, and plans for deployment, monitoring, and change management. These are suggested actions, not a universal requirement; the AI RMF Playbook is a voluntary companion resource.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://airc.nist.gov/docs/AI_RMF_Playbook.pdf\" rel=\"noopener\" target=\"_blank\">https://airc.nist.gov/docs/AI_RMF_Playbook.pdf<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E23\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>National Institute of Standards and Technology (NIST).<\/b><time>The page identifies the content as an excerpt from NIST AI RMF 1.0 (2023); page publication date not stated.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Ongoing monitoring and periodic review of the risk management process and its outcomes are planned”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">This is Govern 1.5 in the AI RMF Core. The full subcategory also says organizational roles and responsibilities should be clearly defined, including the frequency of periodic review. The page describes AI RMF actions as not constituting a checklist or necessarily an ordered set of steps.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" rel=\"noopener\" target=\"_blank\">https://airc.nist.gov/airmf-resources/airmf/5-sec-core/<\/a><\/p>\n<\/section><\/template><template data-ev-src=\"E24\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>OpenAI.<\/b><time>Page publication date not stated; accessed 2026-11-01.<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Use git history, PR review, release tags, and feature flags to review, ship, compare, and roll back prompt changes.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The guidance appears in the section on prompts in an application and production prompts, as advice for new work using the OpenAI API. The same section says reusable prompt objects are being deprecated and gives a scheduled shutdown date for v1/prompts; the statement is provider-specific guidance.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://developers.openai.com/api/docs/guides/prompting\" rel=\"noopener\" target=\"_blank\">https://developers.openai.com/api/docs/guides/prompting<\/a><\/p>\n<\/section><\/template>\n\n        \n        <div class=\"bl-prose\">\n            <aside class=\"bl-tldr\" data-reveal>\n                <span class=\"sv-eb\">TL;DR<\/span>\n                <ol>\n                    <li>A useful handover explains where AI contributed, what information and tools shaped the work, and what you reviewed or changed.<sup class=\"cite\" data-e=\"E3 E5 E9 E10\"><a href=\"#r3\">[3]<\/a><a href=\"#r8\">[8]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/li>\n                    <li>It should also state what remains uncertain and what the client can do next. The right level of detail depends on the work and the client’s instructions.<sup class=\"cite\" data-e=\"E14 E15 E16 E17\"><a href=\"#r3\">[3]<\/a><a href=\"#r11\">[11]<\/a><a href=\"#r12\">[12]<\/a><\/sup><\/li>\n                <\/ol>\n            <\/aside>\n\n            <p>“How was this made?” is a practical question about a result: what shaped it, what you contributed, and what someone should know before relying on it. A handover can answer that question without pretending there is one universal disclosure rule or one record that fits every project.<sup class=\"cite\" data-e=\"E1 E2 E3 E8\"><a href=\"#r1\">[1]<\/a><a href=\"#r2\">[2]<\/a><a href=\"#r3\">[3]<\/a><a href=\"#r7\">[7]<\/a><\/sup><\/p>\n            <p>Use the client’s terms and the rules that apply to your work as the starting point. Then keep a concise, retrievable account of the process, your review, and any limits that matter for the next decision.<sup class=\"cite\" data-e=\"E14 E17 E22\"><a href=\"#r3\">[3]<\/a><a href=\"#r12\">[12]<\/a><a href=\"#r17\">[17]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">01<\/div>\n            <h2 id=\"disclose\">Disclose where AI contributed, while keeping legal and sector guidance in scope<\/h2>\n            <p><strong>Guidance on AI disclosure varies by context, so explain your process clearly and follow the instructions that apply to your engagement.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-1.jpg\" alt=\"A conductor adapts separate musical sections to their settings, representing context-specific guidance rather than one universal disclosure rule.\" loading=\"lazy\"><\/figure>\n            <p>Several sources discuss disclosure, but they address distinct settings. The American Bar Association’s ethics opinion concerns lawyers working under the ABA Model Rules. It says disclosure may be required when a client asks how the work was conducted or whether generative AI was used, or when engagement terms or client guidelines require it. The opinion is not a general rule for independent consultants.<sup class=\"cite\" data-e=\"E1\"><a href=\"#r1\">[1]<\/a><\/sup><\/p>\n            <p>The UK Government’s framework recommends appropriate disclosure when AI produces an output and recording which parts of a process are automated and which are controlled by people. It is guidance for government and other public-sector organisations, not a universal private-consultant requirement.<sup class=\"cite\" data-e=\"E2\"><a href=\"#r2\">[2]<\/a><\/sup><\/p>\n            <p>U.S. Copyright Office guidance has a narrower purpose: applicants seeking U.S. copyright registration must disclose AI-generated content in a submitted work and briefly explain the human author’s contributions. That registration requirement does not establish a general client-handover rule.<sup class=\"cite\" data-e=\"E4\"><a href=\"#r4\">[4]<\/a><\/sup><\/p>\n            <p>These sources do not establish one disclosure rule for every independent consultant. In practice, read the engagement terms and applicable client instructions, then describe AI’s role in the work in a way that fits those requirements.<sup class=\"cite\" data-e=\"E1 E2 E4 E17\"><a href=\"#r1\">[1]<\/a><a href=\"#r2\">[2]<\/a><a href=\"#r4\">[4]<\/a><a href=\"#r12\">[12]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">02<\/div>\n            <h2 id=\"inputs\">Give the client a traceable account of the inputs and tools behind the result<\/h2>\n            <p><strong>A concise, work-specific record can show what systems and inputs shaped the result and what changed along the way.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-2.jpg\" alt=\"A ceramic sorting table shows how a consultant can keep a concise, adaptable record of inputs, tools, and material edits.\" loading=\"lazy\"><\/figure>\n            <p>NIST describes provenance metadata that can include information about a model or content creator, the time and location of creation, modifications, and sources. It presents these as information that can be included, not as a fixed, mandatory consultant template.<sup class=\"cite\" data-e=\"E3 E5\"><a href=\"#r3\">[3]<\/a><\/sup><\/p>\n            <p>OECD principles also discuss explaining sources of data and inputs, and making datasets and processes traceable. The appropriate level depends on context, feasibility, usefulness, and the state of the art.<sup class=\"cite\" data-e=\"E7 E8\"><a href=\"#r6\">[6]<\/a><a href=\"#r7\">[7]<\/a><\/sup><\/p>\n            <p>For a particular project, you might record the AI system used, relevant source material or inputs, the prompt or instructions, when the work occurred, and material edits or selections you made. Treat these as adaptable fields: include what helps explain or continue the work, while respecting client instructions and the needs of the project.<sup class=\"cite\" data-e=\"E3 E5 E7 E8 E9\"><a href=\"#r3\">[3]<\/a><a href=\"#r6\">[6]<\/a><a href=\"#r7\">[7]<\/a><a href=\"#r8\">[8]<\/a><\/sup><\/p>\n            <p>For example, NIST’s health-data guidance describes a fuller provenance record for AI involvement in healthcare data exchanged using FHIR. It identifies the AI system, human and automated participants and their roles, inputs and prompts, and a link to the system’s model card. That guidance is specific to this health-data context; it is not a general handover standard for other work.<sup class=\"cite\" data-e=\"E6\"><a href=\"#r5\">[5]<\/a><\/sup><\/p>\n            <p>Digital asset credentials offer another example of recording origins, modifications, and AI use. C2PA explains that this kind of provenance can describe an asset’s history, but records may be incomplete and do not establish whether the asset’s content is true or accurate.<sup class=\"cite\" data-e=\"E9 E13\"><a href=\"#r8\">[8]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">03<\/div>\n            <h2 id=\"contribution\">Describe your contribution without treating prompting as proof of authorship or quality<\/h2>\n            <p><strong>Say what you actually supplied, selected, arranged, edited, or changed; do not use a process record to claim more than it can establish.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-3.jpg\" alt=\"An arranger’s garden shows that human work can involve selecting, ordering, and editing elements produced through a broader process.\" loading=\"lazy\"><\/figure>\n            <p>A useful handover separates AI-generated material from the human work that shaped the deliverable. You can identify what you supplied, which outputs you selected, what you rearranged or edited, and which parts you wrote yourself. This describes the process without making a broad claim about authorship or ownership.<sup class=\"cite\" data-e=\"E4 E10\"><a href=\"#r4\">[4]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/p>\n            <p>The U.S. Copyright Office’s report discusses prompting, expressive material authored by people and included in a work, and modifications or arrangements of AI-generated outputs as different types of human contribution. Its scope is copyrightability under U.S. copyright law; it does not create a universal rule for documenting client work.<sup class=\"cite\" data-e=\"E10\"><a href=\"#r9\">[9]<\/a><\/sup><\/p>\n            <p>A prompt may be part of the record, but by itself it does not explain every human contribution or prove the quality of the delivered work. Describe the choices and edits that actually affected the result, and keep any legal conclusions within the relevant jurisdiction and context.<sup class=\"cite\" data-e=\"E4 E10\"><a href=\"#r4\">[4]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">04<\/div>\n            <h2 id=\"review\">Tell the client what you checked and what the checks covered<\/h2>\n            <p><strong>Describe the review you performed and its limits; a record of where content came from cannot, by itself, prove that it is accurate.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-4.jpg\" alt=\"A botanical examiner records the limits of a sample review by inspecting a few leaves while the rest of the plant remains unseen.\" loading=\"lazy\"><\/figure>\n            <p>When a deliverable contains claims, citations, or other source-dependent material, identify what you checked and how far the review went. NIST recommends reviewing and verifying sources and citations in generative AI outputs as part of risk measurement and ongoing monitoring. This is voluntary cross-sector guidance, not proof that every output has been checked or that every check will catch an error.<sup class=\"cite\" data-e=\"E11\"><a href=\"#r3\">[3]<\/a><\/sup><\/p>\n            <p>A Stanford-hosted study gives a bounded example of manual checking in legal work. Researchers built a preregistered dataset of more than 200 legal queries and manually reviewed outputs from three tested systems for accuracy and fidelity to legal authority. The query count describes that research dataset, not all legal questions or systems.<sup class=\"cite\" data-e=\"E12\"><a href=\"#r10\">[10]<\/a><\/sup><\/p>\n            <p>Keep two questions separate: what the record says about the output’s origin and history, and what evidence supports its factual accuracy. C2PA says provenance can provide evidence about creation and movement over time, but provenance alone cannot tell you whether content is true, accurate, or factual.<sup class=\"cite\" data-e=\"E9 E13\"><a href=\"#r8\">[8]<\/a><\/sup><\/p>\n            <p>For a client, this distinction makes a review note more useful. Name the sources or claims you checked, the method or scope of review, and any important areas you did not verify. A traceable process helps someone inspect the work; it is not a substitute for evidence supporting the result.<sup class=\"cite\" data-e=\"E11 E13\"><a href=\"#r3\">[3]<\/a><a href=\"#r8\">[8]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">05<\/div>\n            <h2 id=\"limits\">Make assumptions, limits, and client choices visible<\/h2>\n            <p><strong>State the intended use and the conditions that affect how the client should rely on the result.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-5.jpg\" alt=\"A landscape seen through different lenses illustrates that intended use and testing conditions affect how far a result can be relied on.\" loading=\"lazy\"><\/figure>\n            <p>NIST recommends documenting the expected and acceptable context of use for a generative AI system. Its guidance includes considering assumptions, limitations, the intended environment, observed usage, potential impacts, and expectations. For a client handover, the practical point is to name the context in which you prepared the work and the assumptions that matter to its use.<sup class=\"cite\" data-e=\"E14\"><a href=\"#r3\">[3]<\/a><\/sup><\/p>\n            <p>Tests and reviews have conditions. NIST advises documenting limits on generalising results beyond the conditions under which a technology was developed, and cautions against extrapolating from narrow or anecdotal assessments. A handover should therefore avoid implying that a check under one set of conditions guarantees performance in another.<sup class=\"cite\" data-e=\"E15\"><a href=\"#r3\">[3]<\/a><\/sup><\/p>\n            <p>Client instructions may also shape whether and how AI is used. California State Bar guidance says lawyers must follow applicable client instructions or guidelines that limit AI use in a representation. That guidance concerns legal practice in California; it is not a rule for every profession or jurisdiction.<sup class=\"cite\" data-e=\"E17\"><a href=\"#r12\">[12]<\/a><\/sup><\/p>\n            <p>Singapore’s Ministry of Law guide says clients may be offered an option to opt out of generative AI being applied to their legal matters. The guide is non-binding and applies to legal work in Singapore. It notes that opting out may mean losing AI-enabled efficiencies or capabilities, using traditional processes, and experiencing slower turnaround or higher costs; these are possible effects, not guaranteed outcomes.<sup class=\"cite\" data-e=\"E16\"><a href=\"#r11\">[11]<\/a><\/sup><\/p>\n            <p>Record the client’s relevant choices and instructions, the intended use, and any assumptions or limitations that affect the result. Keep jurisdiction-specific guidance clearly labelled, and do not generalise a narrow review or legal-sector rule to every client engagement.<sup class=\"cite\" data-e=\"E14 E15 E16 E17\"><a href=\"#r3\">[3]<\/a><a href=\"#r11\">[11]<\/a><a href=\"#r12\">[12]<\/a><\/sup><\/p>\n\n            <div class=\"qf-eyebrow\">06<\/div>\n            <h2 id=\"next\">Leave a practical trail for whoever uses or maintains the work next<\/h2>\n            <p><strong>For technical deliverables, give the next person enough information to set up, inspect, and continue the work.<\/strong><\/p>\n            <figure class=\"st-media\" data-reveal><span class=\"st-ai\">Illustration · AI generated<\/span><img src=\"content/articles/ai-handover/media/h2-6.jpg\" alt=\"A living service tree with visible roots and seasonal pruning portrays ongoing review and a maintainable record over time.\" loading=\"lazy\"><\/figure>\n            <p>For a software project, a handover can include the setup steps, dependencies that need to be installed, one-off commands, and a clear way to run tests or linting. GOV.UK’s README guidance offers these as practical topics for public application repositories and notes that its page may be out of date.<sup class=\"cite\" data-e=\"E18\"><a href=\"#r13\">[13]<\/a><\/sup><\/p>\n            <p>Record meaningful code changes and the reasons for them so a future developer can understand the work. For npm projects, the package lockfile records the generated dependency tree so later installs can reproduce it despite intermediate dependency updates.<sup class=\"cite\" data-e=\"E19 E20\"><a href=\"#r14\">[14]<\/a><a href=\"#r15\">[15]<\/a><\/sup><\/p>\n            <p>Document deployment configuration separately from code where the deployment setup calls for it. The Twelve-Factor App guidance describes storing deployment-specific configuration in environment variables; it distinguishes that configuration from internal application settings that do not vary between deployments.<sup class=\"cite\" data-e=\"E21\"><a href=\"#r16\">[16]<\/a><\/sup><\/p>\n            <p>Where AI documentation matters to the work, make it retrievable. NIST’s AI RMF Playbook lists topics such as scope, uses, assumptions, limitations, test results, dependencies, and plans for deployment, monitoring, and change management. It also says that storage and access procedures can help retrieve critical information during an incident. These are voluntary suggested practices, not a universal checklist.<sup class=\"cite\" data-e=\"E22\"><a href=\"#r17\">[17]<\/a><\/sup><\/p>\n            <p>For work that continues in production, define who reviews it and when. NIST’s AI RMF Core describes planning ongoing monitoring and periodic review of risk-management outcomes; it does not present its actions as a required checklist or fixed sequence.<sup class=\"cite\" data-e=\"E23\"><a href=\"#r18\">[18]<\/a><\/sup><\/p>\n            <p>If prompts are part of an application, keep prompt changes reviewable and recoverable. OpenAI’s API guidance recommends using version-control history, pull-request review, release tags, and feature flags for production prompt changes. This is provider-specific guidance for work using the OpenAI API.<sup class=\"cite\" data-e=\"E24\"><a href=\"#r19\">[19]<\/a><\/sup><\/p>\n\n            <p>A practical handover can be short. Include the details that help this client understand the work, make a decision, or continue it safely; make the scope and limits of those details clear.<sup class=\"cite\" data-e=\"E3 E8 E14 E22\"><a href=\"#r3\">[3]<\/a><a href=\"#r7\">[7]<\/a><a href=\"#r17\">[17]<\/a><\/sup><\/p>\n            <ol class=\"st-cards\">\n                <li><span class=\"n\">01<\/span><span><strong>AI’s role.<\/strong> Identify where AI contributed, in line with the client’s instructions and applicable guidance.<sup class=\"cite\" data-e=\"E1 E2 E17\"><a href=\"#r1\">[1]<\/a><a href=\"#r2\">[2]<\/a><a href=\"#r12\">[12]<\/a><\/sup><\/span><\/li>\n                <li><span class=\"n\">02<\/span><span><strong>Inputs and tools.<\/strong> Note relevant systems, sources, prompts, and material changes when they help explain the work.<sup class=\"cite\" data-e=\"E3 E5 E7 E9\"><a href=\"#r3\">[3]<\/a><a href=\"#r6\">[6]<\/a><a href=\"#r8\">[8]<\/a><\/sup><\/span><\/li>\n                <li><span class=\"n\">03<\/span><span><strong>Your contribution.<\/strong> Describe what you selected, arranged, wrote, or modified without claiming more than the record shows.<sup class=\"cite\" data-e=\"E4 E10\"><a href=\"#r4\">[4]<\/a><a href=\"#r9\">[9]<\/a><\/sup><\/span><\/li>\n                <li><span class=\"n\">04<\/span><span><strong>Review and limits.<\/strong> State what you checked, how far the review went, and what remains uncertain.<sup class=\"cite\" data-e=\"E11 E13 E15\"><a href=\"#r3\">[3]<\/a><a href=\"#r8\">[8]<\/a><\/sup><\/span><\/li>\n                <li><span class=\"n\">05<\/span><span><strong>Next steps.<\/strong> Record intended use, relevant client choices, and practical setup or maintenance information for the next person.<sup class=\"cite\" data-e=\"E14 E16 E18 E22\"><a href=\"#r3\">[3]<\/a><a href=\"#r11\">[11]<\/a><a href=\"#r13\">[13]<\/a><a href=\"#r17\">[17]<\/a><\/sup><\/span><\/li>\n            <\/ol>\n\n            <div class=\"pd-stage bl-invite\">\n                <p>How do you explain AI’s role when a client asks how the work was made?<\/p>\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/en/survey/verify\">Take the survey <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n\n            <h2 id=\"refs\">References<\/h2>\n            <ol class=\"bl-refs\">\n                <li id=\"r1\"><span class=\"pub\">American Bar Association, Standing Committee on Ethics and Professional Responsibility<\/span><span class=\"d\">2024-07-29<\/span><a href=\"https://www.americanbar.org/content/dam/aba/administrative/professional_responsibility/ethics-opinions/aba-formal-opinion-512.pdf\" rel=\"noopener\" target=\"_blank\">ABA Formal Opinion 512<\/a><\/li>\n                <li id=\"r2\"><span class=\"pub\">UK Government<\/span><span class=\"d\">Updated 2025-12-18<\/span><a href=\"https://www.gov.uk/government/publications/data-ethics-framework/data-and-ai-ethics-framework\" rel=\"noopener\" target=\"_blank\">Data and AI Ethics Framework<\/a><\/li>\n                <li id=\"r3\"><span class=\"pub\">National Institute of Standards and Technology, U.S. Department of Commerce<\/span><span class=\"d\">2024-07<\/span><a href=\"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf\" rel=\"noopener\" target=\"_blank\">NIST AI 600-1: Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile<\/a><\/li>\n                <li id=\"r4\"><span class=\"pub\">U.S. Copyright Office<\/span><span class=\"d\">2023-03-16<\/span><a href=\"https://www.copyright.gov/ai/ai_policy_guidance.pdf\" rel=\"noopener\" target=\"_blank\">Copyright Registration Guidance: Works Containing Material Generated by Artificial Intelligence<\/a><\/li>\n                <li id=\"r5\"><span class=\"pub\">National Institute of Standards and Technology<\/span><span class=\"d\">Created 2026-08-31; updated 2026-09-15<\/span><a href=\"https://www.nist.gov/programs-projects/hl7-ai-transparency-fast-healthcare-interoperability-resources-fhir\" rel=\"noopener\" target=\"_blank\">HL7 AI Transparency: Fast Healthcare Interoperability Resources (FHIR)<\/a><\/li>\n                <li id=\"r6\"><span class=\"pub\">OECD.AI, Organisation for Economic Co-operation and Development<\/span><span class=\"d\">Date not stated<\/span><a href=\"https://oecd.ai/en/dashboards/ai-principles/P7\" rel=\"noopener\" target=\"_blank\">OECD AI Principles: Transparency and Explainability<\/a><\/li>\n                <li id=\"r7\"><span class=\"pub\">OECD.AI, Organisation for Economic Co-operation and Development<\/span><span class=\"d\">Date not stated<\/span><a href=\"https://oecd.ai/en/dashboards/ai-principles/P9\" rel=\"noopener\" target=\"_blank\">OECD AI Principles: Accountability<\/a><\/li>\n                <li id=\"r8\"><span class=\"pub\">Coalition for Content Provenance and Authenticity<\/span><span class=\"d\">Version 2.3; date not stated<\/span><a href=\"https://spec.c2pa.org/specifications/specifications/2.3/explainer/Explainer.html\" rel=\"noopener\" target=\"_blank\">C2PA and Content Credentials Explainer<\/a><\/li>\n                <li id=\"r9\"><span class=\"pub\">U.S. Copyright Office<\/span><span class=\"d\">2025-01<\/span><a href=\"https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf\" rel=\"noopener\" target=\"_blank\">Copyright and Artificial Intelligence, Part 2: Copyrightability<\/a><\/li>\n                <li id=\"r10\"><span class=\"pub\">Stanford Law School hosts the paper; authors affiliated with Stanford University and Yale University<\/span><span class=\"d\">2024-05-30<\/span><a href=\"https://law.stanford.edu/wp-content/uploads/2024/05/Legal_RAG_Hallucinations.pdf\" rel=\"noopener\" target=\"_blank\">Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools<\/a><\/li>\n                <li id=\"r11\"><span class=\"pub\">Ministry of Law, Singapore<\/span><span class=\"d\">2026-03-06<\/span><a href=\"https://www.mlaw.gov.sg/files/Guide_for_using_Generative_AI_in_the_Legal_Sector__Published_on_6_Mar_2026_.pdf\" rel=\"noopener\" target=\"_blank\">Guide for Using Generative Artificial Intelligence in the Legal Sector<\/a><\/li>\n                <li id=\"r12\"><span class=\"pub\">State Bar of California, Standing Committee on Professional Responsibility and Conduct<\/span><span class=\"d\">2026; exact release day not stated<\/span><a href=\"https://www.calbar.ca.gov/Portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf\" rel=\"noopener\" target=\"_blank\">Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law<\/a><\/li>\n                <li id=\"r13\"><span class=\"pub\">GOV.UK Developer Documentation<\/span><span class=\"d\">Last updated 2023-12-07<\/span><a href=\"https://docs.publishing.service.gov.uk/manual/readmes.html\" rel=\"noopener\" target=\"_blank\">READMEs<\/a><\/li>\n                <li id=\"r14\"><span class=\"pub\">GOV.UK Service Manual, Software engineering community<\/span><span class=\"d\">Published 2016-05-23; updated 2016-12-02<\/span><a href=\"https://www.gov.uk/service-manual/technology/maintaining-version-control-in-coding\" rel=\"noopener\" target=\"_blank\">Maintaining Version Control in Coding<\/a><\/li>\n                <li id=\"r15\"><span class=\"pub\">npm<\/span><span class=\"d\">npm CLI v11.21.1 documentation; accessed 2026-11-01<\/span><a href=\"https://docs.npmjs.com/cli/v11/configuring-npm/package-lock-json/\" rel=\"noopener\" target=\"_blank\">package-lock.json<\/a><\/li>\n                <li id=\"r16\"><span class=\"pub\">The Twelve-Factor App<\/span><span class=\"d\">Date not stated; accessed 2026-11-01<\/span><a href=\"https://www.12factor.net/config\" rel=\"noopener\" target=\"_blank\">Config<\/a><\/li>\n                <li id=\"r17\"><span class=\"pub\">National Institute of Standards and Technology<\/span><span class=\"d\">Date not stated; accessed 2026-11-01<\/span><a href=\"https://airc.nist.gov/docs/AI_RMF_Playbook.pdf\" rel=\"noopener\" target=\"_blank\">AI Risk Management Framework Playbook<\/a><\/li>\n                <li id=\"r18\"><span class=\"pub\">National Institute of Standards and Technology<\/span><span class=\"d\">AI RMF 1.0 (2023); page date not stated<\/span><a href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" rel=\"noopener\" target=\"_blank\">AI RMF Core<\/a><\/li>\n                <li id=\"r19\"><span class=\"pub\">OpenAI<\/span><span class=\"d\">Page publication date not stated; accessed 2026-11-01<\/span><a href=\"https://developers.openai.com/api/docs/guides/prompting\" rel=\"noopener\" target=\"_blank\">Prompting<\/a><\/li>\n            <\/ol>\n        <\/div>\n\n        \n        <p class=\"bl-sourced\"><a href=\"#/en/products/content\">This article was made with Qilinfish&#39;s content tool, and every sentence can be traced to its source <span class=\"arr\">→<\/span><\/a><\/p>\n    <\/article>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n Taiwan.\">\n    <meta property=\"og:url\" content=\"http://localhost:8787/en/blog/shadow-ai-en\">\n    <meta property=\"og:image\" content=\"http://localhost:8787/articles/shadow-ai-en/media/hero.jpg\">\n    <script type=\"application/ld+json\">\n    {\n      \"@context\": \"https://schema.org\",\n      \"@type\": \"Article\",\n      \"headline\": \"Does your company know which AI tools its staff are using?\",\n      \"description\": \"Nearly half of the employees who use AI admit that their use breaks company rules. This note gathers international surveys, real incidents, rules from several jurisdictions, and the situation in Taiwan.\",\n      \"datePublished\": \"2026-10-26\",\n      \"image\": \"http:\\/\\/localhost:8787\\/articles\\/shadow-ai-en\\/media\\/hero.jpg\",\n      \"url\": \"http:\\/\\/localhost:8787\\/en\\/blog\\/shadow-ai-en\",\n      \"inLanguage\": \"en\",\n      \"author\": { \"@type\": \"Organization\", \"name\": \"Qilinfish Studio\" },\n      \"publisher\": { \"@type\": \"Organization\", \"name\": \"Qilinfish Studio\" }\n    }\n    <\/script>\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\">Products<\/a>\n        <a href=\"#/en/blog\"     class=\"is-active\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/blog/shadow-ai\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/blog/shadow-ai-en\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n    <!-- page header: the picture always; with a clip, the picture shows until the clip plays -->\n    <header class=\"ab-hero\">\n        \n        <img class=\"ab-hero__video\" src=\"content/articles/shadow-ai-en/media/hero.jpg\" alt=\"\" aria-hidden=\"true\">\n        <span class=\"ab-ai\">Illustration · AI generated<\/span>\n        <div class=\"ab-hero__inner\">\n            <div class=\"qf-eyebrow\"><a class=\"bl-back\" href=\"#/en/blog\">← All articles<\/a>\n                <span aria-hidden=\"true\">·<\/span> NOTES // <time class=\"bl-date\" datetime=\"2026-10-26\">2026-10-26<\/time><\/div>\n            <h1 class=\"ab-hero__title\">Does your company know which AI tools its staff are using?<\/h1>\n            <p class=\"st-lede\">Nearly half of the employees who use AI admit that their use breaks company rules. This note gathers international surveys, real incidents, rules from several jurisdictions, and the situation in Taiwan.<\/p>\n        <\/div>\n    <\/header>\n    \n    <article class=\"bl-post\">\n        \n\n\n        \n        <div class=\"bl-prose\">\n\n            <h2 id=\"what\">What shadow AI is<\/h2>\n            <p>Shadow AI means employees finding their own AI tools for work, without the company's approval. Lawsnote, a Taiwanese legal database, defines it this way: \"Shadow AI refers to employees or members of an organization who, without approval and without management, use generative AI tools on their own to handle their work.\" (our translation)<\/p>\n            <p>The same article gives several examples:<\/p>\n            <ul>\n                <li>Pasting customer data into a free AI tool through a personal account.<\/li>\n                <li>Summarizing documents with a browser extension that was never approved.<\/li>\n                <li>An assistant searching court decisions with AI on their own, then handing the results to the lawyer.<\/li>\n                <li>A department subscribing to an AI tool privately, with no security or compliance review.<\/li>\n            <\/ul>\n            <p>The problem is not the AI itself. The problem is that the company does not know which tool was used, what went into it, or where the output ended up. When something goes wrong, it is hard to say what happened.<\/p>\n\n            <h2 id=\"how-common\">How common it is<\/h2>\n            <p>Between late 2024 and early 2025, KPMG and the University of Melbourne surveyed 48,340 people in 47 countries. Among employees who use AI for work, almost half admit to using it in ways that break their company's rules. Free public tools are used the most (70%); only 42% use tools provided by their employer.<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.1 · What employees say about themselves<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Avoided revealing that they used AI<\/span><b>61<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:61%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Used AI without knowing whether the company allowed it<\/span><b>56<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:56%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Uploaded company information to a public AI tool<\/span><b>48<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:48%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Used AI in ways that break company rules<\/span><b>44<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:44%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">KPMG × The University of Melbourne, Trust, attitudes and use of AI, 2025 · 48,340 people in 47 countries · Taiwan is not in the sample · shares are \"rarely\" or more often (report Figure 44: 100% minus \"never\")<\/span>\n            <\/figure>\n\n            <p>Managers see the same thing. In 2025, ISACA, an international IT governance association, polled 3,029 professionals in security, audit and governance: 81% believe employees in their organization use AI whether it is permitted or not, but only 28% of organizations have a formal, comprehensive AI policy. In 2026 the same poll put that figure at 38%. In 2024, Microsoft and LinkedIn surveyed 31,000 people in 31 countries and found that 78% of AI users bring their own AI tools to work.<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.2 · Employees are using it; the rules have not caught up<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Believe employees use AI whether it is permitted or not<\/span><b>81<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:81%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Organizations with a formal, comprehensive AI policy<\/span><b>28<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:28%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">ISACA 2025 AI Pulse Poll · 3,029 digital trust professionals · 2025-06<\/span>\n            <\/figure>\n\n            <h2 id=\"incidents\">What has already gone wrong<\/h2>\n            <p>IBM measures the cost of data breaches every year. Its 2025 report analyzed 600 organizations that had a breach; one in five reported a breach caused by shadow AI. Organizations with high levels of shadow AI paid on average US$670,000 more per breach. These breaches also exposed personal data and intellectual property more often than the average. Of the 600 organizations, only 37% had policies to manage AI or detect shadow AI.<\/p>\n\n            <figure class=\"bl-chart\" data-sv-grow>\n                <figcaption class=\"sv-eb\">fig.3 · What the breaches exposed<\/figcaption>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Personal data: breaches caused by shadow AI<\/span><b>65<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:65%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Personal data: overall average<\/span><b>53<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:53%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Intellectual property: breaches caused by shadow AI<\/span><b>40<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i style=\"--w:40%\"><\/i><\/div><\/div>\n                <div class=\"sv-bar\"><div class=\"sv-bar__l\"><span>Intellectual property: overall average<\/span><b>33<small>%<\/small><\/b><\/div><div class=\"sv-bar__t\"><i class=\"g\" style=\"--w:33%\"><\/i><\/div><\/div>\n                <span class=\"sv-src\">IBM Cost of a Data Breach Report 2025 · 600 breached organizations · 2024-03 to 2025-02<\/span>\n            <\/figure>\n\n            <h3>Australia: flood victims' data went into ChatGPT<\/h3>\n            <p>Between 12 and 15 March 2025, a former temporary employee of the NSW Reconstruction Authority in Australia uploaded an Excel spreadsheet to ChatGPT. The file had 10 columns and more than 12,000 rows. It held data on applicants to the Northern Rivers Resilient Homes Program (a flood recovery housing program): names, contact details, addresses, dates of birth, sensitive health information, and a small amount of financial commentary.<\/p>\n            <p>The Authority said the tool \"was not authorised by RA\". The incident was made public on 6 October 2025; at that time, up to 3,000 people were thought to be affected. An update in March 2026 confirmed the number at 2,031. The Authority has since added controls that block uploads of personal information to AI tools, and has revised its internal policies and training.<\/p>\n\n            <h3>Plug-ins for AI assistants can go wrong too<\/h3>\n            <p>Shadow AI is not only a chat window. Today's AI assistants can take plug-ins that send mail, read files and operate systems on a person's behalf. In September 2025, <code>postmark-mcp<\/code>, a plug-in in an open-source package registry that lets an AI assistant send email, was listed as malicious: from version 1.0.16 it quietly sent out the mail it handled by blind copy. If an employee installed such a plug-in on their own, the company would not know it was there.<\/p>\n\n            <h2 id=\"law\">What the rules say<\/h2>\n            <p>We found no law that uses the words \"shadow AI\". But several rules already require organizations to know how their own people use AI.<\/p>\n\n            <h3>EU AI Act: employees using ChatGPT count too<\/h3>\n            <p>Article 4 of the EU Artificial Intelligence Act has applied since 2 February 2025. It requires organizations that provide or use AI systems to take measures so that their staff have sufficient AI literacy. The European Commission's Q&amp;A answers one question directly: if employees use ChatGPT to write advertising copy or translate documents, does the company have to comply with this article? The answer is yes; staff \"should be informed about the specific risks, for example hallucination\". Since its amendment took effect in mid-July 2026, the article changed from \"ensure a sufficient level\" of AI literacy to \"support the development of AI literacy\" among staff. It no longer requires any guaranteed level, but organizations still have to take measures.<\/p>\n\n            <h3>US NIST: start by making the list<\/h3>\n            <p>The generative AI risk management profile published by the US National Institute of Standards and Technology (NIST) in July 2024 suggests that organizations inventory all third parties with access to organizational content, and establish lists of approved generative AI technologies and service providers. This is voluntary guidance, not law.<\/p>\n\n            <h3>Singapore's MAS: the first supervisory guideline to name it<\/h3>\n            <p>The Monetary Authority of Singapore issued its Guidelines on AI Risk Management on 7 October 2026; they take effect on 7 October 2027. The guidelines list \"shadow AI\" as a risk and require financial institutions in Singapore to identify consistently where AI is used across their business units and to keep an inventory of AI use. Where a use cannot be identified, institutions must still assess the risk and take measures. Examples in the guidelines include telling staff which uses are acceptable and which are not, such as not entering confidential or customer data into public AI tools.<\/p>\n\n            <h2 id=\"taiwan\">The situation in Taiwan<\/h2>\n            <p>We found no Taiwan-specific survey of \"employees using AI without approval\". The two closest sources are these. Microsoft's 2024 survey found that 84% of knowledge workers in Taiwan use generative AI at work, and that nearly 80% of AI users bring their own AI tools to work, a higher share than the global figure. In a study released in March 2026, Trend Micro surveyed 200 business and IT decision makers in Taiwan: 74% had been pressured to approve AI adoption despite security concerns, compared with 67% globally.<\/p>\n\n            <h3>Public sector: ban first, legislate later<\/h3>\n            <p>At the Executive Yuan's cabinet meeting of 31 August 2023, the National Science and Technology Council presented draft reference guidelines on the use of generative AI, asking agencies to use it responsibly and to pay attention to security, privacy, data governance and accountability. On 3 February 2025, the Executive Yuan announced that government agencies would, as a rule, stop using DeepSeek's AI services altogether. Article 11 of the amended Cyber Security Management Act, in force since 1 December 2025, provides that government agencies may not download, install or use products that are harmful to national cyber security. Article 19 of the Artificial Intelligence Basic Act, promulgated on 14 January 2026, also requires the government to set rules of use or internal control mechanisms.<\/p>\n\n            <h3>Financial sector: data cannot simply be handed to AI<\/h3>\n            <p>The Guidelines on the Use of Artificial Intelligence in the Financial Industry, issued by the Financial Supervisory Commission (FSC) in June 2024, are administrative guidance. They state that, without appropriate controls, staff of financial institutions \"must not provide generative AI with information that customers have not consented to provide\" (our translation), and they recommend that institutions build and maintain an inventory of AI models. In an April 2023 questionnaire, the FSC found that 95 financial institutions and related bodies had already restricted employees' use of generative AI, for example by using firewalls to stop the internal network from reaching ChatGPT.<\/p>\n\n            <h3>Courts: do not write your appeal with AI<\/h3>\n            <p>On 24 July 2026, in a civil judgment (2026 Su No. 867), the Taoyuan District Court reminded the parties: once you have the judgment, ask a lawyer, \"a living, breathing, licensed one. Do not ask AI, do not write your appeal with AI, and do not assume nobody can tell it was written by AI.\" (our translation)<\/p>\n\n            <h3>After an incident, you must be able to say what happened<\/h3>\n            <p>The Personal Data Protection Act was amended on 11 November 2025; the Executive Yuan will set the date it takes effect. Under the amended Article 12, when personal data is leaked, the organization must notify the data subjects, respond immediately, document the relevant facts, the impact and the measures taken, and keep the records for inspection by the competent authority; where the incident falls within a specified scope, it must also report to the authority. If the data left through an AI tool the company did not know about, these things are hard to explain.<\/p>\n\n            <div class=\"pd-stage bl-invite\">\n                <p>Has your company ever found out only afterwards that someone had used AI? We are collecting real experiences and would like to hear what you have run into.<\/p>\n            \n        <a class=\"qf-btn qf-btn--primary\" href=\"#/en/survey/verify\">Take the survey <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n\n            <h2 id=\"refs\">Sources<\/h2>\n            <ol class=\"bl-refs\">\n                <li><span class=\"pub\">Lawsnote<\/span><span class=\"d\">2026-07-21<\/span><a href=\"https://blog.lawsnote.com/2026/07/ai-%e6%99%82%e4%bb%a3%e7%9a%84%e5%88%a4%e6%b1%ba%e6%aa%a2%e7%b4%a2%ef%bd%9c%e5%be%8b%e5%b8%ab%e5%bf%85%e7%9c%8b%e7%9a%84%e5%88%a4%e6%b1%ba%e6%90%9c%e5%b0%8b%e6%9f%a5%e8%ad%89%e6%b5%81%e7%a8%8b/\" rel=\"noopener\" target=\"_blank\">Case-law research in the AI era: a verification workflow for lawyers, and the risk of shadow AI<\/a> (in Chinese)<\/li>\n                <li><span class=\"pub\">KPMG × The University of Melbourne<\/span><span class=\"d\">2025-04<\/span><a href=\"https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/05/trust-attitudes-and-use-of-ai-global-report.pdf\" rel=\"noopener\" target=\"_blank\">Trust, attitudes and use of AI: A global study 2025<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2025-06-25<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2025/digital-trust-pros-say-increased-ai-skills-and-knowledge-needed-to-advance-their-career\" rel=\"noopener\" target=\"_blank\">2025 AI Pulse Poll press release<\/a><\/li>\n                <li><span class=\"pub\">ISACA<\/span><span class=\"d\">2026-05-05<\/span><a href=\"https://www.isaca.org/about-us/newsroom/press-releases/2026/ai-use-accelerates-while-governance-and-roi-lag-says-new-isaca-research\" rel=\"noopener\" target=\"_blank\">2026 AI Pulse Poll press release<\/a><\/li>\n                <li><span class=\"pub\">Microsoft<\/span><span class=\"d\">2024-05-08<\/span><a href=\"https://news.microsoft.com/source/2024/05/08/microsoft-and-linkedin-release-the-2024-work-trend-index-on-the-state-of-ai-at-work/\" rel=\"noopener\" target=\"_blank\">Microsoft and LinkedIn release the 2024 Work Trend Index<\/a><\/li>\n                <li><span class=\"pub\">IBM<\/span><span class=\"d\">2025-07-30<\/span><a href=\"https://newsroom.ibm.com/2025-07-30-ibm-report-13-of-organizations-reported-breaches-of-ai-models-or-applications,-97-of-which-reported-lacking-proper-ai-access-controls\" rel=\"noopener\" target=\"_blank\">Cost of a Data Breach Report 2025 press release<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">2025-10-06<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/media-releases/northern-rivers-resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Northern Rivers Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">NSW Reconstruction Authority<\/span><span class=\"d\">updated 2026-03-26<\/span><a href=\"https://www.nsw.gov.au/departments-and-agencies/nsw-reconstruction-authority/resilient-homes-program-data-breach\" rel=\"noopener\" target=\"_blank\">Resilient Homes Program data breach<\/a><\/li>\n                <li><span class=\"pub\">OSV (Open Source Vulnerabilities)<\/span><span class=\"d\">2025-09-26<\/span><a href=\"https://osv.dev/vulnerability/MAL-2025-47604\" rel=\"noopener\" target=\"_blank\">MAL-2025-47604: postmark-mcp<\/a><\/li>\n  html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Every sentence, traceable to its source — Qilinfish Studio<\/title>\n    <meta name=\"description\" content=\"Content where every sentence can be traced to its source: click a number in an article to see the original quote, its qualifiers and the source URL.\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:title\" content=\"Every sentence, traceable to its source\">\n    <meta property=\"og:description\" content=\"Content where every sentence can be traced to its source: click a number in an article to see the original quote, its qualifiers and the source URL.\">\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/products/content\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/products/content\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap\" rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"backend/src/main/resources/static/css/qilinfish.css\">\n\n<\/head>\n<body>\n<div>\n    <div class=\"bg-grid\"><\/div>\n    <div class=\"bg-noise\"><\/div>\n<\/div>\n<nav class=\"qf-nav\">\n    <a href=\"#/en/about\" class=\"qf-nav__brand\">\n        <span class=\"dot\"><\/span>\n        <span class=\"ch\">麒麟魚<\/span>\n        <span class=\"en\">QILINFISH//STUDIO<\/span>\n    <\/a>\n    <div class=\"qf-nav__menu\">\n        <a href=\"#/en/about\">About<\/a>\n        <a href=\"#/en/products\" class=\"is-active\">Products<\/a>\n        <a href=\"#/en/blog\">Articles<\/a>\n        <span class=\"qf-nav__lang\">\n            <a data-lang=\"zh\" href=\"#/products/content\" hreflang=\"zh-Hant-TW\">ZH<\/a>\n            <a data-lang=\"en\" href=\"#/en/products/content\" hreflang=\"en\" class=\"is-active\">EN<\/a>\n        <\/span>\n    <\/div>\n<\/nav>\n\n<main class=\"qf-page\">\n\n    <!-- ---- 1 the demo: a real excerpt from one of our articles ---- -->\n    <section class=\"sv-section pc-open\">\n        <div class=\"sv-eb\">PRODUCT // every sentence has a source<\/div>\n        <h1 class=\"sc-title\">Every sentence, traceable to its source<\/h1>\n        \n        <div class=\"pc-demo-wrap\" data-ev-marks=\"Sources for this passage\">\n            <figure class=\"pc-demo\">\n                <div class=\"pc-demo__hint\">Click a number to see the source behind the passage<\/div>\n                <div class=\"pc-demo__text\"><p>A Stanford-hosted study gives a bounded example of manual checking in legal work. Researchers built a preregistered dataset of more than 200 legal queries and manually reviewed outputs from three tested systems for accuracy and fidelity to legal authority. The query count describes that research dataset, not all legal questions or systems.<sup class=\"cite\" data-e=\"E12\"><a href=\"/en/blog/ai-handover#r10\">[10]<\/a><\/sup><\/p><\/div>\n                <figcaption class=\"pc-demo__from\">From our article “When a Client Asks ‘How Was This Made?’: What Solo Consultants Who Work With AI Should Hand Over”<\/figcaption>\n            <\/figure>\n            \n<template data-ev-src=\"E12\"><section class=\"ev-item\">\n    <div class=\"ev-item__src\"><b>Stanford Law School hosts the paper; the authors are affiliated with Stanford University and Yale University.<\/b><time>2024-05-30 (arXiv submission; the PDF labels the manuscript “Preprint. Under review.”).<\/time><\/div>\n    <div class=\"ev-k\">Quote<\/div>\n    <div class=\"ev-q\"><p class=\"ev-line\">“Second, we manually construct a preregistered dataset of over 200 legal queries for identifying and understanding vulnerabilities in legal AI tools. We run these queries on LexisNexis, Thomson Reuters, and GPT-4 and manually review their outputs for accuracy and fidelity to authority.”<\/p><\/div>\n    <div class=\"ev-k\">Qualifiers<\/div>\n    <p class=\"ev-qual\">The “over 200” figure describes legal queries in the researchers’ preregistered dataset, not people or all legal queries. The tested systems were LexisNexis, Thomson Reuters, and GPT-4. The findings concern those tools and queries.<\/p>\n    <div class=\"ev-k\">Source URL<\/div>\n    <p class=\"ev-url\"><a href=\"https://law.stanford.edu/wp-content/uploads/2024/05/Legal_RAG_Hallucinations.pdf\" rel=\"noopener\" target=\"_blank\">https://law.stanford.edu/wp-content/uploads/2024/05/Legal_RAG_Hallucinations.pdf<\/a><\/p>\n<\/section><\/template>\n\n        <\/div>\n    <\/section>\n\n    <!-- ---- 2 why it usually breaks: five tools, five breaks; one line, one source trail ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">WHY // where the source gets lost<\/div>\n        <h2 class=\"pd-h2\">Why it usually can&#39;t be done<\/h2>\n        <div class=\"pc-chain\">\n            <div class=\"pc-chain__row pc-chain__row--broken\">\n                <b class=\"pc-chain__label\">The usual way: five tools<\/b>\n                <ol class=\"pc-steps\"><li>Research<\/li><li>Draft<\/li><li>Images<\/li><li>Layout<\/li><li>Publish<\/li><\/ol>\n                <p>Every time you switch tools, the link to the source breaks: the original quote and URL stay behind in the last tool, and the next step only gets the text.<\/p>\n            <\/div>\n            <div class=\"pc-chain__row pc-chain__row--line\">\n                <b class=\"pc-chain__label\">One line, from the question to the finished piece<\/b>\n                <ol class=\"pc-steps\"><li>Question<\/li><li>Research<\/li><li>Fact-check<\/li><li>Outline<\/li><li>Production<\/li><li>Review<\/li><li>Finished piece<\/li><\/ol>\n                <p>From the question to the finished piece it is one workflow with no switching between tools, so the source of every sentence comes along and can still be checked in the finished piece.<\/p>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 3 real examples: our articles with evidence marks, in this language; no such article, no part 3 (D59) ---- -->\n    <section class=\"sv-section sv-section--flush\" data-pc-cases>\n        <div class=\"sv-eb\">CASES // made this way<\/div>\n        <h2 class=\"pd-h2\">Real examples<\/h2>\n        <div class=\"bl-list\">\n            <a class=\"bl-card\" href=\"#/en/blog/ai-handover\">\n                <div class=\"bl-card__img\"><div class=\"bl-cover\">\n    <img src=\"content/articles/ai-handover/media/hero.jpg\" alt=\"\" loading=\"lazy\">\n    <span class=\"bl-ai\">Illustration · AI generated<\/span>\n<\/div><\/div>\n                <div class=\"bl-card__tx\">\n                    <time class=\"bl-date\" datetime=\"2026-11-01\">2026-11-01<\/time>\n                    <b>When a Client Asks “How Was This Made?”: What Solo Consultants Who Work With AI Should Hand Over<\/b>\n                    <span class=\"pd-scene__go\">Read the article <span class=\"arr\">→<\/span><\/span>\n                <\/div>\n            <\/a>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 4 how you pay: the structure only, no amounts (D10) ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"sv-eb\">PRICING // how it is paid for<\/div>\n        <h2 class=\"pd-h2\">How you pay<\/h2>\n        <div class=\"pc-pay\">\n            <p class=\"pc-pay__main\">Buy it once and keep using it; afterwards you can add a Maintenance Agreement for updates and fixes. Without one you can still keep using it; you just don&#39;t get updates.<\/p>\n            <ul class=\"pc-pay__notes\">\n                <li>The Maintenance Agreement does not include one-to-one technical support.<\/li>\n                <li>Without a Maintenance Agreement you get no updates at all, including fixes for changes in outside services (such as AI APIs).<\/li>\n            <\/ul>\n        <\/div>\n    <\/section>\n\n    <!-- ---- 5 where the product stands ---- -->\n    <section class=\"sv-section sv-section--flush\">\n        <div class=\"pd-stage\">\n            <p>This product is still being refined and is not open for use yet. First we want to hear how you checked the sources the last time you delivered content with numbers or quotes in it. Your answers will decide which part we build first.<\/p>\n            <a class=\"qf-btn qf-btn--primary\" href=\"#/en/survey/content\">Tell us how you check your sources <span class=\"arr\">→<\/span><\/a>\n        <\/div>\n    <\/section>\n<\/main>\n\n<footer class=\"qf-footer\">\n    <div class=\"qf-footer__inner\">\n        <span>© 2026 QILINFISH STUDIO  ·  qilinfish.com<\/span>\n        <span class=\"right\">deployed via cloudflare  ·  build 1.0.0<\/span>\n    <\/div>\n<\/footer>\n<script src=\"backend/src/main/resources/static/js/qilinfish.js\"><\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href^=\"#/\"]');\n  if (!a) return;\n  e.preventDefault();\n  parent.postMessage({ previewRoute: a.getAttribute('href').slice(1) }, '*');\n}, true);\ndocument.addEventListener('submit', function (e) {\n  e.preventDefault();\n  alert('預覽不會送出表單。 / Forms do not submit in the preview.');\n}, true);\n<\/script>\n<\/body>\n<\/html>\n"}, "/en/products/verify": {"title": "Products — Qilinfish Studio", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Products — Qilinfish Studio<\/title>\n    <link rel=\"alternate\" hreflang=\"zh-Hant-TW\" href=\"#/products/verify\">\n    <link rel=\"alternate\" hreflang=\"en\" href=\"#/en/products/verify\">\n    \n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnec
