<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('產品方案')}"></head>
<body>
<div th:replace="~{fragments/layout :: background}"></div>
<nav th:replace="~{fragments/layout :: navbar('products')}"></nav>

<main class="qf-page">
    <section class="qf-section">
        <div data-reveal>
            <div class="qf-eyebrow" th:text="${vb.pageSubtitle}">PRODUCTS // what we ship</div>
            <h1 class="qf-title" th:text="${vb.pageTitle}">產品方案</h1>
            <p class="qf-lede">我們的方案分成三個方向：法律領域 Agent、Agent 客製化開發、以及通用網頁與專案設計。下方切換瀏覽。</p>
        </div>

        <div class="qf-tabs" data-tabs data-reveal>
            <button data-tab="legal-agent"  class="is-active">法律 Agent <span class="count" th:text="'· ' + ${#lists.size(vb.legalAgentProducts)}">· 1</span></button>
            <button data-tab="custom-agent">Agent 客製化 <span class="count" th:text="'· ' + ${#lists.size(vb.customAgentProducts)}">· 1</span></button>
            <button data-tab="others">其他類型 <span class="count" th:text="'· ' + ${#lists.size(vb.otherProducts)}">· 2</span></button>
        </div>

        <!-- Legal Agent panel -->
        <div data-tab-panel="legal-agent" style="margin-top: 32px;">
            <div class="qf-grid qf-grid--2" data-reveal>
                <div class="qf-card" th:each="p, it : ${vb.legalAgentProducts}">
                    <div class="qf-card__index">
                        <span th:text="'// ' + ${#strings.toString(it.count).length() == 1 ? '0' + it.count : it.count}">// 01</span>
                        <span class="qf-status"
                              th:classappend="${p.status == 'available'} ? 'qf-status--available' : (${p.status == 'coming-soon'} ? 'qf-status--coming' : 'qf-status--custom')">
                            <span class="blip"></span>
                            <span th:text="${p.status}">status</span>
                        </span>
                    </div>
                    <h3 class="qf-card__title" th:text="${p.title}">title</h3>
                    <div class="qf-card__sub" th:text="${p.subtitle}">subtitle</div>
                    <p class="qf-card__desc" th:text="${p.description}">description</p>
                    <ul class="qf-card__list">
                        <li th:each="f : ${p.features}" th:text="${f}">feature</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Custom Agent panel -->
        <div data-tab-panel="custom-agent" style="display: none; margin-top: 32px;">
            <div class="qf-grid qf-grid--2">
                <div class="qf-card" th:each="p, it : ${vb.customAgentProducts}">
                    <div class="qf-card__index">
                        <span th:text="'// ' + ${#strings.toString(it.count).length() == 1 ? '0' + it.count : it.count}">// 01</span>
                        <span class="qf-status"
                              th:classappend="${p.status == 'available'} ? 'qf-status--available' : (${p.status == 'coming-soon'} ? 'qf-status--coming' : 'qf-status--custom')">
                            <span class="blip"></span>
                            <span th:text="${p.status}">status</span>
                        </span>
                    </div>
                    <h3 class="qf-card__title" th:text="${p.title}">title</h3>
                    <div class="qf-card__sub" th:text="${p.subtitle}">subtitle</div>
                    <p class="qf-card__desc" th:text="${p.description}">description</p>
                    <ul class="qf-card__list">
                        <li th:each="f : ${p.features}" th:text="${f}">feature</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Others panel -->
        <div data-tab-panel="others" style="display: none; margin-top: 32px;">
            <div class="qf-grid qf-grid--2">
                <div class="qf-card" th:each="p, it : ${vb.otherProducts}">
                    <div class="qf-card__index">
                        <span th:text="'// ' + ${#strings.toString(it.count).length() == 1 ? '0' + it.count : it.count}">// 01</span>
                        <span class="qf-status"
                              th:classappend="${p.status == 'available'} ? 'qf-status--available' : (${p.status == 'coming-soon'} ? 'qf-status--coming' : 'qf-status--custom')">
                            <span class="blip"></span>
                            <span th:text="${p.status}">status</span>
                        </span>
                    </div>
                    <h3 class="qf-card__title" th:text="${p.title}">title</h3>
                    <div class="qf-card__sub" th:text="${p.subtitle}">subtitle</div>
                    <p class="qf-card__desc" th:text="${p.description}">description</p>
                    <ul class="qf-card__list">
                        <li th:each="f : ${p.features}" th:text="${f}">feature</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/qilinfish.js}" src="/js/qilinfish.js"></script>
</body>
</html>
