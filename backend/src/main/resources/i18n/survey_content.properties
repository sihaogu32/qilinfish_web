sc.next=下一步 <span class="arr">→</span>
sc.lockNote=看到價格之後就不能改了，這樣我們才知道您原本心裡的價格。
sc.q.buy=實際定價是買斷 US$150，含 3 個月維護合約，之後每 3 個月 US$30。
sc.opt.buy.1=會買
sc.opt.buy.2=會考慮
sc.opt.buy.3=太貴
sc.opt.buy.4=不需要
sc.q.renew=維護合約到期，您會續嗎？
sc.opt.renew.1=會
sc.opt.renew.2=看當時的更新內容
sc.opt.renew.3=不會

# ---- 05 聯絡方式 ----
sc.part.5=// 05 · 聯絡方式
sc.q.name=名字
sc.err.name=> 請留下名字。
sc.q.contact=聯絡方式
sc.hint.contact=Email 或電話
sc.err.contact=> 請填一個 Email 或電話號碼。
sc.q.trial=願意之後實際試用並給回饋嗎？
sc.opt.trial.1=願意
sc.opt.trial.2=不願意

sc.submit=送出 <span class="arr">→</span>
sc.status.success=> 謝謝您。彙整報告完成後，會寄到您留的聯絡方式；開放試用時，也會優先通知您。
sc.status.saveError=> 送出暫時失敗，您填的內容還在，請稍後再按一次送出。
sc.status.error=> 還有必填的題目沒填，請看標紅的地方。
