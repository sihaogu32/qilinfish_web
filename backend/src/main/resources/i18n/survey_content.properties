# ---- 04 付費 ----
sc.part.4=// 04 · 付費
sc.q.blind=這樣的工具，一次買斷您願意付多少？
sc.aria.blind=願意付的金額（美金）
sc.opt.blind.1=不會付費
sc.opt.blind.2=不知道
