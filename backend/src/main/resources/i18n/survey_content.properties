# 文章 app 問卷 /survey/content — 中文，預設。所有 key 用 sc. 前綴（survey.properties 沒有前綴、共用同一個 MessageSource）
# 選項的「存值」寫在 SurveyContentFormModel（中文），這裡只是頁面上顯示的文字

sc.title=您交出去的內容，出處都查得到嗎？
sc.description=六分鐘的問卷：說說您最近一次交出有數字或引用的內容，怎麼確認出處、花了多久、願意付多少。
sc.eyebrow=SURVEY // where your numbers come from
sc.why=我們在做一個內容工具：每個事實都附原文，也寫明來源只支持到哪裡。想先知道，這件事在您的工作裡是不是真的麻煩、麻煩到什麼程度。
sc.deal.time.b=約 6 分鐘
sc.deal.time.s=開放題可以留空
sc.deal.privacy.b=不公開
sc.deal.privacy.s=名字和聯絡方式只有我們看得到
sc.deal.get.b=彙整報告
sc.deal.get.s=寄到您留的聯絡方式；開放試用時優先通知您
sc.req=必填

# ---- 01 關於您 ----
sc.part.1=// 01 · 關於您
sc.q.role=您最接近哪一種？
sc.opt.role.1=行銷／內容工作室
sc.opt.role.2=自由接案的內容或行銷工作者
sc.opt.role.3=研究型創作者（部落格、電子報、YouTube…）
sc.opt.role.4=其他
sc.ph.role.other=請寫下是哪一種
sc.aria.role.other=其他：請寫下是哪一種
sc.err.role=> 請選一項；選「其他」的話，請寫下是哪一種。
sc.q.team=團隊幾個人？
sc.opt.team.1=1 人
sc.opt.team.2=2–5
sc.opt.team.3=6–20
sc.opt.team.4=20 人以上
sc.q.pieces=每個月交出幾篇內容？
sc.opt.pieces.1=1–3
sc.opt.pieces.2=4–10
sc.opt.pieces.3=11–30
sc.opt.pieces.4=30 以上
sc.err.pick=> 請選一項。

# ---- 02 最近一次 ----
sc.part.2=// 02 · 最近一次
sc.q.lastPiece=最近一次交出一篇「裡面有數字或引用」的內容，是什麼、交給誰？
sc.q.howChecked=裡面的數字和引用，您是怎麼確認的？
sc.q.checkHours=確認出處大約花了多久？
sc.unit.hours=小時／每篇
sc.aria.checkHours=確認出處的時數（小時／每篇）
sc.err.hours=> 時數只能填數字，例如 2 或 1.5。
sc.q.after=交出去之後：
sc.opt.after.1=沒人問
sc.opt.after.2=有人問出處
sc.opt.after.3=有人指出錯誤
sc.opt.after.4=不知道
sc.q.afterCost=後來怎麼處理、付出什麼代價？
sc.hint.afterCost=選了「有人問出處」或「有人指出錯誤」才需要填。

