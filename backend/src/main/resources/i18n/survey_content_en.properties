# Article-app survey /survey/content — English. Every key has the sc. prefix (survey.properties has none and shares the MessageSource)
# The stored value of each option is in SurveyContentFormModel (Chinese); these are only the labels shown on the page

sc.title=Can you show where every number you deliver came from?
sc.description=A six-minute survey: the last time you delivered content with numbers or quotes in it, how you checked the sources, how long it took, and what you would pay.
sc.eyebrow=SURVEY // where your numbers come from
sc.why=We are building a content tool that keeps a source behind every sentence. First we want to know whether this is a real problem in your work, and how big a problem it is.
sc.deal.time.b=About 6 minutes
sc.deal.time.s=Open questions can be left blank
sc.deal.privacy.b=Private
sc.deal.privacy.s=Only we can see your name and contact details
sc.deal.get.b=Summary report
sc.deal.get.s=Sent to the contact you leave; first to hear when trials open
sc.req=Required

# ---- 01 about you ----
sc.part.1=// 01 · About you
sc.q.role=Which is closest to you?
sc.opt.role.1=Marketing / content studio
sc.opt.role.2=Freelance content or marketing professional
sc.opt.role.3=Research-driven creator (blog, newsletter, YouTube…)
sc.opt.role.4=Other
sc.ph.role.other=Please say which
sc.aria.role.other=Other: please say which
sc.err.role=> Please pick one; if you pick "Other", please say which.
sc.q.team=How many people are on your team?
sc.opt.team.1=Just me
sc.opt.team.2=2–5
sc.opt.team.3=6–20
sc.opt.team.4=More than 20
sc.q.pieces=How many pieces of content do you deliver a month?
sc.opt.pieces.1=1–3
sc.opt.pieces.2=4–10
sc.opt.pieces.3=11–30
sc.opt.pieces.4=More than 30
sc.err.pick=> Please pick one.

# ---- 02 the last time ----
sc.part.2=// 02 · The last time
sc.q.lastPiece=The last time you delivered a piece with numbers or quotes in it: what was it, and who was it for?
sc.q.howChecked=How did you check those numbers and quotes?
sc.q.checkHours=Roughly how long did checking the sources take?
sc.unit.hours=hours per piece
sc.aria.checkHours=Hours spent checking sources, per piece
sc.err.hours=> Hours must be a number, e.g. 2 or 1.5.
sc.q.after=After you delivered it:
sc.opt.after.1=No one asked
sc.opt.after.2=Someone asked for the sources
sc.opt.after.3=Someone pointed out an error
sc.opt.after.4=Don't know
sc.q.afterCost=What did you do about it, and what did it cost you?
sc.hint.afterCost=Only if you picked "Someone asked for the sources" or "Someone pointed out an error".

# ---- 03 how you work now ----
sc.part.3=// 03 · How you work now
sc.q.tools=Which tools do you use for content now?
sc.multi=Pick all that apply
sc.opt.tools.1=ChatGPT
sc.opt.tools.2=Claude
sc.opt.tools.3=Gemini
sc.opt.tools.4=Perplexity
sc.opt.tools.5=Jasper / Koala and other AI writing tools
sc.opt.tools.6=ComfyUI / Midjourney and other image generators
sc.opt.tools.7=None
sc.opt.tools.8=Other
sc.ph.tools.other=Please name the tool
sc.aria.tools.other=Other: please name the tool
sc.q.toolCount=From choosing a topic to delivering, how many tools do you switch between?
sc.opt.toolCount.1=1–2
sc.opt.toolCount.2=3–4
sc.opt.toolCount.3=5 or more
sc.q.moveHours=Roughly how much time goes into moving material between tools and reformatting?
sc.aria.moveHours=Hours spent moving material and reformatting, per piece
sc.q.formats=In the last month, which formats did you actually deliver?
sc.opt.formats.1=Blog posts / web pages
sc.opt.formats.2=Posts in a site back end such as WordPress
sc.opt.formats.3=Newsletters
sc.opt.formats.4=Social posts (graphics, carousels)
sc.opt.formats.5=Short videos, video scripts
sc.opt.formats.6=Slide decks
sc.opt.formats.7=Research reports, white papers (PDF)
sc.opt.formats.8=Product introductions, catalogs
sc.opt.formats.9=Other
sc.ph.formats.other=Please say which format
sc.aria.formats.other=Other: please say which format
sc.err.choices=> An option is not on the list. Please tick again.

# ---- 04 pricing ----
sc.part.4=// 04 · Pricing
sc.q.blind=For a tool like this, how much would you pay to buy it outright, once?
sc.aria.blind=Amount you would pay (US dollars)
sc.opt.blind.1=Would not pay
sc.opt.blind.2=Don't know
sc.err.blind=> Please enter an amount, or pick "Would not pay" or "Don't know".
sc.next=Next <span class="arr">→</span>
sc.lockNote=Once you have seen the price, this answer can no longer be changed. That way we know the price you had in mind.
sc.q.buy=The actual price: a one-time purchase of US$150, including a 3-month Maintenance Agreement, then US$30 every 3 months.
sc.opt.buy.1=I would buy it
sc.opt.buy.2=I would consider it
sc.opt.buy.3=Too expensive
sc.opt.buy.4=I don't need it
sc.q.renew=When the Maintenance Agreement ends, would you renew it?
sc.opt.renew.1=Yes
sc.opt.renew.2=Depends on what the updates are
sc.opt.renew.3=No

# ---- 05 contact ----
sc.part.5=// 05 · Contact
sc.q.name=Name
sc.err.name=> Please leave your name.
sc.q.contact=Contact
sc.hint.contact=Email or phone
sc.err.contact=> Please fill in an email address or phone number.
sc.q.trial=Would you be willing to try it later and give us feedback?
sc.opt.trial.1=Yes
sc.opt.trial.2=No

sc.submit=Send <span class="arr">→</span>
sc.status.success=> Thank you. Once the summary report is ready, we will send it to the contact you left, and you will be among the first to hear when trials open.
sc.status.saveError=> Sending failed for now. What you filled in is still here; please press Send again shortly.
sc.status.error=> Some required questions are still unanswered. Please check the ones marked in red.
