pc.why.broken.step.5=上線
pc.why.broken.text=每換一次工具，出處連結就斷一次：查到的原文和網址留在上一個工具裡，下一步只拿到文字。
pc.why.line.label=同一條線：從提問到成品
pc.why.line.step.1=提問
pc.why.line.step.2=研究
pc.why.line.step.3=查核
pc.why.line.step.4=大綱
pc.why.line.step.5=製作
pc.why.line.step.6=驗收
pc.why.line.step.7=成品
pc.why.line.text=從提問到成品都在同一條流程裡，不換工具，所以每一句的出處一路跟著，到成品還查得到。

