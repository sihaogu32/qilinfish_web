pc.why.eyebrow=WHY // where the source gets lost
pc.why.title=為什麼平常做不到
pc.why.broken.label=平常的做法：五個工具
pc.why.broken.step.1=查資料
pc.why.broken.step.2=寫稿
pc.why.broken.step.3=配圖
