# amount messages: SurveyController and amountError in qilinfish.js use the same wording
err.amount.invalid=> Amounts must be numbers only (no currency), e.g. 500 or 1,200.5.
err.amount.tooLong=> Amounts can have at most 16 digits.
err.extra.option=> Please pick "None" or "Don't know", or fill in an amount.
err.pay.required=> Please fill in a range, or pick "Would not pay" or "Don't know".
err.pay.partial=> Both minimum and maximum are needed; for a fixed amount, fill in the same number in both.
err.pay.range=> The maximum cannot be less than the minimum.

status.success=> Thank you. The experience you described helps more than any general opinion could. Once the summary report is ready, we will send it to the contact you left.
status.saveError=> Sending failed for now. What you filled in is still here; please press Send again shortly.
status.error=> Some required questions are still unanswered. Please check the ones marked in red.

