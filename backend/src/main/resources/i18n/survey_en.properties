req=Required

q.role=Which of these is closest to your role?
opt.role.1=Engineer
opt.role.2=Engineering or technical manager
opt.role.3=Compliance or legal
opt.role.4=Internal audit or risk management
opt.role.5=Information or IT management
opt.role.6=Product or project management
opt.role.other=Other
ph.role.other=Your role
err.role=> Please pick a role.

q.orgSize=How large is your organization?
opt.size.1=1–10 people
opt.size.2=11–50 people
opt.size.3=51–200 people
opt.size.4=201–1000 people
opt.size.5=Over 1000 people
err.orgSize=> Please pick a size.

q.situation=Most recently, which of these did you (or your team) need to do? Pick the one that happened most recently.
opt.situation.verify=Check whether AI output (code, documents, answers) was correct
opt.situation.explain=Respond to someone asking or demanding to know "how we use AI" (a manager, client, auditor or regulator)
opt.situation.inventory=Take stock of a legacy system or old code: what is in it, who uses it, whether it still runs
opt.situation.other=Other
ph.situation.other=Write down what it was
aria.situation.other=Other: write down what it was
opt.situation.none=None of these has happened
err.situation=> Please pick one; if you pick "Other", write down what it was.

q.when=Roughly when was that?
hint.when=If it is hard to recall, think back from your last report, release, audit or client inquiry.
opt.when.1=Within the past week
opt.when.2=Within the past month
opt.when.3=One to six months ago
opt.when.4=More than six months ago
err.when=> Please pick a time.

q.what=What happened that time? What made you feel it had to be dealt with, rather than left alone or used as it was?
why.what=We want to know about the moment you decided to check. No public survey has asked about this yet.
q.steps=From starting to deal with it until you felt safe handing it over, what steps did you take? Who was involved? What tools or documents did you use?
why.steps=The steps of "how you checked" are the part we most want to understand. A few steps, in order, is enough.
ph.steps=e.g. checked against the source files first, then had a colleague read it, then compared it with last year's report
err.required=> This one is required.
q.outcome=How did it turn out? Did anything slip through that you only found later?

q.hours=Roughly how much time did it take?
why.hours=How many working hours the review takes. A rough figure is fine.
inline.hours= hours,
inline.people= people involved
q.extra=Did you spend extra money because of it (tools, outsourcing, consultants, overtime)?
aria.extra=Extra money spent (US dollars)
opt.extra.none=None
opt.unknown=Don't know
q.worst=If it had not been dealt with that time, what is the worst that could have happened?

q.tried=Have you looked for or tried other approaches, tools or services? What did you try? Why did you keep using it, or why did you stop?
hint.tried=If you have not looked, please write "No", and tell us why if you can.
q.hardest=Looking back at that time, which step took the most time or left you least at ease? If that step could be different, what would you want it to be like?
q.whyNot=Do you use AI tools in your work? If so, why is there no need to check their output?

q.pay=To solve the problem above, how much would your organization be willing to pay per year?
q.pay.none=If you later needed to check AI output, respond to questions about your use of AI, or take stock of a legacy system, how much would your organization be willing to pay per year?
hint.pay=For a fixed amount, fill in the same number in both boxes.
inline.pay.min=Per year US$
inline.pay.max=to US$
ph.pay.min=Minimum
ph.pay.max=Maximum
aria.pay.min=Minimum per year (US dollars)
aria.pay.max=Maximum per year (US dollars)
opt.pay.none=Would not pay
q.message=Anything else you would like to tell us

priv=<b>Your details</b> are not published and not passed to third parties.
