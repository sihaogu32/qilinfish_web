# Survey page — English
page.title=Take the survey

# ---- opening film ----
hero.rec.where=2023-06-22 · Federal court, New York
hero.rec.warn=6 cases did not exist
hero.title=Every one of these was handed over first, <em>and caught by someone else afterwards.</em>
hero.sub=Lawyers, consultants, support staff and engineers have all had AI hand them something that was "almost right". We want to hear about your most recent time: how did you decide it was good to go?
hero.cta=Tell us about that time <span class="arr">↓</span>
hero.meta.time=TIME / <b>About 7 minutes</b>
hero.meta.privacy=PRIVACY / <b>No names or companies published</b>
hero.meta.get=YOU GET / <b>The summary report</b>
