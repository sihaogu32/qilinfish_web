q.situation=最近一次您（或您的團隊）需要做下面哪一件事？選最近發生的那一件。
opt.situation.verify=確認 AI 產出的內容（程式碼、文件、回答）是否正確
opt.situation.explain=回應別人對「我們怎麼用 AI」的詢問或要求（主管、客戶、稽核、主管機關）
opt.situation.inventory=盤點舊系統、舊程式裡有什麼、誰在用、還能不能動
opt.situation.other=其他
ph.situation.other=寫下是什麼事
aria.situation.other=其他：寫下是什麼事
opt.situation.none=以上都沒發生過
err.situation=> 請選一項；選「其他」的話，請寫下是什麼事。

q.when=那一次大約是什麼時候？
hint.when=想不起來的話，可以從最近一次交報告、上線、稽核或客戶詢問往回想。
opt.when.1=過去一週內
opt.when.2=過去一個月內
opt.when.3=一到六個月前
opt.when.4=超過半年前
err.when=> 請選一個時間。

q.what=那一次發生了什麼事？是什麼讓您覺得一定要處理，而不是直接放著或直接用？
why.what=我們想知道「決定要確認」的那一刻。目前公開的調查都沒有問過這件事。
q.steps=從開始處理到您覺得可以放心交出去，中間做了哪些步驟？誰參與？用了什麼工具或文件？
why.steps=「怎麼確認」的步驟，就是我們最想了解的部分。照順序寫幾步就好。
ph.steps=例如：先對原始檔、再請同事看一遍、最後跟去年的報告比
err.required=> 這題必填。
q.outcome=最後結果如何？有沒有漏掉什麼，後來才發現？

q.hours=大概花了多少時間？
why.hours=覆核要花多少工時。大概就好。
inline.hours= 小時，
inline.people= 個人參與
q.extra=有沒有因此另外花錢（工具、外包、顧問、加班費）？
aria.extra=另外花的錢（美金）
opt.extra.none=沒有
opt.unknown=不知道
q.worst=如果那次沒有處理，最壞可能發生什麼事？

q.tried=您有沒有找過或試過其他做法、工具或服務？試了什麼？為什麼繼續用，或為什麼不用了？
hint.tried=如果沒有找過，也請寫「沒有」，可以的話說說為什麼。
q.hardest=回想那一次，哪一個步驟最花時間或最讓您不放心？如果那一步可以變得不一樣，您希望它變成什麼樣子？
q.whyNot=您的工作裡有用到 AI 工具嗎？如果有，為什麼不需要確認它的產出？

q.pay=為了解決上述問題，您的組織每年願意付多少？
q.pay.none=如果之後需要確認 AI 產出的內容、回應別人對 AI 使用的詢問，或盤點舊系統，您的組織每年願意付多少？
hint.pay=如果是固定金額，兩格填一樣。
inline.pay.min=每年 US$
inline.pay.max=到 US$
ph.pay.min=最低
ph.pay.max=最高
aria.pay.min=每年最低金額（美金）
aria.pay.max=每年最高金額（美金）
opt.pay.none=不會付費
