# amount messages: SurveyController and amountError in qilinfish.js use the same wording
err.amount.invalid=> 金額只能填數字（不加幣別），例如 500 或 1,200.5。
err.amount.tooLong=> 金額最多 16 位數。
err.extra.option=> 請選「沒有」「不知道」，或填一個金額。
err.pay.required=> 請填金額範圍，或選「不會付費」「不知道」。
err.pay.partial=> 最低和最高都要填；如果是固定金額，兩格填一樣。
err.pay.range=> 最高金額不可小於最低金額。

status.success=> 謝謝您。您描述的那一次經驗，比任何一般性的意見都更有幫助。彙整報告完成後，會用您留的聯絡方式寄給您。
status.saveError=> 送出暫時失敗，您填的內容還在，請稍後再按一次送出。
status.error=> 還有必填的題目沒填，請看標紅的地方。

