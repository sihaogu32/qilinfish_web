# 打字機句：|| 分子句、| 分片語；一行只會在片語之間斷開。片語結尾的空白會保留。
about.what=我們幫使用 AI |且要為此負責的人，||在交出 AI 的產物之前，||抓出監督盲區的未爆彈，||而且不用|每一次每一條|都親自回到|原始出處核對。
about.what.eyebrow=WHAT
about.why.eyebrow=WHY
about.why.title=為什麼做這件事
about.story.1=我們遇過系統遷移的顧問案，也接手過規模很大、交接卻不齊全的舊系統。傳統做法是靠人一項一項讀、一項一項對，曠日費時，對人員的經驗和系統的條件要求都很高。
about.story.2=現在，很多這類工作都期待導入 AI，或者被要求導入 AI。可是傳統做法有嚴謹的流程、有專業的人，仍然會出錯；換成一個本身就不穩定的 AI 工具，風險只會更大。我們自己每天用 AI 代理寫程式，也常常遇到它回報「做完了」，打開一看，有一部分沒做，或者做的跟它說的不一樣。
about.story.3=同時，要求監管 AI 的聲音越來越多。主管、客戶、稽核都會問：「這是怎麼來的？」
about.story.4=所以我們在做一個工具，讓 AI 的結果可以被檢查，人要監督也比較省力，出了事也查得到根據。
about.story.5=我們還不知道其他行業怎麼處理這件事。律師、顧問、客服遇到的情況，可能跟我們很不一樣。這就是我們做問卷的原因。
about.way.eyebrow=WAY // 工程觀點
about.way.title=我們怎麼想事情
about.way.1=工程不是堆疊技術，是把複雜性收斂到使用者看不見的地方。
about.way.2=每一行程式碼都該為一個明確的決策服務。
about.way.3=好的系統不只能跑，還能被下一個人讀懂、改動、擴展。
about.ai=示意畫面 · AI 生成
about.cta=說說您那一次
about.also=也接 Web 開發與專案設計 → 聯絡我們
