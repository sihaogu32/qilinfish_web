server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  forward-headers-strategy: native     # behind Cloudflare Tunnel — trust XFF

spring:
  application:
    name: qilinfish-website
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
  messages:
    basename: i18n/messages
    encoding: UTF-8

  # ---- SMTP (Gmail) — used to send contact-form notifications ----
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # DB connection placeholder — disabled until needed.
  # datasource:
  #   url: jdbc:mysql://localhost:3306/qilinfish?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
  #   username: ${DB_USER:qilinfish}
  #   password: ${DB_PASSWORD:}
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Reserved DB port placeholder
qilinfish:
  db:
    reserved-port: ${QILINFISH_DB_RESERVED_PORT:3306}
    reserved-host: ${QILINFISH_DB_RESERVED_HOST:localhost}
  mail:
    from:    ${MAIL_FROM:qilinfish@gmail.com}
    to:      ${MAIL_TO:qilinfish@qilinfish.com}
    enabled: ${MAIL_ENABLED:true}
