version: "3.9"

services:
  # ---- Spring Boot app ----
  qilinfish-web:
    build: ./backend
    container_name: qilinfish-web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # SMTP (Gmail) — used to send the contact-form notification
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}        # qilinfish@gmail.com
      MAIL_PASSWORD: ${MAIL_PASSWORD}        # Google App Password (16-char)
      MAIL_FROM:     ${MAIL_FROM:-qilinfish@gmail.com}
      MAIL_TO:       ${MAIL_TO:-qilinfish@qilinfish.com}
      # Reserved DB port (not used yet)
      QILINFISH_DB_RESERVED_PORT: 3306
    networks:
      - qilin-net

  # ---- Cloudflare Tunnel ----
  # Shares the network namespace of qilinfish-web so it can reach the app via
  # loopback (http://localhost:8080) without going through Docker's embedded DNS.
  # Make sure the Tunnel's Public Hostname Service is set to http://localhost:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qilinfish-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - qilinfish-web
    network_mode: "service:qilinfish-web"

networks:
  qilin-net:
    driver: bridge
